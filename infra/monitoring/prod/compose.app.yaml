# Optional overlay for infra/app/compose.prod.yaml. Apply only after the PROD checklist is complete.
services:
  app:
    environment:
      SPRING_PROFILES_ACTIVE: prod,db,observe-prod
      ONTOP_OBSERVABILITY_JPA_STATISTICS_ENABLED: "false"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8082/actuator/health"]
  nginx:
    volumes:
      - type: bind
        source: ${PROD_MONITORING_NGINX_CONFIG_FILE:?Set the installed PROD monitoring Nginx config path}
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
# Management port 8082 is reachable only from the existing Docker network.
