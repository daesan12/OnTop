name: ontop-monitor-prod
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    networks: [monitoring, prod-app]
    mem_limit: 512m
    cpus: 0.5
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: &logging
      driver: local
      options: {max-size: "10m", max-file: "3"}
  mysql-exporter:
    image: prom/mysqld-exporter:v0.17.2
    restart: unless-stopped
    command: ["--config.my-cnf=/run/secrets/mysql-exporter-config"]
    secrets:
      - source: mysql-exporter-config
        target: mysql-exporter-config
    networks: [monitoring]
    mem_limit: 128m
    cpus: 0.15
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging
networks:
  monitoring:
  prod-app:
    external: true
    name: ${PROD_APP_NETWORK:?Confirm the actual PROD application Docker network}
volumes:
  prometheus-data:
secrets:
  mysql-exporter-config:
    file: ${MYSQL_EXPORTER_CONFIG_FILE:?Prepare the PROD-only read-only DB account file}
