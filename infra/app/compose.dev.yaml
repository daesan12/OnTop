name: ontop-dev-app

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: ontop_dev
      MYSQL_USER: ontop_dev
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
      TZ: UTC
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    secrets:
      - mysql_root_password
      - mysql_app_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the private Docker Hub image}
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:?Set APP_ENV_FILE outside the repository}
    environment:
      SPRING_PROFILES_ACTIVE: db
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      DB_PASSWORD_FILE: /run/secrets/mysql_app_password
    secrets:
      - mysql_app_password
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ${NGINX_CONFIG_FILE:?Set NGINX_CONFIG_FILE to the bootstrap or TLS config}
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ACME_WEBROOT_DIR:?Set ACME_WEBROOT_DIR}
        target: /var/www/certbot
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_DIR:?Set TLS_DIR}
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false

volumes:
  mysql-data:

secrets:
  mysql_root_password:
    file: ${DEV_MYSQL_ROOT_PASSWORD_FILE:?Set DEV_MYSQL_ROOT_PASSWORD_FILE outside the repository}
  mysql_app_password:
    file: ${DEV_MYSQL_APP_PASSWORD_FILE:?Set DEV_MYSQL_APP_PASSWORD_FILE outside the repository}
