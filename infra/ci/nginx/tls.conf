server {
    listen 80;
    server_name ci.on-top.world;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ci.on-top.world;
    server_tokens off;
    ssl_certificate /etc/nginx/ci-tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/ci-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    # GitLab plugin validates a per-job secret token at this endpoint.
    location ^~ /project/ {
        proxy_pass http://host.docker.internal:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Administrators use an SSH tunnel to 127.0.0.1:8081.
    location / {
        return 403;
    }
}

