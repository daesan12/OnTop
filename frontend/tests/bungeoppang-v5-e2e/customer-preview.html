<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," /><title>붕어빵 손님 · 레퍼런스 기반 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2ede5;color:#3e3129;font:14px/1.6 'Malgun Gothic',system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:28px 32px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}h1{font-size:28px;letter-spacing:-1px;margin:0 0 4px}header p{color:#817164;margin:0}.badge{white-space:nowrap;font-size:12px;color:#7b6857;border:1px solid #d9ccbb;border-radius:30px;padding:6px 12px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:stretch}.viewer{border:1px solid #d9ccbb;border-radius:16px;background:#f8f4ee;overflow:hidden}.stage{position:relative;height:min(68vh,720px);min-height:400px;touch-action:none;background:#f1ebe2}.stage canvas{display:block;width:100%;height:100%}.label{position:absolute;top:18px;left:20px;pointer-events:none;color:#786654;font-size:12px;z-index:1}.status{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#786654;padding:32px;z-index:2;background:#f1ebe2}.status[hidden]{display:none}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid #e0d5c7;flex-wrap:wrap}.group{display:flex;gap:3px;flex-wrap:wrap}button{font:inherit;font-size:13px;cursor:pointer;padding:8px 13px;border-radius:8px;border:1px solid transparent;background:transparent;color:#75614e}button[aria-pressed=true]{background:#66503c;color:#fff9ed}button:focus-visible{outline:3px solid #bf8a48;outline-offset:2px}button:hover{border-color:#b7a18c}button:disabled{opacity:.45;cursor:wait}.turn{border:1px solid #d2c1ad;background:#f4ecdf}.reference{margin:0;padding:16px;border:1px solid #d9ccbb;border-radius:16px;background:#faf7f2;display:flex;flex-direction:column;justify-content:center}.reference img{display:block;width:100%;height:auto;max-height:550px;object-fit:contain;border-radius:8px}.reference figcaption{margin-top:14px;color:#8c7967;font-size:12px}.reference strong{display:block;font-size:14px;color:#554131;margin-bottom:3px}.hint{display:flex;justify-content:space-between;gap:12px;margin-top:14px;color:#8d7a68;font-size:12px}.hint p{margin:0}
@media(max-width:850px){main{padding:18px 14px}.workspace{grid-template-columns:minmax(0,1fr) 200px;gap:12px}h1{font-size:23px}.stage{height:65vh;min-height:360px}.reference{padding:10px}.badge{display:none}.toolbar{padding:10px}button{padding:7px 9px;font-size:12px}}
@media(max-width:600px){header{margin-bottom:14px}.workspace{grid-template-columns:1fr}.stage{height:60vh;min-height:380px}.reference{display:grid;grid-template-columns:90px 1fr;gap:16px;align-items:center}.reference img{max-height:130px}.reference figcaption{margin:0}.hint{display:block}.hint p+p{margin-top:4px}h1{font-size:22px}.toolbar{gap:10px}.group{gap:1px}}
</style>
<style>
.characters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:18px}.characters button{display:flex;align-items:center;gap:10px;text-align:left;padding:8px;border:1px solid #d9ccbb;background:#faf7f2;border-radius:12px;color:#715b48;min-width:0}.characters button[aria-pressed=true]{border-color:#9d724c;background:#66503c;color:#fff9ed}.characters img{width:40px;height:60px;object-fit:cover;border-radius:6px;background:#eeeae4}.characters span{font-size:13px;line-height:1.4}.characters small{display:block;font-size:10px;opacity:.65;margin-top:2px}.stage{height:min(61vh,650px)}.badge a{color:inherit;text-underline-offset:3px}@media(max-width:1000px){.characters{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){.characters{gap:6px;margin-bottom:12px}.characters button{padding:5px;gap:5px}.characters img{width:27px;height:42px}.characters span{font-size:11px}.characters small{font-size:9px}.stage{height:60vh}}
</style>
</head>
<body><main>
<header><div><h1 id="character-name">활발한 아이</h1><p id="character-description">빨간 목도리와 포근한 겨울옷을 입은 손님</p></div><span class="badge">게임용 손님 · <a href="./customer-references.html">손님 모아보기</a></span></header>
<nav class="characters" aria-label="미리 볼 손님">
<button data-customer="boy-red-scarf" aria-pressed="true"><img src="/art/bungeoppang/customers/boy-red-scarf-preview-v1.webp" alt="" /><span>활발한 아이<small>빨간 목도리</small></span></button>
<button data-customer="student-brown-coat" aria-pressed="false" disabled><img src="/art/bungeoppang/customers/student-brown-coat-preview-v1.webp" alt="" /><span>대학생<small>갈색 코트</small></span></button>
<button data-customer="worker-earmuffs" aria-pressed="false" disabled><img src="/art/bungeoppang/customers/worker-earmuffs-preview-v1.webp" alt="" /><span>귀마개 직장인<small>검정 패딩</small></span></button>
<button data-customer="older-flat-cap" aria-pressed="false" disabled><img src="/art/bungeoppang/customers/older-flat-cap-preview-v1.webp" alt="" /><span>중년 손님<small>체크 목도리</small></span></button>
<button data-customer="girl-pink-hat" aria-pressed="false" disabled><img src="/art/bungeoppang/customers/girl-pink-hat-preview-v1.webp" alt="" /><span>분홍 모자 아이<small>토끼 가방</small></span></button>
<button data-customer="woman-glasses-bun" aria-pressed="false" disabled><img src="/art/bungeoppang/customers/woman-glasses-bun-preview-v1.webp" alt="" /><span>안경 쓴 여성<small>올림머리</small></span></button>
</nav>
<div class="workspace">
<section class="viewer" aria-label="손님 캐릭터 3D 미리보기">
<div class="stage" id="stage"><span class="label">실제 3D 모델 · 드래그로 회전</span><div class="status" id="status" role="status">3D 모델을 불러오고 있어요.</div></div>
<div class="toolbar">
<div class="group" aria-label="손님 동작"><button data-motion="idle" aria-pressed="true">대기</button><button data-motion="walk" aria-pressed="false">걷기</button></div>
<div class="group" aria-label="캐릭터 방향"><button data-angle="0" aria-pressed="true">정면</button><button data-angle="90" aria-pressed="false">옆면</button><button data-angle="180" aria-pressed="false">뒷면</button><button data-angle="270" aria-pressed="false">반대쪽</button></div>
<div class="group" aria-label="보기 크기"><button data-view="body" aria-pressed="true">전신</button><button data-view="face" aria-pressed="false">얼굴 확대</button><button class="turn" id="auto" aria-pressed="false">자동 회전</button></div>
</div>
</section>
<figure class="reference"><img id="reference-image" src="/art/bungeoppang/customers/boy-red-scarf-reference-v1.png" alt="활발한 아이 제작용 전신 이미지" /><figcaption><strong>제작 기준 이미지</strong>첨부하신 손님 이미지에서 얼굴과 머리카락, 겨울옷의 느낌을 반영했어요.</figcaption></figure>
</div>
<footer class="hint"><p>드래그로 회전 · 휠 또는 두 손가락으로 확대/축소</p><p>경량화 모델 · 대기 / 걷기 · 미니게임 v5 적용</p></footer>
</main><script type="module" src="./customerPreview.ts"></script></body></html>
