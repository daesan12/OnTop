            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: AUTH_AUTHENTICATION_REQUIRED / AUTH_INVALID_ACCESS_TOKEN /
            AUTH_MEMBER_STATE_CHANGED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "403":
          description: AUTH_ORIGIN_NOT_ALLOWED / AUTH_ACCESS_DENIED / AUTH_REQUEST_REJECTED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "500":
          description: AUTH_TOKEN_CONFIGURATION_ERROR
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "503":
          description: AUTH_MEMBER_LOOKUP_UNAVAILABLE
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - AccessJwt: []
    delete:
      tags:
      - User
      summary: 회원 탈퇴
      description: "회원 행을 잠그고 deleted_at 기록 및 모든 Refresh 계열 폐기를 한 DB 트랜잭션에서 수행합니다\
        . 커밋 후 모든 WebSocket을 4403으로 종료합니다. 게임 연결부가 등록돼 있으면 MEMBER_DEACTIVATED로 즉시\
        \ 이탈을 요청하며, 경기 전체 종료·지갑 정산 완료와는 구분합니다. 회원/관련 기록을 영구 삭제하지 않습니다. 기존 OAuth는 7일\
        \ 이내 복구하며 7일 초과 재가입은 보류합니다. 이미 탈퇴한 회원의 JWT는 401입니다."
      operationId: withdraw
      responses:
        "204":
          description: 성공. 응답 본문 없음
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
        "401":
          description: AUTH_AUTHENTICATION_REQUIRED / AUTH_INVALID_ACCESS_TOKEN /
