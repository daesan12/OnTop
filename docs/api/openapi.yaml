  /api/v1/feedback:
    post:
      tags:
      - FEEDBACK
      summary: 소리함 비공개 의견 접수
      description: 회원·operationId별 중복 접수 방지. 본문 공개 방송 없음.
      operationId: submit_1
      requestBody:
        content:
          application/json:
            schema:
              required:
              - operationId
              - channelId
              - text
              type: object
              properties:
                operationId:
                  pattern: "^[A-Za-z0-9_-]{1,64}$"
                  type: string
                channelId:
                  minLength: 1
                  type: string
                  description: "Java isBlank=false, 최대 64 UTF-16 단위. 서버의 현재 채널·위치·\
                    활동도 검사합니다."
                  x-utf16-max-length: 64
                text:
                  type: string
                  description: 원문 UTF-16 600단위 이하. NFC → 제어/Cf 문자 제거 → JS trim 후 5~600
                    UTF-16 단위. 코드포인트 길이인 minLength와 다릅니다.
                  x-utf16-max-length: 600
                  x-normalized-utf16-min-length: 5
              additionalProperties: false
        required: true
      responses:
        "201":
          description: 접수 또는 동일 요청의 기존 영수증
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackReceiptResponse"
        "409":
          description: IDEMPOTENCY_CONFLICT / NOT_IN_CHANNEL / FEEDBACK_ACTIVITY_CONFLICT
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackErrorResponse"
        "429":
          description: "FEEDBACK_COOLDOWN, nextAllowedAt 포함"
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackErrorResponse"
        "400":
          description: INVALID_REQUEST / FEEDBACK_TEXT_INVALID
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackErrorResponse"
        "401":
          description: 활성 회원 인증 필요
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/FeedbackErrorResponse"
        "403":
          description: FEEDBACK_OUT_OF_RANGE / FEEDBACK_ADMIN_REQUIRED
