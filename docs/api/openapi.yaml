      description: "서버 검증 결과만 사용하며 중복 지급하지 않습니다. local,db 또는 dev,db에서 사용하며, 운영 prod,db에\
        서도 기능 플래그로 활성화할 수 있습니다. dev는 기본 활성화하며 공통 스키마에 V110/V111, v4 초기화 V124, 납품 영\
        수증 V125, 최종 정산 V126을 추가합니다. 운영은 DB 이력과 마이그레이션 위치 검토가 먼저 필요합니다. 버전 생략은 기존 v2이\
        고 v4는 명시적으로 선택합니다. v4는 납품 승인·checkpoint·다음 주문, 마지막 미승인 납품 검증, 영속 멱등 완료와 Wallet\
        \ 일일 한도 지급을 제공합니다. v2는 60초, 5점당 1냥, 모든 미니게임 합산 KST 하루 500냥 상한을 사용합니다. 탭 이동\
        \ 중에도 시간은 흐르며, v4·v5는 F1 설명서 일시정지 API와 점수·최대 콤보 랭킹을 제공합니다. score·rewardAmount·\
        userId를 본문에 넣지 않습니다. 상태 GET도 지갑 잠금과 만료 세션 INVALID 갱신을 수행할 수 있습니다. 읽기 전용 트랜\
        잭션이 아닙니다. v5(신규 판 120초·90초부터 가속, 기존 v5-20261027.1 판은 저장된 180초·150초 규칙 유지,\
