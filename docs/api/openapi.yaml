openapi: 3.0.1
info:
  title: OnTop API
  description: OnTop REST API Documentation
  version: 0.0.1-SNAPSHOT
servers:
- url: /
  description: 현재 문서 서버 (local/dev)
tags:
- name: Bungeoppang Ranking
  description: 붕어빵 버전별 개인 최고 기록
- name: WALLET
  description: 인증된 본인의 지갑 조회
- name: Ranking
  description: 보유 엽전 랭킹
- name: Park Ranking
  description: 공원 랭킹판의 보유량 목록과 미니게임 우승자
- name: FITNESS
  description: 운동기구 보상 상태 조회
- name: HISTORY
  description: 인증된 본인의 종료 경기 내역과 게임별 전적
paths:
  /api/v1/events/winnings/weeks/{weekStart}/contact:
    put:
      tags:
      - Event Winner Contacts
      summary: 발표된 당첨자 본인의 연락처 제출·기한 내 수정
      operationId: submitContact
      parameters:
      - name: weekStart
        in: path
        required: true
        schema:
          type: string
          format: date
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContactResponse"
      security:
      - AccessJwt: []
  /api/v1/admin/operations/status:
    get:
      tags:
      - ADMIN
      summary: 관리자 서비스 운영 상태 조회
      operationId: status
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ServiceOperationResponse"
      security:
      - AccessJwt: []
    put:
      tags:
      - ADMIN
      summary: 서비스 배출·점검·정상 상태 전환
      operationId: update
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceOperationUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ServiceOperationResponse"
      security:
      - AccessJwt: []
  /api/v1/admin/operations/skins/{id}:
    get:
      tags:
      - SKIN
      summary: 스킨 등록 상세 복구
      operationId: getSkinRegistration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: object
      security:
      - AccessJwt: []
    put:
      tags:
      - SKIN
      summary: 스킨 정보 수정
      description: "version 충돌 시409, 공개한 상품의 등급·구성 변경 금지"
      operationId: updateSkinRegistration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Save"
        required: true
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: object
      security:
      - AccessJwt: []
  /api/v1/admin/operations/skins/sets/{id}:
    put:
      tags:
      - SKIN
      summary: 미공개 세트 수정
      description: "부위 중복409, 공개 이후 구성 변경409"
      operationId: updateSkinSet
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Save"
        required: true
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: object
      security:
      - AccessJwt: []
  /api/v1/admin/operations/entry-news/{id}:
    put:
      tags:
      - ENTRY_NEWS
      summary: 관리자 접속 안내 수정
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryNewsSaveRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EntryNewsItem"
      security:
      - AccessJwt: []
    post:
      tags:
      - ENTRY_NEWS
      summary: 관리자 접속 안내 이미지 등록
      operationId: create
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryNewsSaveRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EntryNewsItem"
      security:
      - AccessJwt: []
    delete:
      tags:
      - ENTRY_NEWS
      summary: 관리자 접속 안내 삭제
      operationId: remove
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: 삭제 완료
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
      security:
      - AccessJwt: []
  /api/v1/admin/operations/entry-news/order:
    put:
      tags:
      - ENTRY_NEWS
      summary: 관리자 접속 안내 순서 저장
      operationId: reorder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementOrderRequest"
        required: true
      responses:
        "204":
          description: 순서 저장 완료
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
      security:
      - AccessJwt: []
  /api/v1/admin/operations/announcements/{id}:
    put:
      tags:
      - ANNOUNCEMENT
      summary: 관리자 공지 수정
      operationId: update_2
      parameters:
      - name: id
        in: path
        description: 공지 UUID
        required: true
        schema:
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementRequest"
        required: true
      responses:
        "400":
          description: ANNOUNCEMENT_INVALID
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "409":
          description: ANNOUNCEMENT_CONFLICT
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "200":
          description: 저장된 공지
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementResponse"
        "401":
          description: 로그인 필요
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "403":
          description: 접근 권한 없음
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "503":
          description: 공지 저장소 준비 중 또는 조회 실패
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - AccessJwt: []
    post:
      tags:
      - ANNOUNCEMENT
      summary: 관리자 공지 생성·같은 ID 재시도
      operationId: create_1
      parameters:
      - name: id
        in: path
        description: 공지 UUID
        required: true
        schema:
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementRequest"
        required: true
      responses:
        "400":
          description: ANNOUNCEMENT_INVALID
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "409":
          description: ANNOUNCEMENT_CONFLICT
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "200":
          description: 저장된 공지
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementResponse"
        "401":
          description: 로그인 필요
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "403":
          description: 접근 권한 없음
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "503":
          description: 공지 저장소 준비 중 또는 조회 실패
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - AccessJwt: []
    delete:
      tags:
      - ANNOUNCEMENT
      summary: 관리자 공지 삭제
      operationId: remove_1
      parameters:
      - name: id
        in: path
        description: 공지 UUID
        required: true
        schema:
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
          format: uuid
      - name: version
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "400":
          description: ANNOUNCEMENT_INVALID
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "409":
          description: ANNOUNCEMENT_CONFLICT
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "204":
          description: 처리 완료
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
        "401":
          description: 로그인 필요
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "403":
          description: 접근 권한 없음
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "503":
          description: 공지 저장소 준비 중 또는 조회 실패
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - AccessJwt: []
  /api/v1/admin/operations/announcements/order:
    put:
      tags:
      - ANNOUNCEMENT
      summary: 관리자 공지 카드 순서 일괄 저장
      operationId: reorder_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementOrderRequest"
        required: true
      responses:
        "400":
          description: ANNOUNCEMENT_INVALID
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "409":
          description: ANNOUNCEMENT_CONFLICT
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "204":
          description: 처리 완료
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
        "401":
          description: 로그인 필요
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "403":
          description: 접근 권한 없음
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "503":
          description: 공지 저장소 준비 중 또는 조회 실패
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - AccessJwt: []
  /api/v1/admin/events/winners/{winnerId}/delivery:
    put:
      tags:
      - Event Winner Contacts
      summary: 관리자가 실제 경품 전달 후 당첨 건별 지급 완료 기록
      operationId: confirmDelivery
      parameters:
      - name: winnerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DeliveryResponse"
      security:
      - AccessJwt: []
  /api/v1/admin/events/minigames/rounds/{weekStart}/games/{gameCode}:
    put:
      tags:
      - Event Awards
      summary: 주차별 검증 미니게임 기간·상품 설정
      operationId: configure
      parameters:
      - name: weekStart
        in: path
        required: true
        schema:
          type: string
          format: date
      - name: gameCode
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklyMinigameConfiguration"
        required: true
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WeeklyMinigameGameConfig"
      security:
      - AccessJwt: []
  /api/v1/users/onboarding:
    post:
      tags:
      - User
      summary: 신규 회원 온보딩
      description: "온보딩 전용 Bearer만 허용하며 JSESSIONID가 필요 없습니다. nickname/characterGender만\
        \ 입력합니다. 닉네임은 중복 조회·닉네임 수정과 같은 규칙(완성형 한글/영문/숫자 2~8자, GM 접두어 금지, 욕설·비속어 금지\
        )으로 최종 검증합니다. 회원·지갑·최초 100코인 SIGNUP_BONUS 원장·Refresh 저장은 원자적입니다. 201 성공 후\
        \ 토큰 소비; 확인된 닉네임 충돌+롤백(409 USER_NICKNAME_ALREADY_EXISTS)만 같은 토큰으로 재시도하며 최초\
        \ 만료는 연장하지 않습니다. 중복 소셜 계정/기타 실패/커밋 불명은 새 OAuth가 필요합니다."
      operationId: onboard
      parameters:
      - name: Origin
        in: header
        description: 브라우저가 자동 전송합니다. AUTH_ALLOWED_ORIGINS의 명시적 Origin. Swagger UI와
          같은 서버 Origin도 허용 목록에 추가하세요. Refresh/Logout은 필수; 다른 API는 비브라우저 Origin 누락을
          기존 Fetch Metadata 정책으로 판정합니다.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserOnboardingRequest"
        required: true
      responses:
        "201":
          description: "회원 생성 및 인증 발급 성공 (Cache-Control: no-store)"
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
            Set-Cookie:
              description: "ONTOP_REFRESH; HttpOnly; Path=/api/v1/auth 기본값; Secure/SameSite\
                \ 환경설정. Logout은 Max-Age=0 삭제, Exchange의 신규 회원 분기는 발급하지 않음. Exchange는\
                \ OAuth 세션 쿠키 ID도 회전합니다."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOnboardingResponse"
        "400":
          description: USER_INVALID_ONBOARDING_REQUEST / USER_INVALID_NICKNAME / USER_RESERVED_NICKNAME
            / USER_INAPPROPRIATE_NICKNAME / USER_INVALID_CHARACTER_GENDER
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "401":
          description: AUTH_INVALID_ONBOARDING_TOKEN
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "403":
          description: AUTH_ORIGIN_NOT_ALLOWED / AUTH_ACCESS_DENIED / AUTH_REQUEST_REJECTED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "409":
          description: USER_NICKNAME_ALREADY_EXISTS (확인된 롤백 시 재시도) / USER_ALREADY_REGISTERED
            (새 OAuth 필요)
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "500":
          description: AUTH_TOKEN_CONFIGURATION_ERROR
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "503":
          description: USER_ONBOARDING_UNAVAILABLE
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - OnboardingBearer: []
  /api/v1/shop/purchases:
    post:
      tags:
      - Shop
      summary: 아이템 구매
      description: "지갑을 잠그고 잔액 차감·보유량·거래 원장·멱등 영수증을 한 트랜잭션으로 저장합니다. 의상 중복 구매는 REJECT\
        \ 정책입니다. Idempotency-Key가 필요합니다. local/dev 또는 운영 prod,db에서 등록됩니다(운영과 개발 프로\
        필 혼합 제외). 실제 서비스는 db 및 ontop.shop.enabled=true(SHOP_ENABLED=true), 별도 상점 스\
        키마와 회원 지갑이 필요합니다. 기존 V100 적용 이력·순서를 확인한 뒤 Flyway locations에 db/shop을 명시적으로\
        \ 추가합니다. 기본 비활성·실제 배포는 별도입니다."
      operationId: purchase
      parameters:
      - name: Idempotency-Key
