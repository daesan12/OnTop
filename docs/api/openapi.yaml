openapi: 3.0.1
info:
  title: OnTop API
  description: OnTop REST API Documentation
  version: 0.0.1-SNAPSHOT
servers:
- url: /
  description: 현재 문서 서버 (local/dev)
paths:
  /api/v1/users/onboarding:
    post:
      tags:
      - User
      summary: 신규 회원 온보딩
      description: 온보딩 전용 Bearer만 허용하며 JSESSIONID가 필요 없습니다. nickname/characterGender만
        입력합니다. 회원 생성과 Refresh 저장은 원자적입니다. 201 성공 후 토큰 소비; 확인된 닉네임 충돌+롤백(409 USER_NICKNAME_ALREADY_EXISTS)만
        같은 토큰으로 재시도하며 최초 만료는 연장하지 않습니다. 중복 소셜 계정/기타 실패/커밋 불명은 새 OAuth가 필요합니다. Wallet은
        생성하지 않습니다.
      operationId: onboard
      parameters:
      - name: Origin
        in: header
        description: 브라우저가 자동 전송합니다. AUTH_ALLOWED_ORIGINS의 명시적 Origin. Swagger UI와
          같은 서버 Origin도 허용 목록에 추가하세요. Refresh/Logout은 필수; 다른 API는 비브라우저 Origin 누락을
          기존 Fetch Metadata 정책으로 판정합니다.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserOnboardingRequest"
        required: true
      responses:
        "201":
          description: "회원 생성 및 인증 발급 성공 (Cache-Control: no-store)"
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
            Set-Cookie:
              description: "ONTOP_REFRESH; HttpOnly; Path=/api/v1/auth 기본값; Secure/SameSite\
                \ 환경설정. Logout은 Max-Age=0 삭제, Exchange의 신규 회원 분기는 발급하지 않음. Exchange는\
                \ OAuth 세션 쿠키 ID도 회전합니다."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOnboardingResponse"
        "400":
          description: USER_INVALID_ONBOARDING_REQUEST / USER_INVALID_NICKNAME / USER_INVALID_CHARACTER_GENDER
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "401":
          description: AUTH_INVALID_ONBOARDING_TOKEN
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "403":
          description: AUTH_ORIGIN_NOT_ALLOWED / AUTH_ACCESS_DENIED / AUTH_REQUEST_REJECTED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "409":
          description: USER_NICKNAME_ALREADY_EXISTS (확인된 롤백 시 재시도) / USER_ALREADY_REGISTERED
            (새 OAuth 필요)
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "500":
          description: AUTH_TOKEN_CONFIGURATION_ERROR
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "503":
          description: USER_ONBOARDING_UNAVAILABLE
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - OnboardingBearer: []
  /api/v1/shop/purchases:
    post:
      tags:
      - Shop
      summary: 아이템 구매
      description: "지갑을 잠그고 잔액 차감·보유량·거래 원장·멱등 영수증을 한 트랜잭션으로 저장합니다. 의상 중복 구매는 REJECT\
        \ 정책입니다. Idempotency-Key가 필요합니다. local 프로필 전용. 실제 서비스는 local,db 및 ontop.shop.enabled=true,\
        \ 별도 상점 스키마/지갑 준비가 필요합니다. 기본 users/Refresh DB만으로 동작하지 않으며 Wallet 생성·운영 프로필\
        \ 전환은 미완료입니다."
      operationId: purchase
      parameters:
      - name: Idempotency-Key
        in: header
        description: "같은 회원·키·구매 내용은 기존 영수증 반환, 같은 키의 다른 내용은 409"
        required: true
        schema:
          maxLength: 64
          minLength: 1
          pattern: "[A-Za-z0-9_-]{1,64}"
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - itemId
              - quantity
              type: object
              properties:
                itemId:
                  minimum: 1
                  type: integer
                  format: int64
                quantity:
                  maximum: 2147483647
                  minimum: 1
                  type: integer
                  format: int32
              additionalProperties: false
        required: true
      responses:
        "200":
          description: 성공
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "400":
          description: INVALID_REQUEST 또는 QUANTITY_TOO_LARGE
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 기존 REST 인증/인가/설정 오류
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "403":
          description: 기존 REST 인증/인가/설정 오류
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "404":
          description: ITEM_NOT_FOUND 또는 OWNED_ITEM_NOT_FOUND
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: WALLET_NOT_READY / ITEM_ALREADY_OWNED / IDEMPOTENCY_CONFLICT
            / INSUFFICIENT_BALANCE / ITEM_NOT_EQUIPPABLE
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 기존 REST 인증/인가/설정 오류
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "503":
          description: SHOP_NOT_CONFIGURED / SHOP_UNAVAILABLE 또는 인증 DB 장애
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/ErrorResponse"
      security:
      - AccessJwt: []
  /api/v1/auth/websocket-ticket:
    post:
      tags:
      - Auth
      summary: WebSocket 일회용 접속권
      description: "Access JWT로 인증한 활성 회원 및 sid와 허용된 Origin에 결합합니다. 최대 30초(Access\
        \ 만료 상한), 일회용입니다. /ws/tables?ticket= 연결 시 같은 Origin·회원·sid를 재확인합니다. 새 연결/재\
        접속마다 발급하세요. 브라우저는 WebSocket Authorization 헤더를 직접 설정할 수 없습니다."
      operationId: issue
      parameters:
      - name: Origin
        in: header
        description: 브라우저가 자동 전송합니다. AUTH_ALLOWED_ORIGINS의 명시적 Origin. Swagger UI와
          같은 서버 Origin도 허용 목록에 추가하세요. Refresh/Logout은 필수; 다른 API는 비브라우저 Origin 누락을
          기존 Fetch Metadata 정책으로 판정합니다.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "성공 (Cache-Control: no-store)"
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "401":
          description: AUTH_AUTHENTICATION_REQUIRED / AUTH_INVALID_ACCESS_TOKEN /
            AUTH_MEMBER_STATE_CHANGED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "403":
          description: AUTH_ORIGIN_NOT_ALLOWED / AUTH_ACCESS_DENIED / AUTH_REQUEST_REJECTED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "500":
          description: AUTH_TOKEN_CONFIGURATION_ERROR
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "503":
          description: AUTH_MEMBER_LOOKUP_UNAVAILABLE
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "429":
          description: "WS_TICKET_LIMIT: 회원별 4개 또는 저장소 최대 접속권 수 초과"
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - AccessJwt: []
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Access/Refresh 재발급
      description: "본문과 Authorization 헤더가 필요하지 않습니다. ONTOP_REFRESH 쿠키와 허용된 Origin을\
        \ 사용합니다. 매번 Rotation하며 동일 sid로 7일 슬라이딩 만료합니다. 이미 회전한 토큰은 401; 회전 후 5초 이내 중\
        복 요청은 추가 폐기 없이 거절하고, 그 이후 재사용 탐지 시 해당 sid를 폐기합니다."
      operationId: refresh
      parameters:
      - name: Origin
        in: header
        description: 브라우저가 자동 전송합니다. AUTH_ALLOWED_ORIGINS의 명시적 Origin. Swagger UI와
          같은 서버 Origin도 허용 목록에 추가하세요. Refresh/Logout은 필수; 다른 API는 비브라우저 Origin 누락을
          기존 Fetch Metadata 정책으로 판정합니다.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "성공 (Cache-Control: no-store)"
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
            Set-Cookie:
              description: "ONTOP_REFRESH; HttpOnly; Path=/api/v1/auth 기본값; Secure/SameSite\
                \ 환경설정. Logout은 Max-Age=0 삭제, Exchange의 신규 회원 분기는 발급하지 않음. Exchange는\
                \ OAuth 세션 쿠키 ID도 회전합니다."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRefreshResponse"
        "400":
          description: AUTH_INVALID_REFRESH_REQUEST
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "401":
          description: AUTH_INVALID_REFRESH_TOKEN / AUTH_REFRESH_ALREADY_ROTATED /
            AUTH_REFRESH_REUSE_DETECTED / AUTH_MEMBER_STATE_CHANGED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "403":
          description: AUTH_ORIGIN_NOT_ALLOWED / AUTH_ACCESS_DENIED / AUTH_REQUEST_REJECTED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "500":
          description: AUTH_TOKEN_CONFIGURATION_ERROR
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "503":
          description: AUTH_REFRESH_STORAGE_UNAVAILABLE
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - RefreshCookie: []
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: 현재 로그인 세션 로그아웃
      description: 본문/Access JWT/JSESSIONID 없이 Refresh 쿠키와 허용된 Origin을 사용합니다. 쿠키 누락/만료/위조도
        멱등 204입니다. 식별된 sid 전체를 폐기하고 커밋 후 해당 WebSocket을 4401로 종료합니다. 기존 Access JWT와
        미사용 접속권도 즉시 거절됩니다. 다른 로그인 계열은 유지합니다. 발급과 같은 속성의 Max-Age=0 쿠키를 반환합니다.
      operationId: logout
      parameters:
      - name: Origin
        in: header
        description: 브라우저가 자동 전송합니다. AUTH_ALLOWED_ORIGINS의 명시적 Origin. Swagger UI와
          같은 서버 Origin도 허용 목록에 추가하세요. Refresh/Logout은 필수; 다른 API는 비브라우저 Origin 누락을
          기존 Fetch Metadata 정책으로 판정합니다.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: 성공. 응답 본문 없음
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
            Set-Cookie:
              description: "ONTOP_REFRESH; HttpOnly; Path=/api/v1/auth 기본값; Secure/SameSite\
                \ 환경설정. Logout은 Max-Age=0 삭제, Exchange의 신규 회원 분기는 발급하지 않음. Exchange는\
                \ OAuth 세션 쿠키 ID도 회전합니다."
              schema:
                type: string
        "400":
          description: AUTH_INVALID_LOGOUT_REQUEST
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "403":
          description: AUTH_ORIGIN_NOT_ALLOWED / AUTH_ACCESS_DENIED / AUTH_REQUEST_REJECTED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "500":
          description: AUTH_TOKEN_CONFIGURATION_ERROR
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "503":
          description: AUTH_LOGOUT_STORAGE_UNAVAILABLE
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - RefreshCookie: []
      - {}
  /api/v1/auth/exchange:
    post:
      tags:
      - Auth
      summary: 일회용 코드 교환
      description: "60초 교환 코드와 OAuth와 동일한 HttpSession이 필요합니다. Origin 허용 목록을 검증합니다\
        . 코드 일회 소비 후 실패하면 새 로그인이 필요합니다. 기존/복구 회원은 Access JWT(1800초)와 HttpOnly Refresh\
        \ 쿠키(7일), 신규는 온보딩 전용 Bearer(600초)만 받습니다. 성공 시 세션 ID가 회전합니다."
      operationId: exchange
      parameters:
      - name: Origin
        in: header
        description: 브라우저가 자동 전송합니다. AUTH_ALLOWED_ORIGINS의 명시적 Origin. Swagger UI와
          같은 서버 Origin도 허용 목록에 추가하세요. Refresh/Logout은 필수; 다른 API는 비브라우저 Origin 누락을
          기존 Fetch Metadata 정책으로 판정합니다.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - exchangeCode
              type: object
              properties:
                exchangeCode:
                  maxLength: 43
                  minLength: 43
                  pattern: "[A-Za-z0-9_-]{43}"
                  type: string
              additionalProperties: false
        required: true
      responses:
        "200":
          description: "성공 (Cache-Control: no-store)"
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
            Set-Cookie:
              description: "ONTOP_REFRESH; HttpOnly; Path=/api/v1/auth 기본값; Secure/SameSite\
                \ 환경설정. Logout은 Max-Age=0 삭제, Exchange의 신규 회원 분기는 발급하지 않음. Exchange는\
                \ OAuth 세션 쿠키 ID도 회전합니다."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthExchangeResponse"
        "400":
          description: AUTH_INVALID_EXCHANGE_REQUEST
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "401":
          description: AUTH_INVALID_EXCHANGE_CODE / AUTH_MEMBER_STATE_CHANGED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "403":
          description: AUTH_ORIGIN_NOT_ALLOWED / AUTH_ACCESS_DENIED / AUTH_REQUEST_REJECTED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "500":
          description: AUTH_TOKEN_CONFIGURATION_ERROR
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "503":
          description: AUTH_EXCHANGE_STORAGE_UNAVAILABLE / AUTH_ONBOARDING_CAPACITY_EXCEEDED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - OAuthSession: []
  /api/v1/users/me:
    get:
      tags:
      - User
      summary: 내 정보 조회
      description: 검증된 Principal의 내부 userId로 조회합니다. 요청으로 userId를 받지 않으며 소셜 식별자/인증
        정보는 반환하지 않습니다. 활성 회원과 유효한 sid가 필요합니다.
      operationId: me
      responses:
        "200":
          description: "성공 (Cache-Control: no-store)"
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: AUTH_AUTHENTICATION_REQUIRED / AUTH_INVALID_ACCESS_TOKEN /
            AUTH_MEMBER_STATE_CHANGED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "403":
          description: AUTH_ORIGIN_NOT_ALLOWED / AUTH_ACCESS_DENIED / AUTH_REQUEST_REJECTED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "500":
          description: AUTH_TOKEN_CONFIGURATION_ERROR
