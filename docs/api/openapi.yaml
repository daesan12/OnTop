        \ 설정 시 fragment의 exchange_code로 302; 미설정 200 JSON은 로컬 수동 검증용 계약입니다. OAuth\
        \ 토큰/JWT를 반환하지 않습니다."
      operationId: callback
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - ssafy
          - naver
      - name: state
        in: query
        description: 동일 OAuth 세션/provider의 서버 발급 state
        required: true
        schema:
          type: string
      - name: code
        in: query
        description: 성공 시 공급자 인가 코드
        required: false
        schema:
          maxLength: 4096
          type: string
      - name: error
        in: query
        description: 공급자 거절 시 code 대신 전달
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "성공 (Cache-Control: no-store)"
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCallbackResponse"
        "302":
          description: 설정에 따른 리다이렉트
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
            Location:
              description: "인가 시작은 공급자 URL, callback은 설정된 프론트 URI의 exchange_code fragment"
              schema:
                type: string
                format: uri
        "400":
          description: AUTH_UNSUPPORTED_PROVIDER / AUTH_INVALID_STATE / AUTH_INVALID_CALLBACK
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "401":
          description: AUTH_PROVIDER_DENIED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "409":
          description: "AUTH_REJOIN_PENDING (7일 경과, 재가입 미구현)"
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "500":
          description: AUTH_CONFIGURATION_ERROR
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "502":
          description: 외부 공급자 토큰 교환 또는 프로필 조회 실패
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "503":
          description: AUTH_DATABASE_UNAVAILABLE / AUTH_EXCHANGE_CAPACITY_EXCEEDED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - OAuthSession: []
  /api/v1/auth/{provider}/authorize:
    get:
      tags:
      - Auth
      summary: 소셜 로그인 시작
      description: ssafy/naver만 지원합니다. 신뢰된 설정의 callback URI와 서버 발급 state로 302 이동합니다.
        client_secret은 인가 URL에 포함하지 않습니다. 브라우저 탐색으로 시작하고 OAuth 세션 쿠키를 유지하세요.
      operationId: authorize
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - ssafy
          - naver
      responses:
        "302":
          description: 설정에 따른 리다이렉트
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
            Location:
              description: "인가 시작은 공급자 URL, callback은 설정된 프론트 URI의 exchange_code fragment"
              schema:
                type: string
                format: uri
        "400":
          description: AUTH_UNSUPPORTED_PROVIDER
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "500":
          description: AUTH_CONFIGURATION_ERROR
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
components:
  schemas:
    UserOnboardingRequest:
      required:
      - characterGender
      - nickname
      type: object
      properties:
        nickname:
          maxLength: 8
          minLength: 2
          pattern: "[가-힣A-Za-z0-9]{2,8}"
          type: string
          example: 미지
        characterGender:
          type: string
          example: FEMALE
          enum:
          - MALE
          - FEMALE
      additionalProperties: false
    UserOnboardingResponse:
      required:
      - accessToken
      - characterGender
      - expiresIn
      - nickname
      - tokenType
      - userId
      type: object
      properties:
        userId:
          type: integer
          format: int64
        nickname:
          type: string
        characterGender:
          type: string
          enum:
          - MALE
          - FEMALE
        accessToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
    AuthErrorResponse:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    Purchase:
      type: object
      properties:
        purchaseId:
          type: string
        itemId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        unitPrice:
          type: integer
          format: int64
        totalPrice:
          type: integer
          format: int64
        balanceAfter:
          type: integer
          format: int64
        userItemId:
          type: integer
          format: int64
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
    Ticket:
      type: object
      properties:
        ticket:
          type: string
        expiresIn:
          type: integer
          format: int64
    AuthRefreshResponse:
      required:
      - accessToken
      - expiresIn
      - tokenType
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
    AuthExchangeResponse:
      type: object
      discriminator:
        propertyName: status
      oneOf:
      - $ref: "#/components/schemas/Authenticated"
      - $ref: "#/components/schemas/Onboarding"
    Authenticated:
      required:
      - accessToken
      - expiresIn
      - status
      - tokenType
      type: object
      properties:
        status:
          type: string
          enum:
          - AUTHENTICATED
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          format: int64
          example: 1800
    Onboarding:
      required:
      - expiresIn
      - onboardingToken
      - status
      type: object
      properties:
        status:
          type: string
          enum:
          - ONBOARDING_REQUIRED
        onboardingToken:
          type: string
        expiresIn:
          type: integer
          format: int64
          example: 600
    UserNicknameUpdateRequest:
      required:
      - nickname
      type: object
      properties:
        nickname:
          maxLength: 8
          minLength: 2
          pattern: "[가-힣A-Za-z0-9]{2,8}"
          type: string
          example: 온탑고수
      additionalProperties: false
    UserProfileResponse:
      required:
      - characterGender
      - nickname
      - userId
      type: object
      properties:
        userId:
          type: integer
          description: 내부 회원 ID
          format: int64
          example: 1
        nickname:
          type: string
          example: 미지
        characterGender:
          type: string
          example: FEMALE
          enum:
          - MALE
          - FEMALE
    Equipment:
      type: object
      properties:
        equipment:
          type: array
          items:
            $ref: "#/components/schemas/OwnedItem"
    Item:
      type: object
      properties:
        itemId:
          type: integer
          format: int64
        itemCode:
          type: string
        name:
          type: string
        itemType:
          type: string
          enum:
          - EQUIPMENT
          - CONSUMABLE
        equipSlot:
          type: string
          enum:
          - HAIR
          - FACE
          - TOP
          - BOTTOM
          - SHOES
        price:
          type: integer
          format: int64
        imageKey:
          type: string
    OwnedItem:
      type: object
      properties:
        userItemId:
          type: integer
          format: int64
        item:
          $ref: "#/components/schemas/Item"
        quantity:
          type: integer
          format: int32
        equipped:
          type: boolean
    NicknameAvailabilityResponse:
      required:
      - available
      - nickname
      type: object
      properties:
        nickname:
          type: string
        available:
          type: boolean
    Inventory:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OwnedItem"
    TableListResponse:
      type: object
      properties:
        tables:
          type: array
          items:
            $ref: "#/components/schemas/TableSummaryResponse"
    TableSummaryResponse:
      type: object
      properties:
        tableId:
          type: string
        capacity:
          type: integer
          format: int32
        minimumPlayers:
          type: integer
          format: int32
        occupiedSeats:
          type: integer
          format: int32
        availableSeats:
          type: integer
          format: int32
        readyCount:
          type: integer
          format: int32
        allReady:
          type: boolean
        status:
          type: string
        joinable:
          type: boolean
        gameCode:
          type: string
        targetScore:
          type: integer
          format: int32
    ItemList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
    ChannelListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChannelResponse"
    ChannelResponse:
      type: object
      properties:
        channelId:
          type: string
        name:
          type: string
        currentUsers:
          type: integer
          format: int32
        capacity:
          type: integer
          format: int32
        joinable:
          type: boolean
    AuthCallbackResponse:
      required:
      - exchangeCode
      - expiresIn
      type: object
      properties:
        exchangeCode:
          type: string
        expiresIn:
          type: integer
          format: int64
  securitySchemes:
    AccessJwt:
      type: http
      description: 30분 Access JWT. 서명/Issuer/Audience/typ/token_use/만료 및 sid·활성 회원
        검증. 로그아웃한 로그인 계열·탈퇴 회원은 거절합니다.
      scheme: bearer
      bearerFormat: JWT
    OnboardingBearer:
      type: http
      description: 89번 교환 API의 ob_ 온보딩 전용 Bearer. 독립 인증·600초. 온보딩/닉네임 조회만 가능하며 조회는
        소비하지 않습니다. Access JWT가 아닙니다.
      scheme: bearer
      bearerFormat: opaque
    RefreshCookie:
      type: apiKey
      description: HttpOnly Refresh 쿠키. Origin 필수. 브라우저는 Cookie 헤더를 임의로 설정할 수 없으므로
        Authorize 입력으로 쿠키를 만들 수 없습니다. 실제 로그인으로 발급받습니다.
      name: ONTOP_REFRESH
      in: cookie
    OAuthSession:
      type: apiKey
      description: 인가 시작에서 생성된 동일 OAuth HttpSession. callback의 state와 exchangeCode에
        결합됩니다. 교환 성공 시 세션 ID가 회전합니다.
      name: JSESSIONID
      in: cookie
