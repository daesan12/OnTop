openapi: 3.0.1
info:
  title: OnTop API
  description: OnTop REST API Documentation
  version: 0.0.1-SNAPSHOT
servers:
- url: /
  description: 현재 문서 서버 (local/dev)
tags:
- name: Bungeoppang Ranking
  description: 붕어빵 버전별 개인 최고 기록
- name: WALLET
  description: 인증된 본인의 지갑 조회
- name: Ranking
  description: 보유 엽전 랭킹
- name: HISTORY
  description: 인증된 본인의 종료 경기 내역과 게임별 전적
paths:
  /api/v1/users/onboarding:
    post:
      tags:
      - User
      summary: 신규 회원 온보딩
      description: 온보딩 전용 Bearer만 허용하며 JSESSIONID가 필요 없습니다. nickname/characterGender만
        입력합니다. 회원·지갑·최초 100코인 SIGNUP_BONUS 원장·Refresh 저장은 원자적입니다. 201 성공 후 토큰 소비;
        확인된 닉네임 충돌+롤백(409 USER_NICKNAME_ALREADY_EXISTS)만 같은 토큰으로 재시도하며 최초 만료는 연장하지
        않습니다. 중복 소셜 계정/기타 실패/커밋 불명은 새 OAuth가 필요합니다.
      operationId: onboard
      parameters:
      - name: Origin
        in: header
        description: 브라우저가 자동 전송합니다. AUTH_ALLOWED_ORIGINS의 명시적 Origin. Swagger UI와
          같은 서버 Origin도 허용 목록에 추가하세요. Refresh/Logout은 필수; 다른 API는 비브라우저 Origin 누락을
          기존 Fetch Metadata 정책으로 판정합니다.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserOnboardingRequest"
        required: true
      responses:
        "201":
          description: "회원 생성 및 인증 발급 성공 (Cache-Control: no-store)"
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
            Set-Cookie:
              description: "ONTOP_REFRESH; HttpOnly; Path=/api/v1/auth 기본값; Secure/SameSite\
                \ 환경설정. Logout은 Max-Age=0 삭제, Exchange의 신규 회원 분기는 발급하지 않음. Exchange는\
                \ OAuth 세션 쿠키 ID도 회전합니다."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOnboardingResponse"
        "400":
          description: USER_INVALID_ONBOARDING_REQUEST / USER_INVALID_NICKNAME / USER_INVALID_CHARACTER_GENDER
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "401":
          description: AUTH_INVALID_ONBOARDING_TOKEN
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "403":
          description: AUTH_ORIGIN_NOT_ALLOWED / AUTH_ACCESS_DENIED / AUTH_REQUEST_REJECTED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "409":
          description: USER_NICKNAME_ALREADY_EXISTS (확인된 롤백 시 재시도) / USER_ALREADY_REGISTERED
            (새 OAuth 필요)
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "500":
          description: AUTH_TOKEN_CONFIGURATION_ERROR
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "503":
          description: USER_ONBOARDING_UNAVAILABLE
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - OnboardingBearer: []
  /api/v1/shop/purchases:
    post:
      tags:
      - Shop
      summary: 아이템 구매
      description: "지갑을 잠그고 잔액 차감·보유량·거래 원장·멱등 영수증을 한 트랜잭션으로 저장합니다. 의상 중복 구매는 REJECT\
        \ 정책입니다. Idempotency-Key가 필요합니다. local/dev 또는 운영 prod,db에서 등록됩니다(운영과 개발 프로\
        필 혼합 제외). 실제 서비스는 db 및 ontop.shop.enabled=true(SHOP_ENABLED=true), 별도 상점 스\
        키마와 회원 지갑이 필요합니다. 기존 V100 적용 이력·순서를 확인한 뒤 Flyway locations에 db/shop을 명시적으로\
        \ 추가합니다. 기본 비활성·실제 배포는 별도입니다."
      operationId: purchase
      parameters:
      - name: Idempotency-Key
        in: header
        description: "같은 회원·키·구매 내용은 기존 영수증 반환, 같은 키의 다른 내용은 409"
        required: true
        schema:
          maxLength: 64
          minLength: 1
          pattern: "^[A-Za-z0-9_-]{1,64}$"
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - itemId
              - quantity
              type: object
              properties:
                itemId:
                  minimum: 1
                  type: integer
                  format: int64
                quantity:
                  maximum: 2147483647
                  minimum: 1
                  type: integer
                  format: int32
              additionalProperties: false
        required: true
      responses:
        "200":
          description: 성공
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseResponse"
        "400":
          description: INVALID_REQUEST 또는 QUANTITY_TOO_LARGE
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopErrorResponse"
        "401":
          description: 기존 REST 인증/인가/설정 오류
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/ShopErrorResponse"
        "403":
          description: 기존 REST 인증/인가/설정 오류
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/ShopErrorResponse"
        "404":
          description: ITEM_NOT_FOUND 또는 OWNED_ITEM_NOT_FOUND
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopErrorResponse"
        "409":
          description: WALLET_NOT_READY / ITEM_ALREADY_OWNED / IDEMPOTENCY_CONFLICT
            / INSUFFICIENT_BALANCE / ITEM_NOT_EQUIPPABLE
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopErrorResponse"
        "500":
          description: 기존 REST 인증/인가/설정 오류
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "503":
          description: SHOP_NOT_CONFIGURED / SHOP_UNAVAILABLE 또는 인증 DB 장애
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/ShopErrorResponse"
      security:
      - AccessJwt: []
  /api/v1/notes:
    get:
      tags:
      - NOTES
      summary: 전망대 익명 메모 조회
      description: 인증·서버 근접/활동 검사. 열기/재접속 및 NOTES_CHANGED 알림 후 합쳐 재조회. 정기 GET 없음.
      operationId: list
      parameters:
      - name: channelId
        in: query
        description: "공백이 아닌 현재 채널 ID, 최대 64 UTF-16 단위"
        required: true
        schema:
          type: string
          x-utf16-max-length: 64
      responses:
        "200":
          description: 최신 메모 목록. 없으면 notes 빈 배열
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteListResponse"
        "409":
          description: NOT_IN_CHANNEL / NOTES_ACTIVITY_CONFLICT
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotesErrorResponse"
        "429":
          description: "NOTES_READ_COOLDOWN, nextAllowedAt 포함"
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotesErrorResponse"
        "400":
          description: INVALID_REQUEST / NOTES_TEXT_INVALID
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotesErrorResponse"
        "401":
          description: 활성 회원 인증 필요
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/NotesErrorResponse"
        "403":
          description: NOTES_OUT_OF_RANGE
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/NotesErrorResponse"
        "503":
          description: NOTES_NOT_CONFIGURED / NOTES_UNAVAILABLE
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/NotesErrorResponse"
        "500":
          description: AUTH_TOKEN_CONFIGURATION_ERROR
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - AccessJwt: []
    post:
      tags:
      - NOTES
      summary: 전망대 익명 메모 작성
      description: "전 채널 공용 최신120장. operationId=발급시각ms_임의키, 24시간 재확인."
      operationId: submit
      requestBody:
        content:
          application/json:
            schema:
              required:
              - operationId
              - channelId
              - text
              type: object
              properties:
                operationId:
                  pattern: "^[0-9]{13}_[A-Za-z0-9_-]{16,64}$"
                  type: string
                channelId:
                  minLength: 1
                  type: string
                  description: "Java isBlank=false, 최대 64 UTF-16 단위. 서버의 현재 채널·위치·\
                    활동도 검사합니다."
                  x-utf16-max-length: 64
                text:
                  type: string
                  description: 원문 UTF-16 300단위 이하. NFC → 제어/Cf 문자 제거 → JS trim 후 1~300
                    UTF-16 단위. 코드포인트 길이인 minLength와 다릅니다.
                  x-utf16-max-length: 300
                  x-normalized-utf16-min-length: 1
                category:
                  type: string
                  description: 생략 시 free. 명시적 null은 허용하지 않는다.
                  default: free
                  enum:
                  - daily
                  - cheer
                  - worry
                  - recommend
                  - free
              additionalProperties: false
        required: true
      responses:
        "201":
          description: 저장된 메모 또는 동일 요청의 기존 결과
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteReceiptResponse"
        "409":
          description: IDEMPOTENCY_CONFLICT / NOT_IN_CHANNEL / NOTES_ACTIVITY_CONFLICT
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotesErrorResponse"
        "429":
          description: "NOTES_WRITE_COOLDOWN / NOTES_READ_COOLDOWN, nextAllowedAt\
            \ 포함"
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotesErrorResponse"
        "410":
          description: "NOTE_REMOVED / NOTES_REQUEST_EXPIRED, 자동 재게시 금지"
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotesErrorResponse"
        "400":
          description: INVALID_REQUEST / NOTES_TEXT_INVALID / NOTES_CATEGORY_INVALID
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotesErrorResponse"
        "401":
          description: 활성 회원 인증 필요
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/NotesErrorResponse"
        "403":
          description: NOTES_OUT_OF_RANGE
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/NotesErrorResponse"
        "503":
          description: NOTES_NOT_CONFIGURED / NOTES_UNAVAILABLE
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/NotesErrorResponse"
        "500":
          description: AUTH_TOKEN_CONFIGURATION_ERROR
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - AccessJwt: []
  /api/v1/minigames/sessions:
    get:
      tags:
      - MINIGAME
      summary: 붕어빵 시작 화면 상태 조회
      description: "한국 날짜 기준 오늘 보상·첫 판·확인한 안내를 조회합니다. local,db 또는 dev,db에서 사용하며, 운\
        영 prod,db에서도 기능 플래그로 활성화할 수 있습니다. dev는 기본 활성화하며 공통 스키마에 V110/V111, v4 초기화\
        \ V124, 납품 영수증 V125, 최종 정산 V126을 추가합니다. 운영은 DB 이력과 마이그레이션 위치 검토가 먼저 필요합니다\
        . 버전 생략은 기존 v2이고 v4는 명시적으로 선택합니다. v4는 납품 승인·checkpoint·다음 주문, 마지막 미승인 납품 검\
        증, 영속 멱등 완료와 Wallet 일일 한도 지급을 제공합니다. v2는 60초, 15점당 1냥, KST 하루 100냥 계약을 유지합\
        니다. 탭 이동 중에도 시간은 흐르며 랭킹은 제외합니다. score·rewardAmount·userId를 본문에 넣지 않습니다. 상태\
        \ GET도 지갑 잠금과 만료 세션 INVALID 갱신을 수행할 수 있습니다. 읽기 전용 트랜잭션이 아닙니다. v5(신규 판 120초\
        ·90초부터 가속, 기존 v5-20261027.1 판은 저장된 180초·150초 규칙 유지, 활성 손님 3명, 선택 납품·충원, V128)도\
        \ 제공하며 v5는 서버 설정 ontop.minigames.bungeoppang-v5-enabled=true일 때만 받고, 기본값(false)에\
        서는 409 RULES_VERSION_MISMATCH입니다."
      operationId: status
      parameters:
      - name: rulesVersion
        in: query
        description: "조회 계약 버전. 생략하거나 v2이면 기존 응답, v4·v5이면 같은 형식의 로비 상태를 반환합니다. v5는\
          \ 서버 설정 ontop.minigames.bungeoppang-v5-enabled=true일 때만 받고, 기본값(false)에서\
          는 409 RULES_VERSION_MISMATCH입니다."
        required: false
        schema:
          type: string
          enum:
          - v2
          - v4
          - v5
      responses:
        "200":
          description: 오늘 보상과 안내 상태
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/BungeoppangStatusResponse"
                - $ref: "#/components/schemas/BungeoppangV4LobbyResponse"
        "409":
          description: RULES_VERSION_MISMATCH
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinigameErrorResponse"
        "400":
          description: INVALID_REQUEST / UNSUPPORTED_MINIGAME
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinigameErrorResponse"
        "401":
          description: 인증된 활성 회원 필요
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/MinigameErrorResponse"
        "503":
          description: MINIGAME_NOT_CONFIGURED / MINIGAME_UNAVAILABLE 또는 인증 DB 장애
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/MinigameErrorResponse"
        "403":
          description: Origin 또는 ROLE_MEMBER 접근 거절
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/MinigameErrorResponse"
        "500":
          description: AUTH_TOKEN_CONFIGURATION_ERROR
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - AccessJwt: []
    post:
      tags:
      - MINIGAME
      summary: 붕어빵 세션 시작
      description: "같은 회원·Idempotency-Key는 최초 세션 생성 응답을 반환합니다. local,db 또는 dev,db에\
        서 사용하며, 운영 prod,db에서도 기능 플래그로 활성화할 수 있습니다. dev는 기본 활성화하며 공통 스키마에 V110/V111,\
        \ v4 초기화 V124, 납품 영수증 V125, 최종 정산 V126을 추가합니다. 운영은 DB 이력과 마이그레이션 위치 검토가 먼저\
