  /api/v1/admin/feedback:
    get:
      tags:
      - FEEDBACK
      summary: 관리자 소리함 조회
      description: 서버 관리자 회원 ID 목록에 등록된 활성 회원만 조회합니다.
      operationId: list_3
      parameters:
      - name: cursor
        in: query
        description: 생략/빈 문자열 또는 양의 BIGINT ID. 해당 ID 미만 조회
        required: false
        schema:
          pattern: "^(?:|[1-9][0-9]{0,18})$"
          type: string
          default: ""
      - name: limit
        in: query
        description: "기본 20, 십진수 1~50"
        required: false
        schema:
          pattern: "^(?:[1-9]|[1-4][0-9]|50)$"
          type: string
          default: "20"
      responses:
        "400":
          description: INVALID_REQUEST / FEEDBACK_TEXT_INVALID
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackErrorResponse"
        "401":
          description: 활성 회원 인증 필요
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/FeedbackErrorResponse"
        "403":
          description: FEEDBACK_OUT_OF_RANGE / FEEDBACK_ADMIN_REQUIRED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/FeedbackErrorResponse"
        "503":
          description: FEEDBACK_NOT_CONFIGURED / FEEDBACK_UNAVAILABLE
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/FeedbackErrorResponse"
        "200":
          description: 접수 목록. 마지막 페이지의 nextCursor는 null
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackListResponse"
        "500":
          description: AUTH_TOKEN_CONFIGURATION_ERROR
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - AccessJwt: []
