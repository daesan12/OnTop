      - Auth
      summary: 일회용 코드 교환
      description: "60초 교환 코드와 OAuth와 동일한 HttpSession이 필요합니다. Origin 허용 목록을 검증합니다\
        . 코드 일회 소비 후 실패하면 새 로그인이 필요합니다. 기존/복구 회원은 Access JWT(1800초)와 HttpOnly Refresh\
        \ 쿠키(7일), 신규는 온보딩 전용 Bearer(600초)만 받습니다. 성공 시 세션 ID가 회전합니다."
      operationId: exchange
      parameters:
      - name: Origin
        in: header
        description: 브라우저가 자동 전송합니다. AUTH_ALLOWED_ORIGINS의 명시적 Origin. Swagger UI와
          같은 서버 Origin도 허용 목록에 추가하세요. Refresh/Logout은 필수; 다른 API는 비브라우저 Origin 누락을
          기존 Fetch Metadata 정책으로 판정합니다.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - exchangeCode
              type: object
              properties:
                exchangeCode:
                  maxLength: 43
                  minLength: 43
                  pattern: "^[A-Za-z0-9_-]{43}$"
                  type: string
              additionalProperties: false
        required: true
      responses:
        "200":
          description: "성공 (Cache-Control: no-store)"
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
            Set-Cookie:
              description: "ONTOP_REFRESH; HttpOnly; Path=/api/v1/auth 기본값; Secure/SameSite\
                \ 환경설정. Logout은 Max-Age=0 삭제, Exchange의 신규 회원 분기는 발급하지 않음. Exchange는\
                \ OAuth 세션 쿠키 ID도 회전합니다."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthExchangeResponse"
        "400":
          description: AUTH_INVALID_EXCHANGE_REQUEST
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "401":
          description: AUTH_INVALID_EXCHANGE_CODE / AUTH_MEMBER_STATE_CHANGED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "403":
          description: AUTH_ORIGIN_NOT_ALLOWED / AUTH_ACCESS_DENIED / AUTH_REQUEST_REJECTED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "500":
          description: AUTH_TOKEN_CONFIGURATION_ERROR
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "503":
          description: AUTH_EXCHANGE_STORAGE_UNAVAILABLE / AUTH_ONBOARDING_CAPACITY_EXCEEDED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - OAuthSession: []
