      description: "보유한 의상을 같은 슬롯의 기존 장착과 교체합니다. 커밋 후 의상 변경 이벤트를 발행합니다. local/dev\
        \ 또는 운영 prod,db에서 등록됩니다(운영과 개발 프로필 혼합 제외). 실제 서비스는 db 및 ontop.shop.enabled=true(SHOP_ENABLED=true),\
        \ 별도 상점 스키마와 회원 지갑이 필요합니다. 기존 V100 적용 이력·순서를 확인한 뒤 Flyway locations에 db/shop을\
