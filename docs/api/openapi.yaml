  /api/v1/minigames/sessions/{sessionId}:
    get:
      tags:
      - MINIGAME
      summary: 본인 미니게임 상태 조회
      description: "local,db 또는 dev,db에서 사용하며, 운영 prod,db에서도 기능 플래그로 활성화할 수 있습니다.\
        \ dev는 기본 활성화하며 공통 스키마에 V110/V111, v4 초기화 V124, 납품 영수증 V125, 최종 정산 V126을 추\
        가합니다. 운영은 DB 이력과 마이그레이션 위치 검토가 먼저 필요합니다. 버전 생략은 기존 v2이고 v4는 명시적으로 선택합니다. v4는\
        \ 납품 승인·checkpoint·다음 주문, 마지막 미승인 납품 검증, 영속 멱등 완료와 Wallet 일일 한도 지급을 제공합니다\
        . v2는 60초, 5점당 1냥, 모든 미니게임 합산 KST 하루 500냥 상한을 사용합니다. 탭 이동 중에도 시간은 흐르며, v4·\
        v5는 F1 설명서 일시정지 API와 점수·최대 콤보 랭킹을 제공합니다. score·rewardAmount·userId를 본문에 넣지\
        \ 않습니다. 상태 GET도 지갑 잠금과 만료 세션 INVALID 갱신을 수행할 수 있습니다. 읽기 전용 트랜잭션이 아닙니다. v5(신\
        규 판 120초·90초부터 가속, 기존 v5-20261027.1 판은 저장된 180초·150초 규칙 유지, 활성 손님 3명, 선택 납\
        품·충원, V128)도 제공하며 v5는 서버 설정 ontop.minigames.bungeoppang-v5-enabled=true일 때\
        만 받고, 기본값(false)에서는 409 RULES_VERSION_MISMATCH입니다."
      operationId: load
      parameters:
      - name: sessionId
        in: path
        description: 본인 세션의 양의 BIGINT ID (최대 9223372036854775807)
        required: true
        schema:
          pattern: "^[1-9][0-9]{0,18}$"
          type: string
      - name: includeSource
        in: query
        description: v4·v5 세션에서 규칙·불 원본·발급 시각을 포함합니다. v2 응답에는 영향을 주지 않습니다.
        required: false
        schema:
          type: boolean
          default: false
      - name: includeProgress
        in: query
        description: 종결된 v4·v5 세션에서도 마지막 checkpoint·승인 로그·발급 주문 이력을 포함합니다.
        required: false
        schema:
          type: boolean
          default: false
      - name: deliveryKey
        in: query
        description: v4·v5 납품 영수증 결과를 조회합니다. 미처리·처리 중이면 UNKNOWN입니다.
        required: false
        schema:
          maxLength: 64
          minLength: 1
          pattern: "^[A-Za-z0-9_-]{1,64}$"
          type: string
      responses:
        "200":
          description: 본인 세션
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/MinigameStatusResponse"
                - $ref: "#/components/schemas/BungeoppangV4SessionResponse"
                - $ref: "#/components/schemas/BungeoppangV5SessionResponse"
        "404":
          description: MINIGAME_NOT_FOUND
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinigameErrorResponse"
        "400":
          description: INVALID_REQUEST / UNSUPPORTED_MINIGAME
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinigameErrorResponse"
        "401":
          description: 인증된 활성 회원 필요
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/MinigameErrorResponse"
        "503":
          description: MINIGAME_NOT_CONFIGURED / MINIGAME_UNAVAILABLE 또는 인증 DB 장애
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/MinigameErrorResponse"
        "403":
          description: Origin 또는 ROLE_MEMBER 접근 거절
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/MinigameErrorResponse"
        "500":
          description: AUTH_TOKEN_CONFIGURATION_ERROR
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - AccessJwt: []
