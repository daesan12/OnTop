        \ 만료 상한), 일회용입니다. /ws/tables?ticket= 연결 시 같은 Origin·회원·sid를 재확인합니다. 새 연결/재\
        접속마다 발급하세요. 브라우저는 WebSocket Authorization 헤더를 직접 설정할 수 없습니다."
      operationId: issue
