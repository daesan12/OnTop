        "404":
          description: MINIGAME_NOT_FOUND
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinigameErrorResponse"
        "409":
          description: MINIGAME_ALREADY_COMPLETED / 종료 상태 충돌
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
