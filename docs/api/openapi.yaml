  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Access/Refresh 재발급
      description: "본문과 Authorization 헤더가 필요하지 않습니다. ONTOP_REFRESH 쿠키와 허용된 Origin을\
        \ 사용합니다. 매번 Rotation하며 동일 sid로 7일 슬라이딩 만료합니다. 이미 회전한 토큰은 401; 회전 후 5초 이내 중\
        복 요청은 추가 폐기 없이 거절하고, 그 이후 재사용 탐지 시 해당 sid를 폐기합니다."
      operationId: refresh
      parameters:
      - name: Origin
        in: header
        description: 브라우저가 자동 전송합니다. AUTH_ALLOWED_ORIGINS의 명시적 Origin. Swagger UI와
          같은 서버 Origin도 허용 목록에 추가하세요. Refresh/Logout은 필수; 다른 API는 비브라우저 Origin 누락을
          기존 Fetch Metadata 정책으로 판정합니다.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "성공 (Cache-Control: no-store)"
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
            Set-Cookie:
              description: "ONTOP_REFRESH; HttpOnly; Path=/api/v1/auth 기본값; Secure/SameSite\
                \ 환경설정. Logout은 Max-Age=0 삭제, Exchange의 신규 회원 분기는 발급하지 않음. Exchange는\
                \ OAuth 세션 쿠키 ID도 회전합니다."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRefreshResponse"
        "400":
          description: AUTH_INVALID_REFRESH_REQUEST
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "401":
          description: AUTH_INVALID_REFRESH_TOKEN / AUTH_REFRESH_ALREADY_ROTATED /
            AUTH_REFRESH_REUSE_DETECTED / AUTH_MEMBER_STATE_CHANGED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "403":
          description: AUTH_ORIGIN_NOT_ALLOWED / AUTH_ACCESS_DENIED / AUTH_REQUEST_REJECTED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "500":
          description: AUTH_TOKEN_CONFIGURATION_ERROR
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "503":
          description: AUTH_REFRESH_STORAGE_UNAVAILABLE
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - RefreshCookie: []
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: 현재 로그인 세션 로그아웃
      description: 본문/Access JWT/JSESSIONID 없이 Refresh 쿠키와 허용된 Origin을 사용합니다. 쿠키 누락/만료/위조도
        멱등 204입니다. 식별된 sid 전체를 폐기하고 커밋 후 해당 WebSocket을 4401로 종료합니다. 기존 Access JWT와
        미사용 접속권도 즉시 거절됩니다. 다른 로그인 계열은 유지합니다. 발급과 같은 속성의 Max-Age=0 쿠키를 반환합니다.
      operationId: logout
      parameters:
      - name: Origin
        in: header
        description: 브라우저가 자동 전송합니다. AUTH_ALLOWED_ORIGINS의 명시적 Origin. Swagger UI와
          같은 서버 Origin도 허용 목록에 추가하세요. Refresh/Logout은 필수; 다른 API는 비브라우저 Origin 누락을
          기존 Fetch Metadata 정책으로 판정합니다.
        required: true
        schema:
          type: string
      responses:
        "204":
