components:
  schemas:
    ContactRequest:
      type: object
      properties:
        phone:
          type: string
    ContactResponse:
      type: object
      properties:
        weekStart:
          type: string
          format: date
        status:
          type: string
        maskedPhone:
          type: string
        expiresAt:
          type: string
          format: date-time
        submissionDeadline:
          type: string
          format: date-time
    ServiceOperationUpdateRequest:
      type: object
      properties:
        mode:
          type: string
          enum:
          - NORMAL
          - DRAINING
          - MAINTENANCE
        notice:
          type: string
        expectedOpenAt:
          type: string
          format: date-time
        expectedVersion:
          type: integer
          format: int64
    ServiceOperationResponse:
      type: object
      properties:
        mode:
          type: string
        notice:
          type: string
        maintenanceStartedAt:
          type: string
          format: date-time
        expectedOpenAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
        serverTime:
          type: string
          format: date-time
    Definition:
      type: object
      properties:
        productCode:
          type: string
        name:
          type: string
        grade:
          type: integer
          format: int32
        compatibility:
          type: string
        wearMode:
          type: string
        slots:
          type: array
          items:
            type: string
    Save:
      type: object
      properties:
        version:
          type: integer
          format: int64
        definition:
          $ref: "#/components/schemas/Definition"
    EntryNewsDraft:
      type: object
      properties:
        title:
          type: string
        published:
          type: boolean
        displayOrder:
          type: integer
          format: int32
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        expectedVersion:
          type: integer
          format: int64
    EntryNewsSaveRequest:
      type: object
      properties:
        draft:
          $ref: "#/components/schemas/EntryNewsDraft"
        upload:
          $ref: "#/components/schemas/EntryNewsUploadEvidence"
    EntryNewsUploadEvidence:
      type: object
      properties:
        uploadId:
          type: string
        bytes:
          type: integer
          format: int64
        sha256:
          type: string
        contentType:
          type: string
      nullable: true
    EntryNewsItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        published:
          type: boolean
        displayOrder:
          type: integer
          format: int32
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
        imageHash:
          type: string
        imageUrl:
          type: string
          nullable: true
    AnnouncementOrderItem:
      type: object
      properties:
        id:
          type: string
        expectedVersion:
          type: integer
          format: int64
    AnnouncementOrderRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AnnouncementOrderItem"
    AnnouncementRequest:
      type: object
      properties:
        title:
          type: string
        text:
          type: string
        published:
          type: boolean
        displayOrder:
          type: integer
          format: int32
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        expectedVersion:
          type: integer
          format: int64
    AuthErrorResponse:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    AnnouncementResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        text:
          type: string
        published:
          type: boolean
        displayOrder:
          type: integer
          format: int32
        startsAt:
