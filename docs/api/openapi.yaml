  /api/v1/auth/{provider}/callback:
    get:
      tags:
      - Auth
      summary: 소셜 로그인 콜백
      description: "공급자 전용 수신점. 동일 OAuth 세션·provider·state를 일회 검증한 뒤 토큰/프로필을 조회합니다\
        . 신규 users 행을 만들지 않습니다. 탈퇴 7일 이내 복구, 초과 시 AUTH_REJOIN_PENDING(409)입니다. AUTH_FRONTEND_CALLBACK_URI\
        \ 설정 시 fragment의 exchange_code로 302; 미설정 200 JSON은 로컬 수동 검증용 계약입니다. OAuth\
        \ 토큰/JWT를 반환하지 않습니다."
      operationId: callback
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - ssafy
          - naver
      - name: state
        in: query
        description: 동일 OAuth 세션/provider의 서버 발급 state
        required: true
        schema:
          type: string
      - name: code
        in: query
        description: 성공 시 공급자 인가 코드
        required: false
        schema:
          maxLength: 4096
          type: string
      - name: error
        in: query
        description: 공급자 거절 시 code 대신 전달
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "성공 (Cache-Control: no-store)"
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCallbackResponse"
        "302":
          description: 설정에 따른 리다이렉트
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
            Location:
              description: "인가 시작은 공급자 URL, callback은 설정된 프론트 URI의 exchange_code fragment"
              schema:
                type: string
                format: uri
        "400":
          description: AUTH_UNSUPPORTED_PROVIDER / AUTH_INVALID_STATE / AUTH_INVALID_CALLBACK
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "401":
          description: AUTH_PROVIDER_DENIED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "409":
          description: "AUTH_REJOIN_PENDING (7일 경과, 재가입 미구현)"
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "500":
          description: AUTH_CONFIGURATION_ERROR
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "502":
          description: 외부 공급자 토큰 교환 또는 프로필 조회 실패
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "503":
          description: AUTH_DATABASE_UNAVAILABLE / AUTH_EXCHANGE_CAPACITY_EXCEEDED
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - OAuthSession: []
  /api/v1/auth/{provider}/authorize:
    get:
      tags:
      - Auth
      summary: 소셜 로그인 시작
      description: ssafy/naver만 지원합니다. 신뢰된 설정의 callback URI와 서버 발급 state로 302 이동합니다.
        client_secret은 인가 URL에 포함하지 않습니다. 브라우저 탐색으로 시작하고 OAuth 세션 쿠키를 유지하세요.
      operationId: authorize
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - ssafy
          - naver
      responses:
        "302":
          description: 설정에 따른 리다이렉트
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
            Location:
              description: "인가 시작은 공급자 URL, callback은 설정된 프론트 URI의 exchange_code fragment"
              schema:
                type: string
                format: uri
        "400":
          description: AUTH_UNSUPPORTED_PROVIDER
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "500":
          description: AUTH_CONFIGURATION_ERROR
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
