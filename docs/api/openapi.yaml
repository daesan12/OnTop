  securitySchemes:
    AccessJwt:
      type: http
      description: 30분 Access JWT. 서명/Issuer/Audience/typ/token_use/만료 및 sid·활성 회원
        검증. 로그아웃한 로그인 계열·탈퇴 회원은 거절합니다.
      scheme: bearer
      bearerFormat: JWT
    OnboardingBearer:
      type: http
      description: 89번 교환 API의 ob_ 온보딩 전용 Bearer. 독립 인증·600초. 온보딩/닉네임 조회만 가능하며 조회는
        소비하지 않습니다. Access JWT가 아닙니다.
      scheme: bearer
      bearerFormat: opaque
    RefreshCookie:
      type: apiKey
      description: HttpOnly Refresh 쿠키. Origin 필수. 브라우저는 Cookie 헤더를 임의로 설정할 수 없으므로
        Authorize 입력으로 쿠키를 만들 수 없습니다. 실제 로그인으로 발급받습니다.
      name: ONTOP_REFRESH
      in: cookie
    OAuthSession:
      type: apiKey
      description: 인가 시작에서 생성된 동일 OAuth HttpSession. callback의 state와 exchangeCode에
        결합됩니다. 교환 성공 시 세션 ID가 회전합니다.
      name: JSESSIONID
      in: cookie
