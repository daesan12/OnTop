  /api/v1/minigames/sessions/{sessionId}:
    get:
      tags:
      - MINIGAME
      summary: 본인 미니게임 상태 조회
      description: "local,db 또는 dev,db에서 사용하며, 운영 prod,db에서도 기능 플래그로 활성화할 수 있습니다.\
        \ dev는 기본 활성화하며 공통 스키마에 V110/V111, v4 초기화 V124, 납품 영수증 V125, 최종 정산 V126을 추\
        가합니다. 운영은 DB 이력과 마이그레이션 위치 검토가 먼저 필요합니다. 버전 생략은 기존 v2이고 v4는 명시적으로 선택합니다. v4는\
        \ 납품 승인·checkpoint·다음 주문, 마지막 미승인 납품 검증, 영속 멱등 완료와 Wallet 일일 한도 지급을 제공합니다\
        . v2는 60초, 15점당 1냥, KST 하루 100냥 계약을 유지합니다. 탭 이동 중에도 시간은 흐르며 랭킹은 제외합니다. score·\
        rewardAmount·userId를 본문에 넣지 않습니다. 상태 GET도 지갑 잠금과 만료 세션 INVALID 갱신을 수행할 수 있\
        습니다. 읽기 전용 트랜잭션이 아닙니다. v5(신규 판 120초·90초부터 가속, 기존 v5-20261027.1 판은 저장된 180초\
        ·150초 규칙 유지, 활성 손님 3명, 선택 납품·충원, V128)도 제공하며 v5는 서버 설정 ontop.minigames.bungeoppang-v5-enabled=true일\
        \ 때만 받고, 기본값(false)에서는 409 RULES_VERSION_MISMATCH입니다."
      operationId: load
      parameters:
      - name: sessionId
        in: path
        description: 본인 세션의 양의 BIGINT ID (최대 9223372036854775807)
        required: true
        schema:
          pattern: "^[1-9][0-9]{0,18}$"
          type: string
      - name: includeSource
        in: query
        description: v4·v5 세션에서 규칙·불 원본·발급 시각을 포함합니다. v2 응답에는 영향을 주지 않습니다.
        required: false
        schema:
          type: boolean
          default: false
      - name: includeProgress
        in: query
        description: 종결된 v4·v5 세션에서도 마지막 checkpoint·승인 로그·발급 주문 이력을 포함합니다.
        required: false
        schema:
          type: boolean
          default: false
      - name: deliveryKey
        in: query
        description: v4·v5 납품 영수증 결과를 조회합니다. 미처리·처리 중이면 UNKNOWN입니다.
        required: false
        schema:
          maxLength: 64
          minLength: 1
          pattern: "^[A-Za-z0-9_-]{1,64}$"
          type: string
      responses:
        "200":
          description: 본인 세션
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/MinigameStatusResponse"
                - $ref: "#/components/schemas/BungeoppangV4SessionResponse"
                - $ref: "#/components/schemas/BungeoppangV5SessionResponse"
        "404":
          description: MINIGAME_NOT_FOUND
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinigameErrorResponse"
        "400":
          description: INVALID_REQUEST / UNSUPPORTED_MINIGAME
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinigameErrorResponse"
        "401":
          description: 인증된 활성 회원 필요
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/MinigameErrorResponse"
        "503":
          description: MINIGAME_NOT_CONFIGURED / MINIGAME_UNAVAILABLE 또는 인증 DB 장애
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/MinigameErrorResponse"
        "403":
          description: Origin 또는 ROLE_MEMBER 접근 거절
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/AuthErrorResponse"
                - $ref: "#/components/schemas/MinigameErrorResponse"
        "500":
          description: AUTH_TOKEN_CONFIGURATION_ERROR
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - AccessJwt: []
  /api/v1/minigames/bungeoppang/rankings:
    get:
      tags:
      - Bungeoppang Ranking
      summary: 붕어빵 버전별 개인 최고 전체 랭킹
      description: "v4/v5의 확정 완료·정산 기록을 분리합니다. 완성 내림차순·실수 오름차순, 동점1,1,3. v5는 판에 저장\
        된 플레이 시간(durationMs)별로 따로 집계합니다. 생략하면 신규 판의 120000(2분), 180000이면 기존 3분 판 기\
        록이며 같은 시간의 configVersion은 함께 집계합니다. 커서 없는 조회는 최신 DB를 읽고 후속 페이지는 최대2분의 동일 스\
        냅샷을 읽습니다."
      operationId: rankings_1
      parameters:
      - name: period
        in: query
        required: false
        schema:
          type: string
          default: ALL_TIME
          enum:
          - ALL_TIME
      - name: rulesVersion
        in: query
        required: false
        schema:
          type: string
          default: v5
          enum:
          - v4
          - v5
      - name: limit
        in: query
        required: false
        schema:
          maximum: 20
          minimum: 1
          type: integer
          default: 20
      - name: durationMs
        in: query
        description: "v5 전용 플레이 시간(ms): 120000(신규 2분 판, 생략 시 기본) 또는 180000(기존 3분 판\
          ). 그 외 값이나 v4에 지정하면 400 RANKING_INVALID_DURATION. 커서 조회는 첫 조회와 같은 값이어야 합\
          니다."
        required: false
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: 동일 스냅샷 페이지 (no-store)
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BungeoppangRankingPage"
        "400":
          description: INVALID_LIMIT / INVALID_CURSOR / RANKING_INVALID_PERIOD / RANKING_INVALID_RULES_VERSION
            / RANKING_INVALID_DURATION
          headers:
            Cache-Control:
              description: no-store
