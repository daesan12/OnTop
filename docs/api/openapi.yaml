components:
  schemas:
    UserOnboardingRequest:
      required:
      - characterGender
      - nickname
      type: object
      properties:
        nickname:
          maxLength: 8
          minLength: 2
          pattern: "^[가-힣A-Za-z0-9]{2,8}$"
          type: string
          example: 미지
        characterGender:
          type: string
          example: FEMALE
          enum:
          - MALE
          - FEMALE
      additionalProperties: false
    UserOnboardingResponse:
      required:
      - accessToken
      - characterGender
      - expiresIn
      - nickname
      - tokenType
      - userId
      type: object
      properties:
        userId:
          type: integer
          format: int64
        nickname:
          type: string
        characterGender:
          type: string
          enum:
          - MALE
          - FEMALE
        accessToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
    AuthErrorResponse:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    PurchaseResponse:
      required:
      - balanceAfter
      - itemId
      - purchaseId
      - quantity
      - totalPrice
      - unitPrice
      - userItemId
      type: object
      properties:
        purchaseId:
          type: string
        itemId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        unitPrice:
          type: integer
          format: int64
        totalPrice:
          type: integer
          format: int64
        balanceAfter:
          type: integer
          format: int64
        userItemId:
          type: integer
          format: int64
    ShopErrorResponse:
      required:
      - code
      - details
      - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
