  /api/v1/minigames/bungeoppang/rankings:
    get:
      tags:
      - Bungeoppang Ranking
      summary: 붕어빵 버전별 개인 최고 전체 랭킹
      description: "v4/v5의 확정 완료·정산 기록을 분리합니다. 완성 내림차순·실수 오름차순, 동점1,1,3. v5는 판에 저장\
        된 플레이 시간(durationMs)별로 따로 집계합니다. 생략하면 신규 판의 120000(2분), 180000이면 기존 3분 판 기\
        록이며 같은 시간의 configVersion은 함께 집계합니다. 커서 없는 조회는 최신 DB를 읽고 후속 페이지는 최대2분의 동일 스\
        냅샷을 읽습니다."
      operationId: rankings_3
      parameters:
      - name: period
        in: query
        required: false
        schema:
          type: string
          default: ALL_TIME
          enum:
          - ALL_TIME
      - name: rulesVersion
        in: query
        required: false
        schema:
          type: string
          default: v5
          enum:
          - v4
          - v5
      - name: limit
        in: query
        required: false
        schema:
          maximum: 20
          minimum: 1
          type: integer
          default: 20
      - name: durationMs
        in: query
        description: "v5 전용 플레이 시간(ms): 120000(신규 2분 판, 생략 시 기본) 또는 180000(기존 3분 판\
          ). 그 외 값이나 v4에 지정하면 400 RANKING_INVALID_DURATION. 커서 조회는 첫 조회와 같은 값이어야 합\
          니다."
        required: false
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: 동일 스냅샷 페이지 (no-store)
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BungeoppangRankingPage"
        "400":
          description: INVALID_LIMIT / INVALID_CURSOR / RANKING_INVALID_PERIOD / RANKING_INVALID_RULES_VERSION
            / RANKING_INVALID_DURATION
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "401":
          description: 회원 인증 필요
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "403":
          description: Origin·권한 거부
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "409":
          description: RANKING_SNAPSHOT_EXPIRED — 처음부터 재조회
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "503":
          description: RANKING_UNAVAILABLE / RANKING_TOO_LARGE
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
      security:
      - AccessJwt: []
