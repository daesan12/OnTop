plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ssafy.ontop'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.10'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'mysql'
    }
}

tasks.register('mysqlTest', Test) {
    description = '별도 MySQL 8.4 DB에서 V1/V2·제약조건·JPA 매핑·인증 상태와 교환 검증'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'mysql'
    }
    // JVM 기본 시간대가 UTC가 아니어도 TIMESTAMP/Instant 왕복이 같은 시각인지 확인한다.
    systemProperty 'user.timezone', 'Asia/Seoul'
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'short'
    }
}

tasks.register('flowTest', Test) {
    description = '착석·준비·heartbeat 끊김·29초 복귀/30초 만료 시나리오 실행'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.ssafy.ontop.table.FullFlowTests'
    }
    // 반복 실행해도 실제 소켓 시나리오를 다시 확인한다.
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    systemProperty 'logging.level.root', 'ERROR'
    systemProperty 'spring.main.banner-mode', 'off'
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
        exceptionFormat = 'short'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
