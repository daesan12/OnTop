plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ssafy.ontop'
version = '0.0.1-SNAPSHOT'

springBoot {
    buildInfo {
        properties { time = null }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// One dictionary for the browser mask and the local police trigger.
tasks.named('processResources') {
    def browserDictionary = file('../frontend/src/features/chat/filterRules.json')
    if (browserDictionary.exists()) inputs.file(browserDictionary)
    doFirst {
        def browserRules = file('../frontend/src/features/chat/filterRules.json')
        if (browserRules.exists() && browserRules.readLines('UTF-8') != file('src/main/resources/ai/filterRules.json').readLines('UTF-8')) {
            throw new GradleException('Synchronize backend ai/filterRules.json with the browser dictionary')
        }
    }
}

dependencies {
    implementation 'software.amazon.awssdk:s3:2.31.77'
    implementation 'org.dyn4j:dyn4j:6.0.0'
    implementation 'com.github.stephengold:Minie:9.0.3'
    implementation 'org.jmonkeyengine:jme3-desktop:3.8.1-stable'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.10'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Provider library only; our explicit AI_ENABLED configuration creates the client.
    implementation 'org.springframework.ai:spring-ai-openai:1.1.8'
    implementation 'org.springframework.ai:spring-ai-client-chat:1.1.8'
    testImplementation('io.swagger.parser.v3:swagger-parser-v3:2.1.36') {
        // parser의 javax Swagger core와 중복하지 않고 springdoc의 Jakarta core를 재사용한다.
        exclude group: 'io.swagger.core.v3'
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

