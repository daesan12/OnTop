plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ssafy.ontop'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('flowTest', Test) {
    description = '광장·테이블 전체 흐름 및 heartbeat·29초 복귀/30초 만료 시나리오 실행'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.ssafy.ontop.table.FullFlowTests'
        includeTestsMatching 'com.ssafy.ontop.table.WorldFullFlowTests'
    }
    // 반복 실행해도 실제 소켓 시나리오를 다시 확인한다.
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    systemProperty 'logging.level.root', 'ERROR'
    systemProperty 'spring.main.banner-mode', 'off'
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
        exceptionFormat = 'short'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
