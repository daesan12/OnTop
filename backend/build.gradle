tasks.named('test') {
    // 생성 맵·실제 소켓 서버를 포함한 전체 회귀에서 컨텍스트 32개가 누적되면
    // CI 테스트 JVM의 힙이 고갈된다. 오래된 컨텍스트와 서버를 조기에 닫는다.
    systemProperty 'spring.test.context.cache.maxSize', '8'
    maxHeapSize = '1g'
    // CI 호스트의 메모리 예산과 고정 포트 테스트의 격리를 유지한다.
    maxParallelForks = 1
    doFirst {
        logger.lifecycle('Backend test JVM: maxHeap={}, parallelForks={}, contextCache={}',
                maxHeapSize, maxParallelForks, systemProperties['spring.test.context.cache.maxSize'])
    }
    useJUnitPlatform {
        excludeTags 'mysql'
    }
}

// 자식 검수 JVM의 classpath를 인자로 반복하면 SDK 추가 후 Windows 32K 한도를 넘는다.
// 실제 test runtime 파일 목록은 동일하게 유지하고 manifest의 Class-Path로 전달한다.
def mysqlRuntimeClasspathJar = tasks.register('mysqlRuntimeClasspathJar', Jar) {
    dependsOn testClasses
    archiveFileName = 'mysql-runtime-classpath.jar'
    destinationDirectory = layout.buildDirectory.dir('tmp/mysql-classpath')
    outputs.upToDateWhen { false }
    doFirst {
        manifest.attributes('Class-Path': sourceSets.test.runtimeClasspath.files.collect { it.toURI().toASCIIString() }.join(' '))
    }
}

tasks.register('mysqlTest', Test) {
    description = '별도 MySQL 8.4 DB에서 V1/V2·제약조건·JPA 매핑·인증 상태와 교환 검증'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'mysql'
    }
    // JVM 기본 시간대가 UTC가 아니어도 TIMESTAMP/Instant 왕복이 같은 시각인지 확인한다.
    systemProperty 'user.timezone', 'Asia/Seoul'
    // 전체 MySQL 회귀에서 캐시된 컨텍스트마다 Hikari 풀이 남아 연결 한도를 소진하지 않게 한다.
    // 개별 테스트의 풀 크기·동시성은 유지하고, 오래된 테스트 컨텍스트와 유휴 풀만 닫는다.
    systemProperty 'spring.test.context.cache.maxSize', '8'
    // 격리 outbox 재시작 테스트의 별도 JVM에 동일한 테스트 classpath를 전달한다.
    dependsOn mysqlRuntimeClasspathJar
    systemProperty 'ontop.test.runtime-classpath', mysqlRuntimeClasspathJar.get().archiveFile.get().asFile.absolutePath
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'short'
    }
}

