spring:
  config:
    activate:
      on-profile: "(prod | production) & !dev & !local"
  jpa:
    properties:
      hibernate:
        generate_statistics: ${ONTOP_OBSERVABILITY_JPA_STATISTICS_ENABLED:false}
ontop:
  observability:
    jpa-statistics-enabled: ${ONTOP_OBSERVABILITY_JPA_STATISTICS_ENABLED:false}
management:
  server:
    address: 0.0.0.0
    port: 8082
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ontop-prod
      environment: prod
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 5s
logging:
  level:
    org.hibernate.stat: WARN
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
