server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        secure: false

ontop:
  auth:
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
    refresh-cookie:
      secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
  oauth:
    ssafy:
      redirect-uri: ${SSAFY_REDIRECT_URI:http://localhost:8080/api/v1/auth/ssafy/callback}
    naver:
      redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:8080/api/v1/auth/naver/callback}
