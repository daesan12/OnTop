# Reviewed renewal-map runtime. No test login, credentials, loopback port, or DB reset.
# Activate explicitly alongside dev,db during the coordinated FE/BE release.
ontop:
  world:
    map:
      source: renewal
      require-match: true
      json-path: ${PARK_RENEWAL_MAP_DIR:/run/ontop/park-renewal}/server-map.local.json
      manifest-path: ${PARK_RENEWAL_MAP_DIR:/run/ontop/park-renewal}/server-manifest.local.json
    movement:
      client-position: true
      tuned-profile: true
    jumpmap:
      enabled: true
      course-json-path: ${PARK_RENEWAL_MAP_DIR:/run/ontop/park-renewal}/course.local.json
      course-checksum-path: ${PARK_RENEWAL_MAP_DIR:/run/ontop/park-renewal}/course.local.sha256
