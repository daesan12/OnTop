"name": "20 본인 미니게임 상태"
"$kind": "http-request"
"method": "GET"
"url": "{{baseUrl}}/api/v1/minigames/sessions/{{minigameSessionId}}"
"description": "MINI-02: 본인만 조회. 진행 중 score/endedAt=null, rewardAmount=0. 타인은404."
"auth":
  "type": "noauth"
"scripts":
  -
    "type": "beforeRequest"
    "code": "if (!pm.environment.name) throw new Error('먼저 OnTop Local 환경을 선택해주세요.');\nif (!pm.environment.get('accessToken')) throw new Error('개인 로컬 Access JWT가 필요합니다.');\nif(!/^[1-9][0-9]*$/.test(String(pm.environment.get('minigameSessionId')||''))) throw new Error('먼저19를 실행하세요.');"
  -
    "type": "afterResponse"
    "code": "pm.test('HTTP 200', () => pm.response.to.have.status(200));\npm.expect(pm.response.json().minigameSessionId).to.eql(pm.environment.get('minigameSessionId'));"
"headers":
  -
    "key": "Authorization"
    "value": "Bearer {{accessToken}}"
  -
    "key": "Origin"
    "value": "{{baseUrl}}"
