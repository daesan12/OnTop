"name": "34 붕어빵 v5 다음 페이지 — cursor 있을 때만"
"$kind": "http-request"
"method": "GET"
"url": "{{baseUrl}}/api/v1/minigames/bungeoppang/rankings?period=ALL_TIME&rulesVersion=v5&durationMs=120000&limit=20&cursor={{bungeoRankingCursor}}"
"description": "붕어빵 v4/v5 개인 최고 전체 랭킹. 기존 회원 JWT/db 필요. score DESC·같은 경기 maxCombo DESC, 동점1,1,3·정산시각 우선. 완료·정산 확정만 포함(보상0도 포함). 첫 페이지는 최신 DB, 후속은 동일2분 스냅샷. cursor는 같은 사용자/버전/플레이시간/limit로만 사용. 409 RANKING_SNAPSHOT_EXPIRED면 처음부터 재조회. 랭킹은 기존 정산 기록을 조회합니다. F1 일시정지는 별도 V132 적용이 필요합니다. 개발 서버 배포·실계정 검수 별도. docs/bungeoppang-rankings-api.md"
"auth":
  "type": "noauth"
"scripts":
  -
    "type": "beforeRequest"
    "code": "if (!pm.environment.name) throw new Error('먼저 OnTop Local 환경을 선택해주세요.');\nif (!pm.environment.get('bungeoRankingCursor')) throw new Error('다음 페이지가 없습니다. 33부터 조회하세요.');"
  -
    "type": "afterResponse"
    "code": "pm.test('HTTP 200', () => pm.response.to.have.status(200));\npm.test('개인 최고 랭킹 계약', () => {\n    const b = pm.response.json();\n    pm.expect(b.basis).to.eql('PERSONAL_BEST');\n    pm.expect(b.period).to.eql('ALL_TIME');\n    pm.expect(b.items).to.be.an('array');\n    pm.expect(b.items.length).to.be.at.most(20);\n    pm.expect(pm.response.headers.get('Cache-Control')).to.include('no-store');\n});\nif (pm.response.code === 200) {\n    const b = pm.response.json();\n    pm.environment.set('bungeoRankingCursor', b.nextCursor || '');\n    pm.environment.set('bungeoRankingSnapshotId', b.snapshotId);\n}"
"headers":
  -
    "key": "Authorization"
    "value": "Bearer {{accessToken}}"
