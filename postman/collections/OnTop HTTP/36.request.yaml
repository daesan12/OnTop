"name": "36 붕어빵 랭킹 limit 오류"
"$kind": "http-request"
"method": "GET"
"url": "{{baseUrl}}/api/v1/minigames/bungeoppang/rankings?rulesVersion=v5&limit=21"
"description": "붕어빵 v4/v5 개인 최고 전체 랭킹. 기존 회원 JWT/db 필요. made DESC·failed ASC, 동점1,1,3·완료시각 우선. 완료·정산 확정만 포함(보상0도 포함). 첫 페이지는 최신 DB, 후속은 동일2분 스냅샷. cursor는 같은 사용자/버전/limit로만 사용. 409 RANKING_SNAPSHOT_EXPIRED면 처음부터 재조회. 신규 SQL/팀원 완료코드 변경 없음. 개발 서버 배포·실계정 검수 별도. docs/bungeoppang-rankings-api.md"
"auth":
  "type": "noauth"
"scripts":
  -
    "type": "afterResponse"
    "code": "pm.test('HTTP 400', () => pm.response.to.have.status(400));\npm.test('INVALID_LIMIT', () => pm.expect(pm.response.json().code).to.eql('INVALID_LIMIT'));"
"headers":
  -
    "key": "Authorization"
    "value": "Bearer {{accessToken}}"
