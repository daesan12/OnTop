"name": "31 랭킹 limit 범위 오류"
"$kind": "http-request"
"method": "GET"
"url": "{{baseUrl}}/api/v1/rankings?limit=101"
"description": "RANK-01 · GET /api/v1/rankings?limit=20 (1~100). 기존 Access JWT와 db 프로필이 필요합니다. 예약금을 포함한 전체 balance 내림차순, 동점 RANK(1,1,3)·userId 오름차순. 최대 limit명이며 TOP 밖 본인도 myRank로 반환합니다. 탈퇴·지갑 미생성 회원 제외, 본인 지갑 미생성 시 myRank=null. updatedAt은 조회 시각, 모든 응답 no-store. 신규 SQL·지급·예약·지갑 생성 없음. 로컬 구현과 실제 개발 서버 배포는 별개입니다. baseUrl과 accessToken은 개인 환경에만 설정하세요."
"auth":
  "type": "noauth"
"scripts":
  -
    "type": "afterResponse"
    "code": "pm.test('HTTP 400', () => pm.response.to.have.status(400));\npm.test('INVALID_LIMIT', () => pm.expect(pm.response.json().code).to.eql('INVALID_LIMIT'));"
"headers":
  -
    "key": "Authorization"
    "value": "Bearer {{accessToken}}"
