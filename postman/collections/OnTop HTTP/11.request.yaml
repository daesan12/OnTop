"name": "11 로그인 사용자 채널 목록 조회"
"$kind": "http-request"
"method": "GET"
"url": "{{baseUrl}}/api/v1/channels"
"description": "local,db와 실제 로그인 Access JWT가 필요합니다. 개인 로컬 accessToken 사용. 조회는 입장/예약을 하지 않습니다. WS07의 CHANNEL_JOIN 뒤 다시 보내면 currentUsers/joinable 변화를 확인할 수 있습니다. 채널 미설정은 items:[]입니다. 401 미인증/만료/탈퇴,403 출처거절,503 인증/인원 조회 장애. 토큰을 공유하지 마세요."
"auth":
  "type": "noauth"
"scripts":
  -
    "type": "afterResponse"
    "code": "pm.test('HTTP 200', () => pm.response.to.have.status(200));\npm.test('채널 목록 형식', () => {\n    const items = pm.response.json().items;\n    pm.expect(items).to.be.an('array');\n    items.forEach(item => {\n        pm.expect(item).to.have.all.keys('channelId', 'name', 'currentUsers', 'capacity', 'joinable');\n        pm.expect(item.currentUsers).to.be.a('number').and.at.least(0);\n        pm.expect(item.joinable).to.eql(item.currentUsers < item.capacity);\n    });\n});"
"headers":
  -
    "key": "Authorization"
    "value": "Bearer {{accessToken}}"
  -
    "key": "Origin"
    "value": "{{baseUrl}}"
