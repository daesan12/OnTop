"name": "30 보유 엽전 랭킹·본인 순위"
"$kind": "http-request"
"method": "GET"
"url": "{{baseUrl}}/api/v1/rankings?limit=20"
"description": "RANK-01 · GET /api/v1/rankings?limit=20 (1~100). 기존 Access JWT와 db 프로필이 필요합니다. 예약금을 포함한 전체 balance 내림차순, 동점 RANK(1,1,3)·userId 오름차순. 최대 limit명이며 TOP 밖 본인도 myRank로 반환합니다. 탈퇴·지갑 미생성 회원 제외, 본인 지갑 미생성 시 myRank=null. updatedAt은 조회 시각, 모든 응답 no-store. 신규 SQL·지급·예약·지갑 생성 없음. 로컬 구현과 실제 개발 서버 배포는 별개입니다. baseUrl과 accessToken은 개인 환경에만 설정하세요."
"auth":
  "type": "noauth"
"scripts":
  -
    "type": "afterResponse"
    "code": "pm.test('HTTP 200', () => pm.response.to.have.status(200));\npm.test('랭킹 응답·최대 인원·정렬', () => {\n    const body = pm.response.json();\n    pm.expect(body).to.have.all.keys('items', 'myRank', 'updatedAt');\n    pm.expect(body.items).to.be.an('array');\n    pm.expect(body.items.length).to.be.at.most(20);\n    pm.expect(Number.isNaN(Date.parse(body.updatedAt))).to.eql(false);\n    body.items.forEach((item, index) => {\n        pm.expect(item).to.have.all.keys('rank', 'userId', 'nickname', 'coinBalance');\n        pm.expect(item.userId).to.be.a('string');\n        pm.expect(item.rank).to.be.at.least(1);\n        if (index > 0) {\n            const previous = body.items[index - 1];\n            pm.expect(previous.coinBalance).to.be.at.least(item.coinBalance);\n            if (previous.coinBalance === item.coinBalance) pm.expect(item.rank).to.eql(previous.rank);\n        }\n    });\n    pm.expect(pm.response.headers.get('Cache-Control')).to.include('no-store');\n});"
"headers":
  -
    "key": "Authorization"
    "value": "Bearer {{accessToken}}"
