"name": "12 로그인 사용자 테이블 조회·ID 저장"
"$kind": "http-request"
"method": "GET"
"url": "{{baseUrl}}/api/v1/tables?channelId={{channelIdA}}"
"description": "TABLE-01: local,db + ontop.websocket.authenticated=true와 실제 로그인 Access JWT가 필요합니다. HTTP11에서 선택한 채널을 개인 channelIdA로 설정하고 이 응답의 tableIdA로 WS07에서 착석합니다. 채널 입장·착석·게임 선택·준비·퇴장/heartbeat 뒤 재조회하면 공개 요약을 확인합니다. 조회는 예약이 아닙니다. 401 미인증/만료/비활성,403 출처거절,503 인증/계정 장애. 인증 후400 채널 누락·404 없는 채널. 기본 개발 모드는03/04이며 실제 DB 차감/정산 성공 검증과 구분합니다. 토큰을 공유하지 마세요."
"auth":
  "type": "noauth"
"scripts":
  -
    "type": "beforeRequest"
    "code": "if (!pm.environment.name) throw new Error('먼저 OnTop Local 환경을 선택해주세요.');\npm.environment.unset('tableIdA');"
  -
    "type": "afterResponse"
    "code": "pm.test('HTTP 200', () => pm.response.to.have.status(200));\n\npm.test('테이블 목록 형식', () => {\n    const tables = pm.response.json().tables;\n    pm.expect(tables).to.be.an('array').that.is.not.empty;\n    pm.expect(tables[0].tableId).to.be.a('string').and.not.empty;\n});\nif (pm.response.code === 200) {\n    const tables = pm.response.json().tables;\n    if (Array.isArray(tables) && tables[0] && typeof tables[0].tableId === 'string') {\n        pm.environment.set('tableIdA', tables[0].tableId);\n    }\n}\npm.test('공개 요약과 캐시 금지', () => {\n    pm.expect(pm.response.headers.get('Cache-Control')).to.include('no-store');\n    pm.response.json().tables.forEach(table => {\n        pm.expect(table).to.have.all.keys('tableId', 'capacity', 'minimumPlayers', 'occupiedSeats',\n            'availableSeats', 'readyCount', 'allReady', 'status', 'joinable', 'gameCode', 'targetScore');\n        pm.expect(table.availableSeats).to.eql(table.capacity - table.occupiedSeats);\n        pm.expect(table.joinable).to.eql(table.status === 'WAITING' && table.availableSeats > 0);\n    });\n});"
"headers":
  -
    "key": "Authorization"
    "value": "Bearer {{accessToken}}"
  -
    "key": "Origin"
    "value": "{{baseUrl}}"
