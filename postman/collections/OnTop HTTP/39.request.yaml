"name": "39 내 게임별 전적"
"$kind": "http-request"
"method": "GET"
"url": "{{baseUrl}}/api/v1/users/me/game-stats"
"description": "HISTORY-01/02. 기존 회원 Access JWT·db 프로필 필요. 본인 종료/무효 경기만 DB ID 내림차순, size1~100·기본20. gameCode OMOK/DICE/ONE_CARD/LIAR_BRIDGE/DICE_LEDGER/HALLI_GALLI/ALKKAGI, 정산대기는 내역과 확정 승패에 포함. 무효는 내역만 표시·통계 제외. played=wins+losses+forfeits+draws, 기권을 losses에 중복 포함하지 않음. 조회는 판돈/정산/원장을 수정하지 않음. cursor는 마지막 경기 DB ID 문자열. 뒤늦게 종료된 경기는 새 첫 조회에서 다시 확인. docs/game-history-api.md."
"auth":
  "type": "noauth"
"scripts":
  -
    "type": "afterResponse"
    "code": "pm.test('HTTP 200', () => pm.response.to.have.status(200));\npm.test('승패 기권 중복 제외',()=>{\n        pm.response.json().items.forEach(i=>pm.expect(i.played).to.eql(i.wins+i.losses+i.forfeits+i.draws));\n    });"
"headers":
  -
    "key": "Authorization"
    "value": "Bearer {{accessToken}}"
