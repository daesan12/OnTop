"name": "19 붕어빵 시작 — 세션 ID 저장"
"$kind": "http-request"
"method": "POST"
"url": "{{baseUrl}}/api/v1/minigames/sessions"
"description": "MINI-01 v2: local,db + ontop.minigames.enabled=true + V110/V111 필요. 같은 키는 같은 세션/불 세기. 새 키는 이전 판 포기. 60초·6칸·15점당1냥·KST 하루100냥. 탭 이동 중 시간 진행, 랭킹 제외."
"auth":
  "type": "noauth"
"scripts":
  -
    "type": "beforeRequest"
    "code": "if (!pm.environment.name) throw new Error('먼저 OnTop Local 환경을 선택해주세요.');\nif (!pm.environment.get('accessToken')) throw new Error('개인 로컬 Access JWT가 필요합니다.');\npm.environment.set('minigameRequestKey',pm.variables.replaceIn('{{$guid}}'));"
  -
    "type": "afterResponse"
    "code": "pm.test('HTTP 201', () => pm.response.to.have.status(201));\nif(pm.response.code===201){ const s=pm.response.json(); pm.environment.set('minigameSessionId',s.minigameSessionId); pm.environment.set('minigameHeats',JSON.stringify(s.heats)); pm.environment.set('minigameStartedAt',s.startedAt); pm.environment.unset('minigameLog'); pm.expect(s.heats).to.have.lengthOf(64); pm.expect(s.rulesVersion).to.eql('v2'); }"
"headers":
  -
    "key": "Authorization"
    "value": "Bearer {{accessToken}}"
  -
    "key": "Origin"
    "value": "{{baseUrl}}"
  -
    "key": "Content-Type"
    "value": "application/json"
  -
    "key": "Idempotency-Key"
    "value": "{{minigameRequestKey}}"
"body":
  "mode": "raw"
  "raw": "{\n  \"minigameType\": \"BUNGEOPPANG\"\n}"
  "options":
    "raw":
      "language": "json"
