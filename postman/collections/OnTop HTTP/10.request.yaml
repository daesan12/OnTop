"name": "10 로그인 웹소켓 접속권 발급"
"$kind": "http-request"
"method": "POST"
"url": "{{baseUrl}}/api/v1/auth/websocket-ticket"
"description": "local,db + ontop.websocket.authenticated=true 필요. 개인 로컬 accessToken에 로그인 Access JWT를 입력하세요. 최대30초1회용 ticket을 받은 즉시 07 인증 연결에서 사용합니다. 원문 토큰·접속권을 공유/동기화하지 마세요."
"auth":
  "type": "noauth"
"scripts":
  -
    "type": "afterResponse"
    "code": "pm.test('HTTP 200', () => pm.response.to.have.status(200));\npm.test('접속권 응답', () => {\n    const body = pm.response.json();\n    pm.expect(body.ticket).to.match(/^wst_[A-Za-z0-9_-]{43}$/);\n    pm.expect(body.expiresIn).to.be.within(1, 30);\n});"
"headers":
  -
    "key": "Authorization"
    "value": "Bearer {{accessToken}}"
  -
    "key": "Origin"
    "value": "{{baseUrl}}"
