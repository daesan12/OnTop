"name": "28 익명 메모 동일 요청 재확인"
"$kind": "http-request"
"method": "POST"
"url": "{{baseUrl}}/api/v1/notes"
"description": "M08 공개 익명 메모. local/dev,db + notes.enabled=true + 전용 privacy-secret + V121 순서 조율 후 스키마 적용 필요. 서버 위치(54.5,18.92,48.5) XZ2.6m·높이차0.7m미만, 테이블/시설/수영 중 불가. 전 채널 공용 최신120장·쓰기15초/읽기1초. 공개 필드는 id,text,createdAt,category. category daily/cheer/worry/recommend/free, 생략free. 같은 키의 주제 변경은409. 24시간 동일키 재확인,410은 자동 재게시 금지. 정기GET없이 열기/재접속/NOTES_CHANGED 후 합쳐조회. V129 로컬후보: 팀원 버전·적용 순서 확인 전 푸시/공용DB적용금지. FE VITE_NOTES_CATEGORIES=true 빌드와 subscribe연결 필요. docs/notes-api.md."
"auth":
  "type": "noauth"
"scripts":
  -
    "type": "beforeRequest"
    "code": "if (!pm.environment.name) throw new Error('먼저 OnTop Local 환경을 선택해주세요.');\nif (!pm.environment.get('accessToken')) throw new Error('개인 로컬 Access JWT가 필요합니다.');\nif(!pm.environment.get('noteOperationId')) throw new Error('27을 먼저 실행하세요.');"
  -
    "type": "afterResponse"
    "code": "pm.test('HTTP 201', () => pm.response.to.have.status(201));\npm.expect(pm.response.json().note.id).to.eql(pm.environment.get('noteId'));"
"headers":
  -
    "key": "Authorization"
    "value": "Bearer {{accessToken}}"
  -
    "key": "Content-Type"
    "value": "application/json"
"body":
  "mode": "raw"
  "raw": "{\n  \"operationId\": \"{{noteOperationId}}\",\n  \"channelId\": \"{{channelIdA}}\",\n  \"text\": \"오늘도 좋은 하루 보내세요\",\n  \"category\": \"cheer\"\n}"
  "options":
    "raw":
      "language": "json"
