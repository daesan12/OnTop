"name": "14 아이템 구매 — 새 구매 키"
"$kind": "http-request"
"method": "POST"
"url": "{{baseUrl}}/api/v1/shop/purchases"
"description": "SHOP-02: 실행할 때마다 새 키를 만듭니다. 같은 구매 재확인은15를 사용합니다. 실제 상품 가격으로 엽전이 차감됩니다. 테스트 계정으로 확인하세요. 의상 중복 정책은 명시 설정이며 기본값이 없습니다."
"auth":
  "type": "noauth"
"scripts":
  -
    "type": "beforeRequest"
    "code": "if (!pm.environment.name) throw new Error('먼저 OnTop Local 환경을 선택해주세요.');\nif (!pm.environment.get('accessToken')) throw new Error('개인 로컬 Access JWT가 필요합니다.');\nif(!/^[1-9][0-9]*$/.test(String(pm.environment.get('shopItemId')||''))) throw new Error('13에서 판매 itemId를 선택하세요.');\npm.environment.set('purchaseRequestKey',pm.variables.replaceIn('{{$guid}}'));"
  -
    "type": "afterResponse"
    "code": "pm.test('HTTP 200', () => pm.response.to.have.status(200));\nconst body=pm.response.json(); pm.expect(body.purchaseId).to.be.a('string');\npm.environment.set('purchaseId',body.purchaseId); pm.environment.set('userItemId',body.userItemId);"
"headers":
  -
    "key": "Authorization"
    "value": "Bearer {{accessToken}}"
  -
    "key": "Origin"
    "value": "{{baseUrl}}"
  -
    "key": "Content-Type"
    "value": "application/json"
  -
    "key": "Idempotency-Key"
    "value": "{{purchaseRequestKey}}"
"body":
  "mode": "raw"
  "raw": "{\n  \"itemId\": {{shopItemId}},\n  \"quantity\": 1\n}"
  "options":
    "raw":
      "language": "json"
