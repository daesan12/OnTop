"name": "41 스피드 두더지 시작 — 새 키 또는 같은 키 재확인"
"$kind": "http-request"
"method": "POST"
"url": "{{baseUrl}}/api/v1/minigames/speed-mole/rounds"
"description": "스피드 두더지: V151 적용과 minigames 활성화 후 사용. 기존 두더지·지갑·공원 랭킹판은 변경하지 않음. 41은 준비3초+플레이60초의 서버 판. 새 판은 새 speedMoleRequestKey, 유실 재확인은 같은 키. 42/43은 60초 마감 후30초 이내 같은 판·타격 기록을 제출. 빈 로그는0점이며 예시로 치팅 방지를 증명하지 않음. 서버가 seed/타격을 재생해 점수·성공·실수를 확정하며 클라이언트 점수는 보내지 않음. 44는 최고점수↓/실수↑, 동점공동순위·먼저완료순. docs/speed-mole-api.md. 실제 배포·DB 검증 상태는 별도 확인."
"auth":
  "type": "noauth"
"scripts":
  -
    "type": "beforeRequest"
    "code": "if (!pm.environment.name) throw new Error('먼저 OnTop Local 환경을 선택해주세요.');\nif(!/^[A-Za-z0-9_-]{1,64}$/.test(pm.environment.get('speedMoleRequestKey')||'')) throw new Error('개인 환경 speedMoleRequestKey를 설정하세요. 새 판은 새 키, 재시도는 같은 키입니다.');"
  -
    "type": "afterResponse"
    "code": "pm.test('HTTP 201', () => pm.response.to.have.status(201));\nif(pm.response.code===201){const r=pm.response.json();pm.environment.set('speedMoleRoundId',r.id);}"
"headers":
  -
    "key": "Authorization"
    "value": "Bearer {{accessToken}}"
  -
    "key": "Idempotency-Key"
    "value": "{{speedMoleRequestKey}}"
