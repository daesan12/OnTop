"name": "05 채널 목록 — 현재는 인증 오류가 정상"
"$kind": "http-request"
"method": "GET"
"url": "{{baseUrl}}/api/v1/channels"
"description": "실제 로그인 코드가 없어 현재는 401 UNAUTHENTICATED가 정상입니다. 임의 userId·테스트 인증 헤더를 넣지 않습니다."
"auth":
  "type": "noauth"
"scripts":
  -
    "type": "afterResponse"
    "code": "pm.test('HTTP 401', () => pm.response.to.have.status(401));\npm.test('UNAUTHENTICATED', () => pm.expect(pm.response.json().code).to.eql('UNAUTHENTICATED'));"
