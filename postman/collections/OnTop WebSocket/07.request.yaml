"name": "07 로그인 사용자 — 1회용 접속권"
"$kind": "websocket-request"
"url": "{{wsUrl}}?ticket={{websocketTicket}}"
"description": "WORLD_MOVE는 {seq,dx,dz,run,jump?} 입력만 허용합니다. seq1~4294967295, dx/dz 각[-1,1] 대각선 정규화, run필수 boolean/jump선택. 서버30Hz·변화100ms동기화·입력 평균50ms당1개/일시4개·250ms만료. 걷기6.25/달리기9/점프6.2/중력-18/단차0.22. 채널 입장 시 서버 스폰(캡슐 중심), lastInputSeq는 수락순번, mapVersion 대조. 기존 sequence/x/y/z/yaw 주입은 INVALID_PAYLOAD. 재접속30초·채팅/관전20m 유지. 먼저 HTTP10을 보내 30초 접속권을 받으세요. 개인 로컬 websocketTicket에 넣고 즉시 Connect. HTTP10과 같은 Origin을 사용하고 재접속마다 새 접속권을 발급합니다. JWT는 URL에 넣지 않습니다. CONNECTED 내부ID → TABLE_JOIN → GAME_SELECT → READY_SET, 중복 연결1008·heartbeat·30초복구는 기존 계약입니다. 실제 시작은 ontop.game-start.enabled=true + 실제 B GameStartGateway + 사용할 엔진이 필요합니다. 전원 준비 → STARTING → 전원 판돈 예약 커밋 후 PLAYING(simulation=false), GAME_CONNECTION_STATE로 본인 상태/조작권 복구. 시작 시 즉시 차감하지 않고 종료 정산 때 예약 해제·차감·승자 지급을 확정합니다. 실제 DB 처리는 별도입니다. 미확정이면07로 같은 시도를 조회하고 새 예약을 요청하지 않습니다. 개발 rehearsal과 동시 사용 금지. 기본 서버는 시작 옵션을 끈 상태이며 실제 DB Gateway가 없으므로 옵션만 켜서 성공하지 않습니다. 토큰/접속권 원문은 공유·동기화하지 마세요.\n\n2026-10-22 의상 동기화: local,db 또는 dev,db + ontop.shop.enabled=true(dev: SHOP_ENABLED=true). WS07의 인증 사용자 두 명이 같은 채널에 CHANNEL_JOIN 후 본인이 HTTP17로 장착하면 WORLD_STATE.payload.avatars[].equipment가 갱신됩니다. 다른 채널에는 전파하지 않습니다. 새 티켓→재접속→CHANNEL_JOIN 후 최신 장착을 복구합니다. 공개 필드는 itemId/itemCode/equipSlot/imageKey, 최대5개·부위당 하나이며 null은 미조회/사용 불가로 기존 외형 유지, []는 장착 없음입니다. 이동 tick은 캐시를 쓰고 조회 실패는 기존 외형을 유지합니다. 실제 3D 에셋 매핑·렌더링 연동은 별도 협의입니다. 예시: {\"requestId\":null,\"type\":\"WORLD_STATE\",\"payload\":{\"channelId\":\"channel-1\",\"version\":4,\"avatars\":[{\"userId\":\"101\",\"tableSeat\":null,\"position\":{\"lastInputSeq\":0,\"x\":-2.025,\"y\":0.84,\"z\":34,\"yaw\":0,\"moving\":false,\"running\":false,\"swimming\":false},\"equipment\":[{\"itemId\":1,\"itemCode\":\"RED_TOP\",\"equipSlot\":\"TOP\",\"imageKey\":\"demo-red-top\"}]}],\"mapVersion\":\"544bc6fa3890c77e8de0ec91d27f93981b4d23a477918963757e4762294ba8d0\"}}\n\n2026-10-24 공개 프로필: db 프로필의 인증 사용자로 채널 입장하면 WORLD_STATE.avatars[].nickname/characterGender가 비동기 갱신됩니다. characterGender는 MALE/FEMALE 캐릭터 외형이며 실제 성별이 아닙니다. 최초 미조회·DB 없는 사용자에는 null이며 기존 표시를 지우지 않습니다. 접속 중 회원은 5초마다 일괄 조회하므로 HTTP PATCH /api/v1/users/me로 닉네임 변경 후 다음 조회 완료 때 같은 채널에 반영됩니다. 재접속은 새 티켓→CHANNEL_JOIN. 다른 채널 미노출·클라이언트 프로필 주입 거절·조회 장애 시 기존 값 유지를 확인하세요. 기존 equipment/위치 계약은 유지합니다. 감정표현 5종은 WAVE/CLAP/APPLAUSE_REQUEST/TSK/FART, 손 인사/박수 5초·나머지 1.8초입니다. 가만히 서 있을 때만 허용하며 이동·점프 중 공중 상태·수영·테이블(대기 포함)·시설 중은 EMOTE_ACTIVITY_CONFLICT, 기존 경기 복구 게이트는 GAME_RECOVERY_REQUIRED입니다. 승인 후 새 이동/점프·착석·시설 이용은 WORLD_EMOTE_CANCELLED(requestId=null)를 같은 채널에 전송합니다. 이미 시작한 FART는 MOVEMENT만 예외로 유지하며 이동 중 새 표현은 계속 거절합니다. payload는 eventId/emoteEventId/channelId/userId/reason/sentAt이며 reason은 MOVEMENT/ACTIVITY_STARTED/CHANNEL_LEFT/DISCONNECTED입니다. 프론트는 현재 채널/사용자/재생 원본 eventId와 emoteEventId가 일치할 때만 취소하며 중복·늦은 취소·이미 끝난 표현은 무시합니다. 재생 중 MOVEMENT/ACTIVITY_STARTED 취소는 이전 쿨다운과 최소 간격을 해제해 정지 후 즉시 새 표현이 가능합니다. 정상 완료·채널 이동은 해제하지 않습니다. 별도 슬라이딩1초 최대5회 승인 제한은 취소로 초기화하지 않으며 초과는 EMOTE_TOO_FREQUENT입니다. 재생 유효기간은 WAVE2600/CLAP4867/나머지1600ms이며 만료 후 취소는 대기를 풀지 않습니다. 새 REST/클라이언트 취소 요청은 없습니다. FE park-bindings.emotes 매핑·3D 렌더링·배포 확인은 별도입니다.\n\n## 공개 테이블 착석 (2026-10-28 · 배포 전)\nWORLD_STATE.payload.avatars[].tableSeat는 {tableId,seatNumber:1~4} 또는 null이며 항상 포함합니다. 같은 채널 일반 사용자도 참가·관전 없이 받습니다. 최초/반복 입장·재접속에는 실제 현재 좌석, 착석·퇴장·강제 퇴장·재배치에는 월드 버전 증가와 약100ms 기존 방송을 사용해 좌표가 같아도 갱신합니다. 단절 아바타는 제거하고, 기존 유예로 보존된 좌석은 복귀 후 표시합니다. 준비·판돈·손패·참가 권한을 공개하지 않습니다. FE는 기존 서버 tableId/anchorId 매핑으로 표시하고 본인 버튼 권한은 기존 TABLE_STATE를 사용합니다. 로컬 코드 계약이며 FE 보존 브랜치 통합·실제3D·배포 검수는 별도입니다.\n\n2026-10-29 로컬 이동 예측: avatars[].motion{epoch,tick,appliedInputSeq,inputAgeMs,velocityY,grounded,inputActive}는 실제 물리 계산 결과입니다. lastInputSeq는 수락 확인이므로 appliedInputSeq와 다를 수 있습니다. 본인만 최대250ms 충돌 예측·서버 보정, 타인은 기존 보간·공식 거리 판정은 서버 유지. motion 없는 구서버/WASM 초기화 실패는 기존 표시를 유지합니다. 입력은 평균50ms당1개·일시버스트4개, 초과 시 MOVE_TOO_FREQUENT. 비교 수치는 로컬 제어 리플레이이며 실제 서버 배포·실계정 검수는 별도입니다. docs/world-movement-prediction.md.\n\n2026-10-29 로컬 확장: WORLD_STATE.tables 전체 목록의 tableId/anchorId/chairCount와 HTTP chairCount를 사용합니다. max(2,승인 인원,최대점유좌석)으로 채널별 실제 충돌을 켜고, 새 의자에 겹친 산책자는 서버 안전 위치로 이동합니다. 정적 mapVersion은 유지합니다. avatars[].activity=GAME은 실제 시작 승인 참가자만, 종료·정산 진입은 전원/기권·탈락은 해당 사용자만 null. SHOP은 미연결입니다. NOTES_CHANGED{revision문자열}는 새 메모 커밋 후 전 채널 알림이며 본문/작성자 없음. 열린 FE창만 읽기1초 제한에 맞춰 합쳐GET, 정기GET 없음. V129 번호 사용 가능 확인·MR 포함 승인(2026-10-29). 공용DB 적용·배포는 미확인. docs/world-table-chairs-api.md, docs/notes-api.md.\n\n## 서버 따라가기\n\n같은 채널의 두 계정이 CHANNEL_JOIN→WORLD_FOLLOW_CHECK 후 대상 WORLD_STATE.payload.avatars[].userId를 followTargetId에 넣고 START합니다. 서버 START/STOP/CHECK 응답·변경 방송은 WORLD_FOLLOW_STATE(channelId/version/links[])입니다. 본인 followerId의 followId를 followId 변수에 복사하고 STOP하세요. 상태는 전체 목록이며 낮은 버전은 무시합니다. 시작 XZ≤12m/높이≤2m, ≤2.2m 대기·>2.2~5m 걷기·>5m 달리기. PARK_V1은6/8m/s, 기본 프로필은6.25/9m/s. 거리>24m/높이>3.5m·단절/퇴장·양쪽 착석/시설/수영은 해제합니다. 승인된 직접 이동/점프는 본인 관계만 해제, 정지 heartbeat는 유지합니다. 장애물은 기존 충돌을 적용하며 우회/자동점프/시간해제는 없습니다. 자동 입력은 lastInputSeq를 소비하지 않고 좌표는 기존 WORLD_STATE로 수신합니다. 브라우저 이동 보고가 없어도 서버30Hz로 추적하며 PONG 단절은 기존대로 해제합니다. PARK_V1 자동 추적 중 authority는 생략하고 직접 조작/종료 후 다음 틱에 새 epoch의 CLIENT_VALIDATED로 복귀합니다. 서버는 관계를 재접속 시 복구하지 않으므로 캐시를 비우고 CHECK하세요. 늦은 STOP의 다른followId는 FOLLOW_LINK_MISMATCH. 동일 대상 반복 START는 현 상태 ACK, 대상 변경은 새 ID이며 자기자신/순환/범위 밖은 거절합니다. START를 무조건 재전송하지 말고 CHECK로 확인하세요. docs/world-follow-api.md. FE 3D 연결·배포는 별도입니다.\n\n## 맵 버전 확인\nCONNECTED.payload.map은 실제 로딩 맵이며 mapVerificationRequired=true면 확인 전 입장·경기 복구가 보류됩니다. 환경 mapId/mapVersion에는 FE가 사용하는 맵 값을 설정하세요. schemaVersion은 현재 정수1입니다. 서버 값을 맹목적으로 복사하지 마세요. WORLD_MAP_CONFIRM 성공 WORLD_MAP_STATE 후 기존 입장/복구 진행, MAP_VERSION_MISMATCH/REQUIRED는 serverMap으로 안내합니다. 새 연결마다 재확인하며 30초 경기 복구 기한은 연장되지 않습니다. 현재 기본 false, FE 새 맵 적용·배포는 별도. docs/world-map-api.md. 분수·의자 충돌 보정 로컬 legacy mapVersion=ae833248d2dd356c6603af72b2b865f9051a866e9cfa7d2b9c9abe890579944d(schema1). 기존 서버 배포 버전과 구분하고 FE EXPECTED_MAP_VERSION을 함께 맞춘 후 사용하세요. 기존 ID/이용 좌표/바인딩 유지, docs/integration/collision-feedback/contract.md.\n\n## 현재 맵 전체16개 테이블 (2026-10-27, 로컬 구현·미배포)\nchannel-1의 GET /api/v1/tables 결과16개와 docs/integration/legacy-tables/bindings.dev.json의 bindings를 교차 확인합니다. 기존두ID·맵버전은 유지하고 채널마다 별도 방입니다. 실제 Spring 서버의 GAME_START_CHECK는 시작 연결이 꺼져 있으면 START_NOT_CONFIGURED를 반환합니다. Spring AUTO의 전원 준비 직후 시작 연결이 없으면 같은 테이블 인증 참가자에게 ERROR(requestId=null,START_NOT_CONFIGURED)를 알립니다. 준비 성공과 별개이며 예약·경기는 생성하지 않습니다. 이 추가 알림은 로컬 수정·배포 전입니다. 테이블 등록만으로 DB 예약/정산·엔진을 활성화하지 않습니다. docs/legacy-table-integration.md. \n\n## 새 태블릿 MANUAL 모드 (2026-10-27, 로컬 구현·미배포)\n방장 TABLE_CONFIGURE로 게임/정확한 정원/목표/판돈/expectedVersion을 확정한 뒤 전원이 READY_SET하고 방장만 TABLE_START합니다. TABLE_STATE에서 실제 version을 tableVersion에 복사하세요. 기존 GAME_SELECT AUTO와 구분하며 MANUAL에서는 GAME_SELECT를 거절합니다. 전원 준비 후120초 TABLE_HOST_WAIT_STATE(serverNow/expiresAt/epoch/revision/tableVersion/hostUserId/cancelReason), 취소/설정·인원 변경은 새 준비 필요. TABLE_HOST_TIMEOUT은 방장만 테이블 퇴장·남은 착석자 중 추첨·전원준비 해제, 같은 소켓은 유지합니다. 시작 actionId는 같은 요청 재확인에 유지하고 실패 뒤 새 전원준비/새 actionId로 요청합니다. MANUAL 대기석은 일반 끊김30초 동일 로그인 세션 복귀에 기존 기한 유지, 맵 미확인으로 유예 연장 불가. 전체 정산 확정 뒤 승자/남은 공동승자·무승부 중 추첨, 부재/무효는 남은 전체 중 추첨. DB 예약·정산은 기존 경계 유지. docs/tablet-lobby-api.md. \n\n## 서버 낮밤 시각\nCONNECTED.payload.time 또는 WORLD_TIME_CHECK→WORLD_TIME_STATE의 serverNow/cycleEpochMs=1767193200000/cycleDurationMs=1800000/timeZone=Asia/Seoul 사용. 맵 확인 전 시간 조회 가능하지만 입장 권한은 부여하지 않습니다. 재접속·탭복귀 재조회하며 +9시간 중복 가산 금지. docs/world-time-diagnostics-api.md.\n\n## 기권·패배 공개 연출 (서버 수신 전용)\nWORLD_GAME_REACTION은 새 송신 요청이 아닙니다. 실제 경기 시작 후 기권/패배가 확정되면 같은 채널 참가자와 테이블 중심20m 이내 사용자(비구독자 포함)가 수신합니다. eventId와(gameId,userId)로 기존 GAME_STATE 추론과 중복을 막고, 재접속에 과거 모션을 재생하지 않습니다. 직전2명은 table-flip/2800ms, 나머지는 head-clutch/3600ms입니다. 다리 pendingForfeit 최초 확정만 알리며 손패/정산 정보는 없습니다. 예시: {\"requestId\":null,\"type\":\"WORLD_GAME_REACTION\",\"payload\":{\"eventId\":\"game-1:reaction:202\",\"gameId\":\"game-1\",\"tableId\":\"{{tableIdA}}\",\"channelId\":\"{{channelIdA}}\",\"gameCode\":\"ONE_CARD\",\"version\":7,\"userId\":\"202\",\"kind\":\"FORFEIT\",\"remainingBefore\":3,\"motion\":\"head-clutch\",\"durationMs\":3600,\"occurredAt\":\"2026-10-26T09:00:00Z\"}}\n명세 docs/world-game-reaction-api.md. 코드/로컬검증이며 실제 배포·FE3D 연결은 별도입니다.\n\n원카드 방어: pranks-enabled=true/defense-enabled=true와 FE 두 플래그 공동 활성화 후 사용. 관전자·대상·턴별1회, REACH 후1400ms 내 대상 HIT 승인 시 해당 관전자만3000ms 차단. HIT 없으면 FLIPPED 최대2장(실제 카드정보 없음), 대상 RESTORE 후2500ms 면역. 같은 eventId 재확인은 같은 마감/효과를 반환하고 재방송하지 않음. 새 행동은 새 UUID, 요청 유실은 같은 UUID. REACH_STARTED의 attemptId와 FLIPPED의 eventId를 개인 환경에 복사. 현재 turnCount/targetUserId는 공개 상태에서 가져옴. 구형 HAND_FLIP_SEND는 방어 활성 시 ONECARD_DEFENSE_REQUIRED. docs/onecard-ux-be-spec.md. 배포·실계정3D 검수 별도.\n\n2026-11-03 로컬 QA 계약(배포 전): WORLD_STATE.gameWatches는 회원 ID→{gameId,tableId}의 승인 진행 경기 관전 명부입니다. 참가자/승인 대기/TABLE_WATCH 제외, 동일 회원1명, 종료/퇴장/단절/20m이탈 시 해제. avatars[].activity=WATCHING, 같은 gameId의 명부 수를 표시합니다. 알까기는 예약 확정 후 2.5초 COIN_TOSS/coinTossEndsAt(UTC ISO), 이후 전체12분/첫30초. 추첨 중 액션 NOT_ACTIVE. cardCounts=[홍,청]만 공개, 미사용 ID/종류는 개인 상태에만. itemEffects 최대16건은 사용 확정 {version,turnNumber,actor,type,targets,at(Unix ms)}, gameId+version 중복 방지·최초/재접속 과거 연출 제외. 같은 actionId는 소모/이력 증가 없음. docs/alkkagi-items.md 및 docs/world-spectator-presence-api.md."
"headers":
  -
    "key": "Origin"
    "value": "{{baseUrl}}"
    "description": "서버와 같은 출처. CORS/Origin 허용 범위를 넓히지 않습니다."
"settings":
  "handshakeTimeout": 10000
  "retryCount": 0
  "maxPayload": 1048576
"messages":
  -
    "name": "01 광장 입장"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"CHANNEL_JOIN\",\n  \"payload\": {\n    \"channelId\": \"{{channelIdA}}\"\n  }\n}"
  -
    "name": "02 착석"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"TABLE_JOIN\",\n  \"payload\": {\n    \"tableId\": \"{{tableIdA}}\"\n  }\n}"
  -
    "name": "03 첫 착석자 게임 선택"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_SELECT\",\n  \"payload\": {\n    \"gameCode\": \"OMOK\"\n  }\n}"
  -
    "name": "04 준비"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"READY_SET\",\n  \"payload\": {\n    \"ready\": true\n  }\n}"
  -
    "name": "05 퇴장"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"TABLE_LEAVE\",\n  \"payload\": {}\n}"
  -
    "name": "06 복귀 상태 재조회"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_RECONNECT_CHECK\",\n  \"payload\": {}\n}"
  -
    "name": "07 동일 시작 시도 결과 조회"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_START_CHECK\",\n  \"payload\": {}\n}"
  -
    "name": "08 확정 경기 상태 조회"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_STATE_CHECK\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\"\n  }\n}"
  -
    "name": "수신 예시 · WORLD_STATE motion — 직접 전송 금지·로컬 구현"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": null,\n  \"type\": \"WORLD_STATE\",\n  \"payload\": {\n    \"channelId\": \"{{channelIdA}}\",\n    \"version\": 20,\n    \"mapVersion\": \"{{mapVersion}}\",\n    \"avatars\": [\n      {\n        \"userId\": \"101\",\n        \"nickname\": \"검증자A\",\n        \"characterGender\": \"MALE\",\n        \"equipment\": null,\n        \"tableSeat\": null,\n        \"activity\": null,\n        \"position\": {\n          \"lastInputSeq\": 12,\n          \"x\": 0.2083,\n          \"y\": 0.84,\n          \"z\": 34,\n          \"yaw\": 1.5707963267948966,\n          \"moving\": true,\n          \"running\": false,\n          \"swimming\": false\n        },\n        \"motion\": {\n          \"epoch\": 0,\n          \"tick\": 30,\n          \"appliedInputSeq\": 11,\n          \"inputAgeMs\": 33.333333,\n          \"velocityY\": 0,\n          \"grounded\": true,\n          \"inputActive\": true\n        }\n      }\n    ]\n  }\n}"
  -
    "name": "수신 예시 · NOTES_CHANGED — 직접 전송 금지·로컬 구현"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": null,\n  \"type\": \"NOTES_CHANGED\",\n  \"payload\": {\n    \"revision\": \"1234\"\n  }\n}"
  -
    "name": "수신 예시 · WORLD_STATE tableSeat — 직접 전송 금지·배포 전"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": null,\n  \"type\": \"WORLD_STATE\",\n  \"payload\": {\n    \"channelId\": \"{{channelIdA}}\",\n    \"version\": 12,\n    \"mapVersion\": \"{{mapVersion}}\",\n    \"avatars\": [\n      {\n        \"userId\": \"101\",\n        \"nickname\": \"검증자A\",\n        \"characterGender\": \"MALE\",\n        \"position\": {\n          \"lastInputSeq\": 0,\n          \"x\": -2.025,\n          \"y\": 0.84,\n          \"z\": 34,\n          \"yaw\": 0,\n          \"moving\": false,\n          \"running\": false,\n          \"swimming\": false\n        },\n        \"equipment\": null,\n        \"tableSeat\": {\n          \"tableId\": \"{{tableIdA}}\",\n          \"seatNumber\": 1\n        },\n        \"activity\": \"GAME\"\n      },\n      {\n        \"userId\": \"202\",\n        \"nickname\": \"검증자B\",\n        \"characterGender\": \"FEMALE\",\n        \"position\": {\n          \"lastInputSeq\": 0,\n          \"x\": -2.025,\n          \"y\": 0.84,\n          \"z\": 34,\n          \"yaw\": 0,\n          \"moving\": false,\n          \"running\": false,\n          \"swimming\": false\n        },\n        \"equipment\": null,\n        \"tableSeat\": null,\n        \"activity\": null\n      }\n    ],\n    \"tables\": [\n      {\n        \"tableId\": \"{{tableIdA}}\",\n        \"anchorId\": \"table-5\",\n        \"chairCount\": 3\n      }\n    ]\n  }\n}"
  -
    "name": "수신 예시 · WORLD_EMOTE_CANCELLED — 직접 전송 금지·배포 전"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": null,\n  \"type\": \"WORLD_EMOTE_CANCELLED\",\n  \"payload\": {\n    \"eventId\": \"00000000-0000-4000-8000-000000000002\",\n    \"emoteEventId\": \"00000000-0000-4000-8000-000000000001\",\n    \"channelId\": \"{{channelIdA}}\",\n    \"userId\": \"101\",\n    \"reason\": \"MOVEMENT\",\n    \"sentAt\": \"2026-10-28T00:00:00.100Z\"\n  }\n}"
  -
    "name": "따라가기 01 입장·재접속 관계 조회 → WORLD_FOLLOW_STATE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_FOLLOW_CHECK\",\n  \"payload\": {}\n}"
  -
    "name": "따라가기 02 시작 → WORLD_FOLLOW_STATE (12m·높이2m)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_FOLLOW_START\",\n  \"payload\": {\n    \"targetId\": \"{{followTargetId}}\"\n  }\n}"
  -
    "name": "따라가기 03 종료 → WORLD_FOLLOW_STATE (본인 최신 ID)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_FOLLOW_STOP\",\n  \"payload\": {\n    \"followId\": \"{{followId}}\"\n  }\n}"
  -
    "name": "맵 01 FE 맵 버전 확인 → WORLD_MAP_STATE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_MAP_CONFIRM\",\n  \"payload\": {\n    \"mapId\": \"{{mapId}}\",\n    \"schemaVersion\": 1,\n    \"mapVersion\": \"{{mapVersion}}\"\n  }\n}"
  -
    "name": "태블릿 01 방장 게임·정원·판돈 확정 → TABLE_STATE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"TABLE_CONFIGURE\",\n  \"payload\": {\n    \"gameCode\": \"DICE\",\n    \"targetScore\": 4000,\n    \"selectedPlayers\": 2,\n    \"betAmountPerPlayer\": 5,\n    \"expectedVersion\": {{tableVersion}}\n  }\n}"
  -
    "name": "태블릿 02 준비 — 최신 설정 동의"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"READY_SET\",\n  \"payload\": {\n    \"ready\": true,\n    \"betAmountPerPlayer\": 5,\n    \"expectedVersion\": {{tableVersion}}\n  }\n}"
  -
    "name": "태블릿 03 방장 시작 — 같은 actionId 재확인"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"TABLE_START\",\n  \"payload\": {\n    \"actionId\": \"{{startActionId}}\",\n    \"expectedVersion\": {{tableVersion}}\n  }\n}"
  -
    "name": "태블릿 04 시작 대기 기한 재조회"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"TABLE_HOST_WAIT_CHECK\",\n  \"payload\": {}\n}"
  -
    "name": "시간 01 서버 현재 시각·낮밤 기준 재조회"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_TIME_CHECK\",\n  \"payload\": {}\n}"
  -
    "name": "수신 예시 · START_NOT_CONFIGURED — 서버 알림·직접 전송 금지·배포 전"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": null,\n  \"type\": \"ERROR\",\n  \"payload\": {\n    \"code\": \"START_NOT_CONFIGURED\",\n    \"message\": \"경기 시작 기능이 비활성 상태입니다. 서버의 시작·게임 설정을 확인해주세요.\"\n  }\n}"
  -
    "name": "원카드 장난 01 손 뻗기 — 승인 관전자"
