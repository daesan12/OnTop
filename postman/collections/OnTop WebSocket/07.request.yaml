"name": "07 로그인 사용자 — 1회용 접속권"
"$kind": "websocket-request"
"url": "{{wsUrl}}?ticket={{websocketTicket}}"
"description": "WORLD_MOVE는 {seq,dx,dz,run,jump?} 입력만 허용합니다. seq1~4294967295, dx/dz 각[-1,1] 대각선 정규화, run필수 boolean/jump선택. 서버30Hz·변화100ms동기화·입력50ms·250ms만료. 걷기6.25/달리기9/점프6.2/중력-18/단차0.22. 채널 입장 시 서버 스폰(캡슐 중심), lastInputSeq는 수락순번, mapVersion 대조. 기존 sequence/x/y/z/yaw 주입은 INVALID_PAYLOAD. 재접속30초·채팅/관전20m 유지. 먼저 HTTP10을 보내 30초 접속권을 받으세요. 개인 로컬 websocketTicket에 넣고 즉시 Connect. HTTP10과 같은 Origin을 사용하고 재접속마다 새 접속권을 발급합니다. JWT는 URL에 넣지 않습니다. CONNECTED 내부ID → TABLE_JOIN → GAME_SELECT → READY_SET, 중복 연결1008·heartbeat·30초복구는 기존 계약입니다. 실제 시작은 ontop.game-start.enabled=true + 실제 B GameStartGateway + 사용할 엔진이 필요합니다. 전원 준비 → STARTING → 전원 판돈 예약 커밋 후 PLAYING(simulation=false), GAME_CONNECTION_STATE로 본인 상태/조작권 복구. 시작 시 즉시 차감하지 않고 종료 정산 때 예약 해제·차감·승자 지급을 확정합니다. 실제 DB 처리는 별도입니다. 미확정이면07로 같은 시도를 조회하고 새 예약을 요청하지 않습니다. 개발 rehearsal과 동시 사용 금지. 기본 서버는 시작 옵션을 끈 상태이며 실제 DB Gateway가 없으므로 옵션만 켜서 성공하지 않습니다. 토큰/접속권 원문은 공유·동기화하지 마세요.\n\n2026-10-22 의상 동기화: local,db + ontop.shop.enabled=true. WS07의 인증 사용자 두 명이 같은 채널에 CHANNEL_JOIN 후 본인이 HTTP17로 장착하면 WORLD_STATE.payload.avatars[].equipment가 갱신됩니다. 다른 채널에는 전파하지 않습니다. 새 티켓→재접속→CHANNEL_JOIN 후 최신 장착을 복구합니다. 공개 필드는 itemId/itemCode/equipSlot/imageKey, 최대5개·부위당 하나이며 null은 미조회/사용 불가로 기존 외형 유지, []는 장착 없음입니다. 이동 tick은 캐시를 쓰고 조회 실패는 기존 외형을 유지합니다. 실제 3D 에셋 매핑·렌더링 연동은 별도 협의입니다. 예시: {\"requestId\":null,\"type\":\"WORLD_STATE\",\"payload\":{\"channelId\":\"channel-1\",\"version\":4,\"avatars\":[{\"userId\":\"101\",\"position\":{\"lastInputSeq\":0,\"x\":-2.025,\"y\":0.84,\"z\":34,\"yaw\":0,\"moving\":false,\"running\":false,\"swimming\":false},\"equipment\":[{\"itemId\":1,\"itemCode\":\"RED_TOP\",\"equipSlot\":\"TOP\",\"imageKey\":\"demo-red-top\"}]}],\"mapVersion\":\"544bc6fa3890c77e8de0ec91d27f93981b4d23a477918963757e4762294ba8d0\"}}\n\n2026-10-24 공개 프로필: db 프로필의 인증 사용자로 채널 입장하면 WORLD_STATE.avatars[].nickname/characterGender가 비동기 갱신됩니다. characterGender는 MALE/FEMALE 캐릭터 외형이며 실제 성별이 아닙니다. 최초 미조회·DB 없는 사용자에는 null이며 기존 표시를 지우지 않습니다. 접속 중 회원은 5초마다 일괄 조회하므로 HTTP PATCH /api/v1/users/me로 닉네임 변경 후 다음 조회 완료 때 같은 채널에 반영됩니다. 재접속은 새 티켓→CHANNEL_JOIN. 다른 채널 미노출·클라이언트 프로필 주입 거절·조회 장애 시 기존 값 유지를 확인하세요. 기존 equipment/위치 계약은 유지합니다. 감정표현 5종은 WAVE/CLAP/APPLAUSE_REQUEST/TSK/FART, 손 인사/박수 5초·나머지 1.8초의 FE 간격을 적용합니다. 직전 성공 표현 기준으로 다른 표현도 대기하며 상태별 허용/취소는 별도 확인입니다. FE park-bindings.emotes 매핑·3D 렌더링·배포 확인은 별도입니다."
"headers":
  -
    "key": "Origin"
    "value": "{{baseUrl}}"
    "description": "서버와 같은 출처. CORS/Origin 허용 범위를 넓히지 않습니다."
"settings":
  "handshakeTimeout": 10000
  "retryCount": 0
  "maxPayload": 1048576
"messages":
  -
    "name": "01 광장 입장"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"CHANNEL_JOIN\",\n  \"payload\": {\n    \"channelId\": \"{{channelIdA}}\"\n  }\n}"
  -
    "name": "02 착석"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"TABLE_JOIN\",\n  \"payload\": {\n    \"tableId\": \"{{tableIdA}}\"\n  }\n}"
  -
    "name": "03 첫 착석자 게임 선택"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_SELECT\",\n  \"payload\": {\n    \"gameCode\": \"OMOK\"\n  }\n}"
  -
    "name": "04 준비"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"READY_SET\",\n  \"payload\": {\n    \"ready\": true\n  }\n}"
  -
    "name": "05 퇴장"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"TABLE_LEAVE\",\n  \"payload\": {}\n}"
  -
    "name": "06 복귀 상태 재조회"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_RECONNECT_CHECK\",\n  \"payload\": {}\n}"
  -
    "name": "07 동일 시작 시도 결과 조회"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_START_CHECK\",\n  \"payload\": {}\n}"
  -
    "name": "08 확정 경기 상태 조회"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_STATE_CHECK\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\"\n  }\n}"
