"name": "04 선택적 시작 검증 A — 서버 옵션 필요"
"$kind": "websocket-request"
"url": "{{wsUrl}}"
"description": "WORLD_MOVE는 {seq,dx,dz,run,jump?} 입력만 허용합니다. seq1~4294967295, dx/dz 각[-1,1] 대각선 정규화, run필수 boolean/jump선택. 서버30Hz·변화100ms동기화·입력 평균50ms당1개/일시4개·250ms만료. 걷기6.25/달리기9/점프6.2/중력-18/단차0.22. 채널 입장 시 서버 스폰(캡슐 중심), lastInputSeq는 수락순번, mapVersion 대조. 기존 sequence/x/y/z/yaw 주입은 INVALID_PAYLOAD. 재접속30초·채팅/관전20m 유지. 서버를 --spring.profiles.active=local,visual-test --ontop.start-rehearsal.enabled=true 로 재실행해야 합니다. 아래 B 연결과 함께 사용. 전원 준비 후 STARTING → CONFIRMED이며 실제 차감·경기 실행은 없습니다. 성공 후 좌석은 유지되므로 일반 퇴장 테스트와 섞지 마세요. 새 검증은 서버 재실행 또는 다른 테이블을 사용합니다.\n\n2026-11-03 로컬 QA 계약(배포 전): WORLD_STATE.gameWatches는 회원 ID→{gameId,tableId}의 승인 진행 경기 관전 명부입니다. 참가자/승인 대기/TABLE_WATCH 제외, 동일 회원1명, 종료/퇴장/단절/20m이탈 시 해제. avatars[].activity=WATCHING, 같은 gameId의 명부 수를 표시합니다. 알까기는 예약 확정 후 2.5초 COIN_TOSS/coinTossEndsAt(UTC ISO), 이후 전체12분/첫30초. 추첨 중 액션 NOT_ACTIVE. cardCounts=[홍,청]만 공개, 미사용 ID/종류는 개인 상태에만. itemEffects 최대16건은 사용 확정 {version,turnNumber,actor,type,targets,at(Unix ms)}, gameId+version 중복 방지·최초/재접속 과거 연출 제외. 같은 actionId는 소모/이력 증가 없음. docs/alkkagi-items.md 및 docs/world-spectator-presence-api.md."
"headers":
  -
    "key": "Origin"
    "value": "{{baseUrl}}"
    "description": "서버와 같은 출처. CORS/Origin 허용 범위를 넓히지 않습니다."
"settings":
  "handshakeTimeout": 10000
  "retryCount": 0
  "maxPayload": 1048576
"messages":
  -
    "name": "01 광장 A 입장 → CHANNEL_STATE + WORLD_STATE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"CHANNEL_JOIN\",\n  \"payload\": {\n    \"channelId\": \"{{channelIdA}}\"\n  }\n}"
  -
    "name": "05 A 테이블 착석 → TABLE_STATE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"TABLE_JOIN\",\n  \"payload\": {\n    \"tableId\": \"{{tableIdA}}\"\n  }\n}"
  -
    "name": "06 첫 착석자 오목 선택 → TABLE_STATE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_SELECT\",\n  \"payload\": {\n    \"gameCode\": \"OMOK\"\n  }\n}"
  -
    "name": "07 준비 → TABLE_STATE (잔액 부족 시 ERROR)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"READY_SET\",\n  \"payload\": {\n    \"ready\": true\n  }\n}"
  -
    "name": "08 같은 시작 시도 결과 확인"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_START_CHECK\",\n  \"payload\": {}\n}"
