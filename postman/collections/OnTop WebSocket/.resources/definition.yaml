"name": "OnTop WebSocket"
"$kind": "collection"
"description": "# 근거리 채팅·관전 테스트 (20m)\n\n## 01 연결\nWORLD_MOVE는 {seq,dx,dz,run,jump?} 입력만 허용합니다. seq1\\~4294967295, dx/dz 각\\[-1,1\\] 대각선 정규화, run필수 boolean/jump선택. 서버30Hz·변화100ms동기화·입력50ms·250ms만료. 걷기6.25/달리기9/점프6.2/중력-18/단차0.22. 채널 입장 시 서버 스폰(캡슐 중심), lastInputSeq는 수락순번, mapVersion 대조. 기존 sequence/x/y/z/yaw 주입은 INVALID_PAYLOAD. 재접속30초·채팅/관전20m 유지. Connect 한 번 후 CONNECTED를 확인하고 Saved Messages에서 보냅니다. 메시지마다 새 연결을 만들면 다른 임시 사용자가 됩니다. 기본 흐름: A/B 모두 광장 입장 → 서버 스폰 확인 후 WORLD_MOVE 방향 입력 → A 먼저 착석 → B 착석 → A 게임 선택 → A/B 준비. 채팅은 같은 채널의 보고 위치 기준 XZ 반경 20m(경계 포함) 안에서만 수신합니다. x/z는 1단위=1m이며 위치 미보고 송신은 WORLD_POSITION_REQUIRED입니다. 나머지 추가/오류 메시지는 각 선행조건을 맞춘 뒤 따로 보냅니다. local/dev 기본 감정표현은 WAVE/CLAP/APPLAUSE_REQUEST/TSK/FART 5종이며 직전 표현이 손 인사/박수면 5초, 나머지는 1.8초 뒤 다음 표현을 보냅니다. 활동별 제한은 별도 확인입니다.\n\n## 02 연결\nWORLD_MOVE는 {seq,dx,dz,run,jump?} 입력만 허용합니다. seq1\\~4294967295, dx/dz 각\\[-1,1\\] 대각선 정규화, run필수 boolean/jump선택. 서버30Hz·변화100ms동기화·입력50ms·250ms만료. 걷기6.25/달리기9/점프6.2/중력-18/단차0.22. 채널 입장 시 서버 스폰(캡슐 중심), lastInputSeq는 수락순번, mapVersion 대조. 기존 sequence/x/y/z/yaw 주입은 INVALID_PAYLOAD. 재접속30초·채팅/관전20m 유지. A와 별개 연결입니다. A가 먼저 앉은 다음 05 착석을 보내고, A 게임 선택 후 07 준비를 보냅니다. 채팅 전에는 A/B 모두 방향 입력가 필요합니다. 근거리 검사는 XZ 평면 20m이며 경계도 포함합니다. 양쪽 미착석 상태에서 WORLD_STATE의 실제 서버 위치로 XZ 거리 20m 안/밖을 확인합니다. B가 방향 입력으로 경계/밖/복귀 순서로 이동하고 각 단계에서 A가 채팅을 보냅니다. 경계·복귀에서는 B 수신, 밖에서는 미수신이 정상입니다. 스폰 좌표를 고정값으로 가정하거나 최종 좌표를 주입하지 않습니다. 이동 입력은 50ms·채팅은 1초 이상 간격입니다. A의 상태 변경도 requestId=null 알림으로 들어옵니다. 원카드/거짓말은 2\\~4명이며 추가 탭으로 다른 임시 사용자를 만들 수 있습니다.\n\n## 03 연결\nWORLD_MOVE는 {seq,dx,dz,run,jump?} 입력만 허용합니다. seq1\\~4294967295, dx/dz 각\\[-1,1\\] 대각선 정규화, run필수 boolean/jump선택. 서버30Hz·변화100ms동기화·입력50ms·250ms만료. 걷기6.25/달리기9/점프6.2/중력-18/단차0.22. 채널 입장 시 서버 스폰(캡슐 중심), lastInputSeq는 수락순번, mapVersion 대조. 기존 sequence/x/y/z/yaw 주입은 INVALID_PAYLOAD. 재접속30초·채팅/관전20m 유지. 광장 A 입장·서버 스폰 확인 후 TABLE_WATCH를 보냅니다. 서버 테이블 좌표가 설정되어 있고 중심 20m 이내여야 합니다. 미설정/범위 밖은 TABLE_OUT_OF_RANGE입니다. TABLE_WATCH_STATE를 받으며 좌석·준비 인원은 늘지 않습니다. x/z는 1단위=1m인 서버 판정 위치입니다. 방향 입력을 반복해 실제 테이블 중심에 접근합니다. 거리 초과 이동 시 TABLE_WATCH_LEFT로 종료하고 다시 가까워져도 자동 재구독하지 않습니다. TABLE_WATCH_STATE.payload.gameId는 확정 PLAYING만 문자열이고 그 외null입니다. 시작·종료 때 version이 증가합니다. 이 값을 개인 환경 gameId에 복사하거나 HTTP12로 받아 GAME_WATCH를 별도 요청하세요. null/새ID면 GAME_UNWATCH 후 새ID로 관전합니다. 실제 경기 관전 권한이나 원카드 손패 구독이 아닙니다. 착석 성공 시 구독은 자동 종료됩니다.\n\n## 06 연결\nWORLD_MOVE는 {seq,dx,dz,run,jump?} 입력만 허용합니다. seq1\\~4294967295, dx/dz 각\\[-1,1\\] 대각선 정규화, run필수 boolean/jump선택. 서버30Hz·변화100ms동기화·입력50ms·250ms만료. 걷기6.25/달리기9/점프6.2/중력-18/단차0.22. 채널 입장 시 서버 스폰(캡슐 중심), lastInputSeq는 수락순번, mapVersion 대조. 기존 sequence/x/y/z/yaw 주입은 INVALID_PAYLOAD. 재접속30초·채팅/관전20m 유지. 현재 기본 dev 연결에서 정상 결과는 아래 이름의 오류입니다. 임의 인증 헤더를 넣지 마세요. 오목은 실제 엔진이 있으며 local에서 ontop.games.omok.enabled=true로 선택 활성화합니다. 실제 인증 사용자 검증과 서버 내부 참가 확정 후 경기 생성 연결이 필요합니다. 옵션만 켜거나 04/05 시작 검증을 실행해 실제 오목을 시작할 수는 없습니다. gameId를 실제 경기 ID로 바꿉니다. 오목 input은 x/y 두 필드만 허용하며 각각 0\\~14 정수인 판 좌표입니다. 02 예제는 흑 첫 수(7,7), expectedVersion=0입니다. 이후 최신 GAME_STATE.version과 본인 차례에 맞춰 수정합니다. actionId는 같은 행동 재확인에만 재사용하고 새 행동은 새 ID를 사용합니다. 참가자는 복구 후 입력 성공 시 본인 공개/개인 GAME_STATE를 자동 수신합니다. 관전자는 채널·미터 방향 입력·서버 테이블 좌표와 Gateway 내부 tableId가 필요하며 중심 20m 이내에서 GAME_WATCH합니다. 성공 후 빈 privateState의 GAME_STATE만 수신하며 GAME_UNWATCH 또는 범위 이탈로 해제합니다. GAME_STATE_CHECK의 SPECTATOR도 동일한 범위를 검사합니다. 위치·좌표·내부 tableId 미확인/범위 밖은 GAME_STATE_ACCESS_DENIED입니다. 이동 이탈·채널 퇴장·착석은 GAME_WATCH_LEFT이며 범위 복귀로 자동 재관전하지 않습니다. 방향 입력와 채널 입장은 01\\~03 연결의 예제를 같은 연결에서 사용합니다. 최초 응답은 원래 requestId, 자동 알림은 null입니다. GAME_STATE가 GAME_ACTION_RESULT보다 먼저 올 수 있어 확인은 requestId/actionId, 상태는 version으로 독립 처리합니다. 경기 종료 시 4종 엔진의 서버 종료 알림이 현재 참가자 본인의 저장 결과를 1회 자동 조회합니다. 결과가 있으면 GAME_RESULT(requestId=null)를 수신합니다. 미저장·읽기 실패 때는 가짜 결과/자동 오류를 보내지 않습니다. 이후 DB 담당의 커밋 알림으로 PENDING/null → SETTLED/본인 확정 순증감을 수신하거나 07 GAME_RESULT_CHECK로 재조회합니다. 재접속도 07로 다시 읽습니다. 결과 version과 경기 상태 version은 별개이며 결과 조회는 지급을 실행하지 않습니다.\n\n오목은 15×15 렌주·흑 선공·흑 정확히 5목/백 5개 이상 승리. 흑 33·44·장목은 GAME_ACTION_FORBIDDEN_MOVE로 거절하고 판·버전·차례·턴 마감은 유지합니다. 같은 수의 정확한 5목은 금수보다 우선합니다. 한 수 30초 도달 시 시간패·총시간 제한 없음입니다. 복귀해도 기존 turnDeadline은 유지하며 재접속 유예보다 턴 마감이 먼저면 종료합니다.\n\npublicState에는 gameCode/status, boardSize/board\\[y\\]\\[x\\](0빈칸/1흑/2백), blackUserId/whiteUserId, moveCount/lastMove, turnUserId/turnDeadline, winnerUserId/endReason/endedAt이 있습니다. 참가자·관전자 privateState는 모두 {}입니다. 종료 사유는 FIVE_IN_ROW, BOARD_FULL, TURN_TIMEOUT, RECONNECT_EXPIRED이며 종료 후 차례·턴 마감은 null입니다. 승패 상태는 정산 확정이 아니며 엽전 지급은 별도입니다.\n\n09/10은 02 성공 후 actionId·원래 버전을 유지하고 각각 중복 확인·내용 충돌을 검사합니다. 11은 복귀 조회이며 마감을 연장하지 않습니다. 기본 dev에서는 여전히 인증 오류가 정상이고 경기 성공 시연용이 아닙니다.\n\n주사위(DICE)는 local의 ontop.games.farkle.enabled=true로 선택 활성화하며 서버 내부 참가 확정 후 생성한 경기에서 실행합니다. 12는 최초 굴림,13은 재굴림,14는Bank,15는12의 동일행동 재확인입니다. 13/14는 최신 GAME_STATE.version과 현재 dice의 held=false 득점 ID로 수정하세요. 서로 순차 실행하는 고정 시나리오가 아닙니다. input={kind:roll/bank,selectedIds:중복없는0\\~5정수배열}만 허용합니다. 선택 전체의 겹치지 않는 득점 조합 중 최대합, 굴림 간 조합결합 불가. 1=100,5=50,동일3개는1일때1000/그외눈×100,4·5·6개는2·4·8배,12345=500,23456=750,123456=1500. 최소Bank제한·세쌍보너스 없음. BUST는이번턴만소실,HOT DICE는이번턴유지·6개재굴림. 서버확정목표2000/4000/6000에Bank로도달시즉시승리·상대추가턴없음. 한차례전체30초,재굴림·거절·재접속으로연장하지않으며 만료시저장총점유지·이번턴소실·차례넘김. 오목은기존시간패. publicState:gameCode=DICE,status,players,scores,targetScore,turnTimeLimitMs=30000,turnUserId,turnDeadline,turnScore,dice\\[{id,value,held}\\],stage(AWAITING_ROLL/SELECTING/FINISHED),rollId,round,hotDice,lastEvent,winnerUserId,endReason,endedAt. privateState={},새차례첫굴림전dice=\\[\\]. BANK/BUST는바로다음차례상태를전송하며 프론트가rollId/lastEvent로연출합니다. 종료는TARGET_REACHED/RECONNECT_EXPIRED이며DB정산확정과구분합니다. \n\n수동 기권: GAME_FORFEIT {gameId,actionId}만 허용하며 본인 차례/expectedVersion 불필요. GAME_FORFEIT_RESULT는 {gameId,actionId,version,duplicate}. 동일 경기·참가자는 한번만 확정하고 재전송/재클릭은duplicate:true와최초version. 소켓·로그인·채널을유지하며30초유예없이기권. 본인에게GAME_CONNECTION_STATE PENDING→FINISHED/ELIMINATED, 참가자/허용관전자에게GAME_STATE. 응답과상태순서보장없음. 2인은상대승리,3\\~4인은본인탈락후계속. 서버이벤트GameParticipantLeft EXPLICIT_LEAVE와최종GameFinished는기존DB정산연결계약이며승인응답이정산완료는아님. 종료·다른사유탈락은GAME_FORFEIT_GAME_FINISHED/NOT_ACTIVE,관전자·다른경기·미복구는GAME_RECOVERY_REQUIRED. 늦은오목시간패우선,다리pendingForfeit경계와원카드손패제외유지. 기권취소명령없음·좌석은기존정산후대기정책. 승인유실후새접속권으로FINISHED복구→보존테이블의원래CHANNEL_JOIN→같은기권재확인(duplicate:true). 다른채널TABLE_BUSY. PENDING은다음판차단,저장조회/커밋알림SETTLED후전원다시준비. 과거기권/종료/정산은새경기에미적용. 로컬구현·검증완료/미배포,메모리중복영수증이며재시작·다중서버보장별도.\n\n원카드(ONE_CARD)는2\\~4명·54장·7장배분·서버랜덤선공이며 local의 ontop.games.onecard.enabled=true로 선택 활성화합니다. 2026-10-22확정: 기권손패는이번경기에서제외(REMOVE)하며뽑기덱환원/셔플없음. 다음판은새덱,별도정책설정불필요. 16\\~21은독립예제입니다. gameId/expectedVersion은실제경기·최신버전,cardId는본인privateState.hand,targetUserId는공개players.userId로수정합니다. input kind=play(cardId)/draw/accept-attack/select-suit(suit=hearts,diamonds,clubs,spades)/declare-one/catch-one(targetUserId문자열). 공개상태에는players장수/활성/선언창,topCard/activeSuit,attackTotal/lastAttack,drawCount,stage(PLAYING/CHOOSE_SUIT/FINISHED),direction,extraAction,turnUserId/turnDeadline,turnCount,winnerUserIds/endReason/endedAt. 본인privateState만userId/hand/playableCardIds/canDraw를포함하고관전자privateState={}. 복구state={publicState,privateState}는본인손패·마감유지. 한차례30초,K/무늬선택/재접속으로연장하지않음. 만료시F1대로일반1장/공격누적받고넘김,무늬선택은최다무늬자동선택후넘김(동률hearts,diamonds,clubs,spades순서). 시간패없음. 선언/신고반응창은별도3초·첫유효행동우선·신고2장벌칙·만료만으로자동벌칙없음. 마지막특수카드도효과없이즉시승리. 덱재구성/부족시가능장수/교착최소손패공동승리. 공격/특수카드세부표는docs/onecard.md. 서버승패는DB정산·재화지급과구분하며실제인증·참가확정서버생성이필요합니다. \n\n거짓말다리(LIAR_BRIDGE)는2\\~4명·각7개말,local의ontop.games.bridge.enabled=true와서버내부참가확정경기로실행합니다. 22\\~25는독립예제입니다. 최신gameId/expectedVersion과turnUserId/responderUserId·stage에맞춰사용하고새행동은새actionId를사용합니다. input=roll/declare(value1\\~4)/trust/doubt만허용,눈/승자/추가필드주입은거절합니다. 원본TS의phaseVersion/turnId는input으로보내지않습니다. 굴림·선언·각판단30초. 굴림/선언만료는자동굴림·자동선언없이현재차례넘김,판단만료는믿고다음판단자. 판정연출1.5초입력차단. 복귀는같은눈/기존마감유지. 본인DECLARING/RESPONDING만privateState={userId,turnId,die:1\\~4또는X},상대·관전자·판정후는{}. 모두믿은resolution은actualFace키자체없음,다우트때만actualFace/challengerUserId/wasBluff공개. 공개상태는stage,turnId,turnUserId,responderUserId,turnDeadline,phaseTimeLimitMs30000,resolutionVisualMs1500,declaration,responseOrder,acceptedBy,players(말/점수/기권),goalSlots8개,nextGoalSlot,resolution,operations,lastEvent,winnerUserIds/endReason/endedAt. 슬롯은영구순번1\\~8/VACATED재사용없음. 골인말만있는사람은판단가능,실패시최저슬롯제거. 페널티/이동/슬롯발급/기권적용후승패판정. 3골인우선,8발급/말소진시미기권최고점공동승리. 복구state={publicState,privateState}. 기존20m관전/30초유예유지. 승패는DB정산·지급완료아님. 상세docs/bridge.md. \n\n서버 테이블 좌표가 미설정이면 관전 성공 대신 범위 오류가 정상입니다. 실제 맵 좌표를 임의로 정하지 않습니다. 기존 연결 7개와 저장 메시지 101개를 사용합니다.\n\n2026-10-22: 첫 착석자가 GAME_SELECT의 DICE targetScore를2000/4000/6000 중 선택합니다. 누락 GAME_OPTIONS_REQUIRED, 잘못된 값 INVALID_PAYLOAD이며 목표 변경도 전원 준비를 해제합니다. TABLE_STATE/TABLE_WATCH_STATE/HTTP12 요약에 targetScore가 추가되고 다른 게임은null입니다. 실제 종료 후 좌석 유지·ready=false·SETTLING, 현재 경기 전체 SETTLED 확인 후 WAITING에서 다시 전원 준비하면 새 시도·경기ID로 시작합니다. 정산 알림 누락은 GAME_RESULT_CHECK 재조회로 복구하며 조회는 지급을 실행하지 않습니다. 실제 DB 잔액·원장·정산·운영 적용은 별도 통합 검증입니다.\n\n2026-10-22 의상 동기화: local,db 또는 dev,db + ontop.shop.enabled=true(dev: SHOP_ENABLED=true). WS07의 인증 사용자 두 명이 같은 채널에 CHANNEL_JOIN 후 본인이 HTTP17로 장착하면 WORLD_STATE.payload.avatars[].equipment가 갱신됩니다. 다른 채널에는 전파하지 않습니다. 새 티켓→재접속→CHANNEL_JOIN 후 최신 장착을 복구합니다. 공개 필드는 itemId/itemCode/equipSlot/imageKey, 최대5개·부위당 하나이며 null은 미조회/사용 불가로 기존 외형 유지, []는 장착 없음입니다. 이동 tick은 캐시를 쓰고 조회 실패는 기존 외형을 유지합니다. 실제 3D 에셋 매핑·렌더링 연동은 별도 협의입니다. 예시: {\"requestId\":null,\"type\":\"WORLD_STATE\",\"payload\":{\"channelId\":\"channel-1\",\"version\":4,\"avatars\":[{\"userId\":\"101\",\"position\":{\"lastInputSeq\":0,\"x\":-2.025,\"y\":0.84,\"z\":34,\"yaw\":0,\"moving\":false,\"running\":false,\"swimming\":false},\"equipment\":[{\"itemId\":1,\"itemCode\":\"RED_TOP\",\"equipSlot\":\"TOP\",\"imageKey\":\"demo-red-top\"}]}],\"mapVersion\":\"544bc6fa3890c77e8de0ec91d27f93981b4d23a477918963757e4762294ba8d0\"}}\n\n2026-10-24 공개 프로필: db 프로필의 인증 사용자로 채널 입장하면 WORLD_STATE.avatars[].nickname/characterGender가 비동기 갱신됩니다. characterGender는 MALE/FEMALE 캐릭터 외형이며 실제 성별이 아닙니다. 최초 미조회·DB 없는 사용자에는 null이며 기존 표시를 지우지 않습니다. 접속 중 회원은 5초마다 일괄 조회하므로 HTTP PATCH /api/v1/users/me로 닉네임 변경 후 다음 조회 완료 때 같은 채널에 반영됩니다. 재접속은 새 티켓→CHANNEL_JOIN. 다른 채널 미노출·클라이언트 프로필 주입 거절·조회 장애 시 기존 값 유지를 확인하세요. 기존 equipment/위치 계약은 유지합니다. 감정표현 5종은 WAVE/CLAP/APPLAUSE_REQUEST/TSK/FART, 손 인사/박수 5초·나머지 1.8초입니다. 가만히 서 있을 때만 허용하며 이동·점프 중 공중 상태·수영·테이블(대기 포함)·시설 중은 EMOTE_ACTIVITY_CONFLICT, 기존 경기 복구 게이트는 GAME_RECOVERY_REQUIRED입니다. 승인 후 새 이동/점프·착석·시설 이용은 WORLD_EMOTE_CANCELLED(requestId=null)를 같은 채널에 전송합니다. payload는 eventId/emoteEventId/channelId/userId/reason/sentAt이며 reason은 MOVEMENT/ACTIVITY_STARTED/CHANNEL_LEFT/DISCONNECTED입니다. 프론트는 현재 채널/사용자/재생 원본 eventId와 emoteEventId가 일치할 때만 취소하며 중복·늦은 취소·이미 끝난 표현은 무시합니다. 취소/채널 이동으로 사용 간격은 초기화되지 않습니다. 새 REST나 클라이언트 취소 요청은 없으며 취소 알림 수신은 FE 연결이 필요합니다. FE park-bindings.emotes 매핑·3D 렌더링·배포 확인은 별도입니다.\n\n## 시설 이용·점유 동기화 (2026-10-25)\n\nCHANNEL_JOIN 후 시설01 CATALOG(10개씩 nextOffset, -1종료)→시설02 CHECK(입장·재접속 필수)→시설03/04 USE→시설05 AIM(망원경만)→시설06 RELEASE. 벤치80개×2석, 운동기구12대·망원경2대×1명. 같은 채널 WORLD_FACILITY_STATE.occupancies 전체 상태와 version을 사용합니다. 본인 leaseId를 로컬 facilityLeaseId 변수에 복사하거나05/06 JSON에 직접 넣으세요. 이전 이용 ID·다른 사용자 ID는 거절합니다. 2026-10-25 사용자 확정: 서버 승인 위치 기준 벤치/기구3m·망원경2m, 높이+0.8m±0.7m, 단절 즉시 해제 후 재접속 재이용. 100ms/pitch범위는 현재 FE 설정입니다. 시설 이용 중 일반 감정표현은 금지하며 이용 승인 시 기존 표현을 취소합니다. 이용 중 이동/점프/테이블 착석은 FACILITY_BUSY. 하차 승인 후 WORLD_STATE 위치에서 이동합니다. 망원경 yaw[-π,π],pitch[-1.35,1.15],seq1~4294967295,100ms 간격. 과거seq는 본인 ACK만, 확대/FOV는FE. 단절/채널퇴장 즉시 해제, 재접속 CHECK 후 재이용하며 경기30초유예는 그대로입니다. 위치 주입 API는 없습니다. Postman에서 원거리 USE 오류는 정상이며 성공 검수는 실제 이동 후 요청하세요. 단일 JVM 메모리 점유, 다중 서버·실제 FE 모션·운영 적용은 별도 검수입니다. docs/world-facility-api.md.\n\n## 서버 따라가기\n\n같은 채널의 두 계정이 CHANNEL_JOIN→WORLD_FOLLOW_CHECK 후 대상 WORLD_STATE.payload.avatars[].userId를 followTargetId에 넣고 START합니다. 서버 START/STOP/CHECK 응답·변경 방송은 WORLD_FOLLOW_STATE(channelId/version/links[])입니다. 본인 followerId의 followId를 followId 변수에 복사하고 STOP하세요. 상태는 전체 목록이며 낮은 버전은 무시합니다. 시작 XZ≤12m/높이≤2m, ≤2.2m 대기·>2.2~5m 걷기6.25m/s·>5m 달리기9m/s. 거리>24m/높이>3.5m·단절/퇴장·양쪽 착석/시설/수영은 해제합니다. 승인된 직접 이동/점프는 본인 관계만 해제, 정지 heartbeat는 유지합니다. 장애물은 기존 충돌을 적용하며 우회/자동점프/시간해제는 없습니다. 자동 입력은 lastInputSeq를 소비하지 않고 좌표는 기존 WORLD_STATE로 수신합니다. 서버는 관계를 재접속 시 복구하지 않으므로 캐시를 비우고 CHECK하세요. 늦은 STOP의 다른followId는 FOLLOW_LINK_MISMATCH. 동일 대상 반복 START는 현 상태 ACK, 대상 변경은 새 ID이며 자기자신/순환/범위 밖은 거절합니다. START를 무조건 재전송하지 말고 CHECK로 확인하세요. docs/world-follow-api.md. FE 3D 연결·배포는 별도입니다.\n\n## 맵 버전 확인\nCONNECTED.payload.map은 실제 로딩 맵이며 mapVerificationRequired=true면 확인 전 입장·경기 복구가 보류됩니다. 환경 mapId/mapVersion에는 FE가 사용하는 맵 값을 설정하세요. schemaVersion은 현재 정수1입니다. 서버 값을 맹목적으로 복사하지 마세요. WORLD_MAP_CONFIRM 성공 WORLD_MAP_STATE 후 기존 입장/복구 진행, MAP_VERSION_MISMATCH/REQUIRED는 serverMap으로 안내합니다. 새 연결마다 재확인하며 30초 경기 복구 기한은 연장되지 않습니다. 현재 기본 false, FE 새 맵 적용·배포는 별도. docs/world-map-api.md."
