"name": "02 참가자 B — 두 번째 착석하는 사람"
"$kind": "websocket-request"
"url": "{{wsUrl}}"
"description": "A와 별개 연결입니다. A가 먼저 앉은 다음 05 착석을 보내고, A 게임 선택 후 07 준비를 보냅니다. 채팅 전에는 A/B 모두 위치 보고가 필요합니다. 근거리 검사는 XZ 평면 20m이며 경계도 포함합니다. 거리 예제는 A가 첫 위치(1.5,-2)를 유지하고 양쪽 미착석일 때 사용합니다. B 경계/밖/복귀 순서대로 이동하고 각 단계에서 A가 채팅을 보냅니다. 경계·복귀에서는 B 수신, 밖에서는 미수신이 정상입니다. 이동은 100ms·채팅은 1초 이상 간격입니다. A의 상태 변경도 requestId=null 알림으로 들어옵니다. 원카드/거짓말은 2~4명이며 추가 탭으로 다른 임시 사용자를 만들 수 있습니다."
"headers":
  -
    "key": "Origin"
    "value": "{{baseUrl}}"
    "description": "서버와 같은 출처. CORS/Origin 허용 범위를 넓히지 않습니다."
"settings":
  "handshakeTimeout": 10000
  "retryCount": 0
  "maxPayload": 1048576
"messages":
  -
    "name": "01 광장 A 입장 → CHANNEL_STATE + WORLD_STATE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"CHANNEL_JOIN\",\n  \"payload\": {\n    \"channelId\": \"{{channelIdA}}\"\n  }\n}"
  -
    "name": "위치 보고 → WORLD_STATE (채팅·관전 전 필수, 실제 미터 좌표 사용)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_MOVE\",\n  \"payload\": {\n    \"sequence\": 0,\n    \"x\": 1.5,\n    \"y\": 0,\n    \"z\": -2,\n    \"yaw\": 0\n  }\n}"
  -
    "name": "05 A 테이블 착석 → TABLE_STATE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"TABLE_JOIN\",\n  \"payload\": {\n    \"tableId\": \"{{tableIdA}}\"\n  }\n}"
  -
    "name": "07 준비 → TABLE_STATE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"READY_SET\",\n  \"payload\": {\n    \"ready\": true\n  }\n}"
  -
    "name": "추가 준비 취소 → TABLE_STATE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"READY_SET\",\n  \"payload\": {\n    \"ready\": false\n  }\n}"
  -
    "name": "추가 테이블 퇴장 → TABLE_LEFT"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"TABLE_LEAVE\",\n  \"payload\": {}\n}"
  -
    "name": "추가 광장 퇴장 → CHANNEL_LEFT (착석 중이면 먼저 테이블 퇴장)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"CHANNEL_LEAVE\",\n  \"payload\": {}\n}"
  -
    "name": "거리 1 — A 첫 위치 유지·미착석: 정확히 20m (100ms 후)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_MOVE\",\n  \"payload\": {\n    \"sequence\": 1,\n    \"x\": 21.5,\n    \"y\": 0,\n    \"z\": -2,\n    \"yaw\": 0\n  }\n}"
  -
    "name": "거리 2 — A 첫 위치 유지·미착석: 21m 밖 (100ms 후)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_MOVE\",\n  \"payload\": {\n    \"sequence\": 2,\n    \"x\": 22.5,\n    \"y\": 0,\n    \"z\": -2,\n    \"yaw\": 0\n  }\n}"
  -
    "name": "거리 3 — A 첫 위치로 복귀·미착석 (100ms 후)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_MOVE\",\n  \"payload\": {\n    \"sequence\": 3,\n    \"x\": 1.5,\n    \"y\": 0,\n    \"z\": -2,\n    \"yaw\": 0\n  }\n}"
  -
    "name": "추가 채팅"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_CHAT_SEND\",\n  \"payload\": {\n    \"text\": \"B도 접속했어!\"\n  }\n}"
  -
    "name": "다른 채널 격리 확인 — B 광장으로 (현재 채널 퇴장 후)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"CHANNEL_JOIN\",\n  \"payload\": {\n    \"channelId\": \"{{channelIdB}}\"\n  }\n}"
  -
    "name": "다른 채널 B 테이블 착석"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"TABLE_JOIN\",\n  \"payload\": {\n    \"tableId\": \"{{tableIdB}}\"\n  }\n}"
  -
    "name": "오류 선택권 없음 — A가 먼저 앉았을 때만"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_SELECT\",\n  \"payload\": {\n    \"gameCode\": \"DICE\"\n  }\n}"
