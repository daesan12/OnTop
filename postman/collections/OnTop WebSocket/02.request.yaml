"name": "02 참가자 B — 두 번째 착석하는 사람"
"$kind": "websocket-request"
"url": "{{wsUrl}}"
"description": "WORLD_MOVE는 {seq,dx,dz,run,jump?} 입력만 허용합니다. seq1~4294967295, dx/dz 각[-1,1] 대각선 정규화, run필수 boolean/jump선택. 서버30Hz·변화100ms동기화·입력 평균50ms당1개/일시4개·250ms만료. 걷기6.25/달리기9/점프6.2/중력-18/단차0.22. 채널 입장 시 서버 스폰(캡슐 중심), lastInputSeq는 수락순번, mapVersion 대조. 기존 sequence/x/y/z/yaw 주입은 INVALID_PAYLOAD. 재접속30초·채팅/관전20m 유지. A와 별개 연결입니다. A가 먼저 앉은 다음 05 착석을 보내고, A 게임 선택 후 07 준비를 보냅니다. 채팅 전에는 A/B 모두 방향 입력가 필요합니다. 근거리 검사는 XZ 평면 20m이며 경계도 포함합니다. 양쪽 미착석 상태에서 WORLD_STATE의 실제 서버 위치로 XZ 거리 20m 안/밖을 확인합니다. B가 방향 입력으로 경계/밖/복귀 순서로 이동하고 각 단계에서 A가 채팅을 보냅니다. 경계·복귀에서는 B 수신, 밖에서는 미수신이 정상입니다. 스폰 좌표를 고정값으로 가정하거나 최종 좌표를 주입하지 않습니다. 이동 입력은 50ms·채팅은 1초 이상 간격입니다. A의 상태 변경도 requestId=null 알림으로 들어옵니다. 원카드/거짓말은 2~4명이며 추가 탭으로 다른 임시 사용자를 만들 수 있습니다."
"headers":
  -
    "key": "Origin"
    "value": "{{baseUrl}}"
    "description": "서버와 같은 출처. CORS/Origin 허용 범위를 넓히지 않습니다."
"settings":
  "handshakeTimeout": 10000
  "retryCount": 0
  "maxPayload": 1048576
"messages":
  -
    "name": "01 광장 A 입장 → CHANNEL_STATE + WORLD_STATE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"CHANNEL_JOIN\",\n  \"payload\": {\n    \"channelId\": \"{{channelIdA}}\"\n  }\n}"
  -
    "name": "이동 입력 → WORLD_STATE (채널 입장 시 서버 스폰)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_MOVE\",\n  \"payload\": {\n    \"seq\": 1,\n    \"dx\": 0,\n    \"dz\": -1,\n    \"run\": false,\n    \"jump\": false\n  }\n}"
  -
    "name": "05 A 테이블 착석 → TABLE_STATE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"TABLE_JOIN\",\n  \"payload\": {\n    \"tableId\": \"{{tableIdA}}\"\n  }\n}"
  -
    "name": "07 준비 → TABLE_STATE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"READY_SET\",\n  \"payload\": {\n    \"ready\": true\n  }\n}"
  -
    "name": "추가 준비 취소 → TABLE_STATE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"READY_SET\",\n  \"payload\": {\n    \"ready\": false\n  }\n}"
  -
    "name": "추가 테이블 퇴장 → TABLE_LEFT"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"TABLE_LEAVE\",\n  \"payload\": {}\n}"
  -
    "name": "추가 광장 퇴장 → CHANNEL_LEFT (착석 중이면 먼저 테이블 퇴장)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"CHANNEL_LEAVE\",\n  \"payload\": {}\n}"
  -
    "name": "이동 1 — seq2 걷기 (50ms 후, 수신한 서버 좌표 확인)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_MOVE\",\n  \"payload\": {\n    \"seq\": 2,\n    \"dx\": 0,\n    \"dz\": -1,\n    \"run\": false,\n    \"jump\": false\n  }\n}"
  -
    "name": "이동 2 — seq3 점프 (50ms 후)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_MOVE\",\n  \"payload\": {\n    \"seq\": 3,\n    \"dx\": 0,\n    \"dz\": -1,\n    \"run\": false,\n    \"jump\": true\n  }\n}"
  -
    "name": "이동 3 — seq4 정지 (50ms 후)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_MOVE\",\n  \"payload\": {\n    \"seq\": 4,\n    \"dx\": 0,\n    \"dz\": 0,\n    \"run\": false,\n    \"jump\": false\n  }\n}"
  -
    "name": "추가 채팅"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_CHAT_SEND\",\n  \"payload\": {\n    \"text\": \"B도 접속했어!\"\n  }\n}"
  -
    "name": "다른 채널 격리 확인 — B 광장으로 (현재 채널 퇴장 후)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"CHANNEL_JOIN\",\n  \"payload\": {\n    \"channelId\": \"{{channelIdB}}\"\n  }\n}"
  -
    "name": "다른 채널 B 테이블 착석"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"TABLE_JOIN\",\n  \"payload\": {\n    \"tableId\": \"{{tableIdB}}\"\n  }\n}"
  -
    "name": "오류 선택권 없음 — A가 먼저 앉았을 때만"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_SELECT\",\n  \"payload\": {\n    \"gameCode\": \"DICE\",\n    \"targetScore\": 4000\n  }\n}"
