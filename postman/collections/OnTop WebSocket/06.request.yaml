"name": "06 경기 통신 — 인증·엔진 연동 대기"
"$kind": "websocket-request"
"url": "{{wsUrl}}"
"description": "WORLD_MOVE는 {seq,dx,dz,run,jump?} 입력만 허용합니다. seq1~4294967295, dx/dz 각[-1,1] 대각선 정규화, run필수 boolean/jump선택. 서버30Hz·변화100ms동기화·입력50ms·250ms만료. 걷기6.25/달리기9/점프6.2/중력-18/단차0.22. 채널 입장 시 서버 스폰(캡슐 중심), lastInputSeq는 수락순번, mapVersion 대조. 기존 sequence/x/y/z/yaw 주입은 INVALID_PAYLOAD. 재접속30초·채팅/관전20m 유지. 현재 기본 dev 연결에서 정상 결과는 아래 이름의 오류입니다. 임의 인증 헤더를 넣지 마세요. 오목은 실제 엔진이 있으며 local에서 ontop.games.omok.enabled=true로 선택 활성화합니다. 실제 인증 사용자 검증과 서버 내부 참가 확정 후 경기 생성 연결이 필요합니다. 옵션만 켜거나 04/05 시작 검증을 실행해 실제 오목을 시작할 수는 없습니다. gameId를 실제 경기 ID로 바꿉니다. 오목 input은 x/y 두 필드만 허용하며 각각 0~14 정수인 판 좌표입니다. 02 예제는 흑 첫 수(7,7), expectedVersion=0입니다. 이후 최신 GAME_STATE.version과 본인 차례에 맞춰 수정합니다. actionId는 같은 행동 재확인에만 재사용하고 새 행동은 새 ID를 사용합니다. 참가자는 복구 후 입력 성공 시 본인 공개/개인 GAME_STATE를 자동 수신합니다. 관전자는 채널·미터 방향 입력·서버 테이블 좌표와 Gateway 내부 tableId가 필요하며 중심 20m 이내에서 GAME_WATCH합니다. 성공 후 빈 privateState의 GAME_STATE만 수신하며 GAME_UNWATCH 또는 범위 이탈로 해제합니다. GAME_STATE_CHECK의 SPECTATOR도 동일한 범위를 검사합니다. 위치·좌표·내부 tableId 미확인/범위 밖은 GAME_STATE_ACCESS_DENIED입니다. 이동 이탈·채널 퇴장·착석은 GAME_WATCH_LEFT이며 범위 복귀로 자동 재관전하지 않습니다. 방향 입력와 채널 입장은 01~03 연결의 예제를 같은 연결에서 사용합니다. 최초 응답은 원래 requestId, 자동 알림은 null입니다. GAME_STATE가 GAME_ACTION_RESULT보다 먼저 올 수 있어 확인은 requestId/actionId, 상태는 version으로 독립 처리합니다. 경기 종료 시 4종 엔진의 서버 종료 알림이 현재 참가자 본인의 저장 결과를 1회 자동 조회합니다. 결과가 있으면 GAME_RESULT(requestId=null)를 수신합니다. 미저장·읽기 실패 때는 가짜 결과/자동 오류를 보내지 않습니다. 이후 DB 담당의 커밋 알림으로 PENDING/null → SETTLED/본인 확정 순증감을 수신하거나 07 GAME_RESULT_CHECK로 재조회합니다. 재접속도 07로 다시 읽습니다. 결과 version과 경기 상태 version은 별개이며 결과 조회는 지급을 실행하지 않습니다. 오목은 15×15 렌주·흑 선공·흑 정확히 5목/백 5개 이상 승리. 흑 33·44·장목은 GAME_ACTION_FORBIDDEN_MOVE로 거절하고 판·버전·차례·턴 마감은 유지합니다. 같은 수의 정확한 5목은 금수보다 우선합니다. 한 수 30초 도달 시 시간패·총시간 제한 없음입니다. 복귀해도 기존 turnDeadline은 유지하며 재접속 유예보다 턴 마감이 먼저면 종료합니다. publicState에는 gameCode/status, boardSize/board[y][x](0빈칸/1흑/2백), blackUserId/whiteUserId, moveCount/lastMove, turnUserId/turnDeadline, winnerUserId/endReason/endedAt이 있습니다. 참가자·관전자 privateState는 모두 {}입니다. 종료 사유는 FIVE_IN_ROW, BOARD_FULL, TURN_TIMEOUT, RECONNECT_EXPIRED이며 종료 후 차례·턴 마감은 null입니다. 승패 상태는 정산 확정이 아니며 엽전 지급은 별도입니다. 09/10은 02 성공 후 actionId·원래 버전을 유지하고 각각 중복 확인·내용 충돌을 검사합니다. 11은 복귀 조회이며 마감을 연장하지 않습니다. 기본 dev에서는 여전히 인증 오류가 정상이고 경기 성공 시연용이 아닙니다.\n\n주사위(DICE)는 local의 ontop.games.farkle.enabled=true로 선택 활성화하며 서버 내부 참가 확정 후 생성한 경기에서 실행합니다. 12는 최초 굴림,13은 재굴림,14는Bank,15는12의 동일행동 재확인입니다. 13/14는 최신 GAME_STATE.version과 현재 dice의 held=false 득점 ID로 수정하세요. 서로 순차 실행하는 고정 시나리오가 아닙니다. input={kind:roll/bank,selectedIds:중복없는0~5정수배열}만 허용합니다. 선택 전체의 겹치지 않는 득점 조합 중 최대합, 굴림 간 조합결합 불가. 1=100,5=50,동일3개는1일때1000/그외눈×100,4·5·6개는2·4·8배,12345=500,23456=750,123456=1500. 최소Bank제한·세쌍보너스 없음. BUST는이번턴만소실,HOT DICE는이번턴유지·6개재굴림. 서버확정목표2000/4000/6000에Bank로도달시즉시승리·상대추가턴없음. 한차례전체30초,재굴림·거절·재접속으로연장하지않으며 만료시저장총점유지·이번턴소실·차례넘김. 오목은기존시간패. publicState:gameCode=DICE,status,players,scores,targetScore,turnTimeLimitMs=30000,turnUserId,turnDeadline,turnScore,dice[{id,value,held}],stage(AWAITING_ROLL/SELECTING/FINISHED),rollId,round,hotDice,lastEvent,winnerUserId,endReason,endedAt. privateState={},새차례첫굴림전dice=[]. BANK/BUST는바로다음차례상태를전송하며 프론트가rollId/lastEvent로연출합니다. 종료는TARGET_REACHED/RECONNECT_EXPIRED이며DB정산확정과구분합니다. \n\n수동 기권: GAME_FORFEIT {gameId,actionId}만 허용하며 본인 차례/expectedVersion 불필요. GAME_FORFEIT_RESULT는 {gameId,actionId,version,duplicate}. 동일 경기·참가자는 한번만 확정하고 재전송/재클릭은duplicate:true와최초version. 소켓·로그인·채널을유지하며30초유예없이기권. 본인에게GAME_CONNECTION_STATE PENDING→FINISHED/ELIMINATED, 참가자/허용관전자에게GAME_STATE. 응답과상태순서보장없음. 2인은상대승리,3~4인은본인탈락후계속. 서버이벤트GameParticipantLeft EXPLICIT_LEAVE와최종GameFinished는기존DB정산연결계약이며승인응답이정산완료는아님. 종료·다른사유탈락은GAME_FORFEIT_GAME_FINISHED/NOT_ACTIVE,관전자·다른경기·미복구는GAME_RECOVERY_REQUIRED. 늦은오목시간패우선,다리pendingForfeit경계와원카드손패제외유지. 기권취소명령없음·좌석은기존정산후대기정책. 로컬구현·검증완료/미배포,메모리중복영수증이며재시작·다중서버보장별도.\n\n원카드(ONE_CARD)는2~4명·54장·7장배분·서버랜덤선공이며 local의 ontop.games.onecard.enabled=true로 선택 활성화합니다. 2026-10-22확정: 기권손패는이번경기에서제외(REMOVE)하며뽑기덱환원/셔플없음. 다음판은새덱,별도정책설정불필요. 16~21은독립예제입니다. gameId/expectedVersion은실제경기·최신버전,cardId는본인privateState.hand,targetUserId는공개players.userId로수정합니다. input kind=play(cardId)/draw/accept-attack/select-suit(suit=hearts,diamonds,clubs,spades)/declare-one/catch-one(targetUserId문자열). 공개상태에는players장수/활성/선언창,topCard/activeSuit,attackTotal/lastAttack,drawCount,stage(PLAYING/CHOOSE_SUIT/FINISHED),direction,extraAction,turnUserId/turnDeadline,turnCount,winnerUserIds/endReason/endedAt. 본인privateState만userId/hand/playableCardIds/canDraw를포함하고관전자privateState={}. 복구state={publicState,privateState}는본인손패·마감유지. 한차례30초,K/무늬선택/재접속으로연장하지않음. 만료시F1대로일반1장/공격누적받고넘김,무늬선택은최다무늬자동선택후넘김(동률hearts,diamonds,clubs,spades순서). 시간패없음. 선언/신고반응창은별도3초·첫유효행동우선·신고2장벌칙·만료만으로자동벌칙없음. 마지막특수카드도효과없이즉시승리. 덱재구성/부족시가능장수/교착최소손패공동승리. 공격/특수카드세부표는docs/onecard.md. 서버승패는DB정산·재화지급과구분하며실제인증·참가확정서버생성이필요합니다. \n\n거짓말다리(LIAR_BRIDGE)는2~4명·각7개말,local의ontop.games.bridge.enabled=true와서버내부참가확정경기로실행합니다. 22~25는독립예제입니다. 최신gameId/expectedVersion과turnUserId/responderUserId·stage에맞춰사용하고새행동은새actionId를사용합니다. input=roll/declare(value1~4)/trust/doubt만허용,눈/승자/추가필드주입은거절합니다. 원본TS의phaseVersion/turnId는input으로보내지않습니다. 굴림·선언·각판단30초. 굴림/선언만료는자동굴림·자동선언없이현재차례넘김,판단만료는믿고다음판단자. 판정연출1.5초입력차단. 복귀는같은눈/기존마감유지. 본인DECLARING/RESPONDING만privateState={userId,turnId,die:1~4또는X},상대·관전자·판정후는{}. 모두믿은resolution은actualFace키자체없음,다우트때만actualFace/challengerUserId/wasBluff공개. 공개상태는stage,turnId,turnUserId,responderUserId,turnDeadline,phaseTimeLimitMs30000,resolutionVisualMs1500,declaration,responseOrder,acceptedBy,players(말/점수/기권),goalSlots8개,nextGoalSlot,resolution,operations,lastEvent,winnerUserIds/endReason/endedAt. 슬롯은영구순번1~8/VACATED재사용없음. 골인말만있는사람은판단가능,실패시최저슬롯제거. 페널티/이동/슬롯발급/기권적용후승패판정. 3골인우선,8발급/말소진시미기권최고점공동승리. 복구state={publicState,privateState}. 기존20m관전/30초유예유지. 승패는DB정산·지급완료아님. 상세docs/bridge.md. "
"headers":
  -
    "key": "Origin"
    "value": "{{baseUrl}}"
    "description": "서버와 같은 출처. CORS/Origin 허용 범위를 넓히지 않습니다."
"settings":
  "handshakeTimeout": 10000
  "retryCount": 0
  "maxPayload": 1048576
"messages":
  -
    "name": "01 경기 상태 조회 → dev: GAME_STATE_AUTH_REQUIRED"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_STATE_CHECK\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\"\n  }\n}"
  -
    "name": "02 경기 입력 → dev: GAME_ACTION_AUTH_REQUIRED"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_ACTION_SEND\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\",\n    \"actionId\": \"omok-move-1\",\n    \"expectedVersion\": 0,\n    \"input\": {\n      \"x\": 7,\n      \"y\": 7\n    }\n  }\n}"
  -
    "name": "03 경기 관전 → dev: GAME_STATE_AUTH_REQUIRED"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_WATCH\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\"\n  }\n}"
  -
    "name": "04 경기 관전 종료 → 미구독: GAME_NOT_WATCHING"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_UNWATCH\",\n  \"payload\": {}\n}"
  -
    "name": "05 오류 관전 사용자 위조 → INVALID_PAYLOAD"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_WATCH\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\",\n    \"userId\": 101\n  }\n}"
  -
    "name": "06 오류 음수 경기 버전 → INVALID_PAYLOAD"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_ACTION_SEND\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\",\n    \"actionId\": \"example-action-2\",\n    \"expectedVersion\": -1,\n    \"input\": {}\n  }\n}"
  -
    "name": "07 본인 종료·정산 결과 조회 → dev: GAME_RESULT_AUTH_REQUIRED"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_RESULT_CHECK\",\n  \"payload\": {\n    \"gameSessionId\": \"{{gameId}}\"\n  }\n}"
  -
    "name": "08 오류 정산 금액 지정 → INVALID_PAYLOAD"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_RESULT_CHECK\",\n  \"payload\": {\n    \"gameSessionId\": \"{{gameId}}\",\n    \"myCoinDelta\": 100\n  }\n}"
  -
    "name": "09 오목 같은 수 재확인 — 02 성공 후 같은 계정·경기"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_ACTION_SEND\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\",\n    \"actionId\": \"omok-move-1\",\n    \"expectedVersion\": 0,\n    \"input\": {\n      \"x\": 7,\n      \"y\": 7\n    }\n  }\n}"
  -
    "name": "10 오목 같은 actionId 다른 좌표 — ACTION_ID_CONFLICT"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_ACTION_SEND\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\",\n    \"actionId\": \"omok-move-1\",\n    \"expectedVersion\": 0,\n    \"input\": {\n      \"x\": 8,\n      \"y\": 7\n    }\n  }\n}"
  -
    "name": "11 오목 복귀 조회 — 기존 판·버전·턴 마감 유지"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_RECONNECT_CHECK\",\n  \"payload\": {}\n}"
  -
    "name": "12 주사위 첫 굴림 — DICE 경기·현재 차례·version0"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_ACTION_SEND\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\",\n    \"actionId\": \"dice-roll-1\",\n    \"expectedVersion\": 0,\n    \"input\": {\n      \"kind\": \"roll\",\n      \"selectedIds\": []\n    }\n  }\n}"
  -
    "name": "13 주사위 재굴림 — 0번이 득점할 때·최신 버전으로 수정"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_ACTION_SEND\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\",\n    \"actionId\": \"dice-roll-2\",\n    \"expectedVersion\": 1,\n    \"input\": {\n      \"kind\": \"roll\",\n      \"selectedIds\": [\n        0\n      ]\n    }\n  }\n}"
  -
    "name": "14 주사위 Bank — 0번이 득점할 때·최신 버전으로 수정"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_ACTION_SEND\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\",\n    \"actionId\": \"dice-bank-1\",\n    \"expectedVersion\": 1,\n    \"input\": {\n      \"kind\": \"bank\",\n      \"selectedIds\": [\n        0\n      ]\n    }\n  }\n}"
  -
    "name": "15 주사위 동일 첫 굴림 재확인 — 12와 같은 계정·경기"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_ACTION_SEND\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\",\n    \"actionId\": \"dice-roll-1\",\n    \"expectedVersion\": 0,\n    \"input\": {\n      \"kind\": \"roll\",\n      \"selectedIds\": []\n    }\n  }\n}"
  -
    "name": "16 원카드 제출 — 본인 손패 cardId·최신 버전으로 수정"
