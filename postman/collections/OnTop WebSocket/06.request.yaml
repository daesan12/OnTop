"name": "06 경기 통신 — 인증·엔진 연동 대기"
"$kind": "websocket-request"
"url": "{{wsUrl}}"
"description": "WORLD_MOVE는 {seq,dx,dz,run,jump?} 입력만 허용합니다. seq1~4294967295, dx/dz 각[-1,1] 대각선 정규화, run필수 boolean/jump선택. 서버30Hz·변화100ms동기화·입력50ms·250ms만료. 걷기6.25/달리기9/점프6.2/중력-18/단차0.22. 채널 입장 시 서버 스폰(캡슐 중심), lastInputSeq는 수락순번, mapVersion 대조. 기존 sequence/x/y/z/yaw 주입은 INVALID_PAYLOAD. 재접속30초·채팅/관전20m 유지. 현재 기본 dev 연결에서 정상 결과는 아래 이름의 오류입니다. 임의 인증 헤더를 넣지 마세요. 오목은 실제 엔진이 있으며 local에서 ontop.games.omok.enabled=true로 선택 활성화합니다. 실제 인증 사용자 검증과 서버 내부 참가 확정 후 경기 생성 연결이 필요합니다. 옵션만 켜거나 04/05 시작 검증을 실행해 실제 오목을 시작할 수는 없습니다. gameId를 실제 경기 ID로 바꿉니다. 오목 input은 x/y 두 필드만 허용하며 각각 0~14 정수인 판 좌표입니다. 02 예제는 흑 첫 수(7,7), expectedVersion=0입니다. 이후 최신 GAME_STATE.version과 본인 차례에 맞춰 수정합니다. actionId는 같은 행동 재확인에만 재사용하고 새 행동은 새 ID를 사용합니다. 참가자는 복구 후 입력 성공 시 본인 공개/개인 GAME_STATE를 자동 수신합니다. 관전자는 채널·미터 방향 입력·서버 테이블 좌표와 Gateway 내부 tableId가 필요하며 중심 20m 이내에서 GAME_WATCH합니다. 성공 후 빈 privateState의 GAME_STATE만 수신하며 GAME_UNWATCH 또는 범위 이탈로 해제합니다. GAME_STATE_CHECK의 SPECTATOR도 동일한 범위를 검사합니다. 위치·좌표·내부 tableId 미확인/범위 밖은 GAME_STATE_ACCESS_DENIED입니다. 이동 이탈·채널 퇴장·착석은 GAME_WATCH_LEFT이며 범위 복귀로 자동 재관전하지 않습니다. 방향 입력와 채널 입장은 01~03 연결의 예제를 같은 연결에서 사용합니다. 최초 응답은 원래 requestId, 자동 알림은 null입니다. GAME_STATE가 GAME_ACTION_RESULT보다 먼저 올 수 있어 확인은 requestId/actionId, 상태는 version으로 독립 처리합니다. 오목은 15×15 렌주·흑 선공·흑 정확히 5목/백 5개 이상 승리. 흑 33·44·장목은 GAME_ACTION_FORBIDDEN_MOVE로 거절하고 판·버전·차례·턴 마감은 유지합니다. 같은 수의 정확한 5목은 금수보다 우선합니다. 한 수 30초 도달 시 시간패·총시간 제한 없음입니다. 복귀해도 기존 turnDeadline은 유지하며 재접속 유예보다 턴 마감이 먼저면 종료합니다. publicState에는 gameCode/status, boardSize/board[y][x](0빈칸/1흑/2백), blackUserId/whiteUserId, moveCount/lastMove, turnUserId/turnDeadline, winnerUserId/endReason/endedAt이 있습니다. 참가자·관전자 privateState는 모두 {}입니다. 종료 사유는 FIVE_IN_ROW, BOARD_FULL, TURN_TIMEOUT, RECONNECT_EXPIRED이며 종료 후 차례·턴 마감은 null입니다. 승패 상태는 정산 확정이 아니며 엽전 지급은 별도입니다. 09/10은 02 성공 후 actionId·원래 버전을 유지하고 각각 중복 확인·내용 충돌을 검사합니다. 11은 복귀 조회이며 마감을 연장하지 않습니다. 기본 dev에서는 여전히 인증 오류가 정상이고 경기 성공 시연용이 아닙니다.\n\n주사위(DICE)는 local의 ontop.games.farkle.enabled=true로 선택 활성화하며 서버 내부 참가 확정 후 생성한 경기에서 실행합니다. 12는 최초 굴림,13은 재굴림,14는Bank,15는12의 동일행동 재확인입니다. 13/14는 최신 GAME_STATE.version과 현재 dice의 held=false 득점 ID로 수정하세요. 서로 순차 실행하는 고정 시나리오가 아닙니다. input={kind:roll/bank,selectedIds:중복없는0~5정수배열}만 허용합니다. 선택 전체의 겹치지 않는 득점 조합 중 최대합, 굴림 간 조합결합 불가. 1=100,5=50,동일3개는1일때1000/그외눈×100,4·5·6개는2·4·8배,12345=500,23456=750,123456=1500. 최소Bank제한·세쌍보너스 없음. BUST는이번턴만소실,HOT DICE는이번턴유지·6개재굴림. 서버확정목표2000/4000/6000에Bank로도달시즉시승리·상대추가턴없음. 한차례전체30초,재굴림·거절·재접속으로연장하지않으며 만료시저장총점유지·이번턴소실·차례넘김. 오목은기존시간패. publicState:gameCode=DICE,status,players,scores,targetScore,turnTimeLimitMs=30000,turnUserId,turnDeadline,turnScore,dice[{id,value,held}],stage(AWAITING_ROLL/SELECTING/FINISHED),rollId,round,hotDice,lastEvent,winnerUserId,endReason,endedAt. privateState={},새차례첫굴림전dice=[]. BANK/BUST는바로다음차례상태를전송하며 프론트가rollId/lastEvent로연출합니다. 종료는TARGET_REACHED/RECONNECT_EXPIRED이며DB정산확정과구분합니다. "
"headers":
  -
    "key": "Origin"
    "value": "{{baseUrl}}"
    "description": "서버와 같은 출처. CORS/Origin 허용 범위를 넓히지 않습니다."
"settings":
  "handshakeTimeout": 10000
  "retryCount": 0
  "maxPayload": 1048576
"messages":
  -
    "name": "01 경기 상태 조회 → dev: GAME_STATE_AUTH_REQUIRED"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_STATE_CHECK\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\"\n  }\n}"
  -
    "name": "02 경기 입력 → dev: GAME_ACTION_AUTH_REQUIRED"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_ACTION_SEND\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\",\n    \"actionId\": \"omok-move-1\",\n    \"expectedVersion\": 0,\n    \"input\": {\n      \"x\": 7,\n      \"y\": 7\n    }\n  }\n}"
  -
    "name": "03 경기 관전 → dev: GAME_STATE_AUTH_REQUIRED"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_WATCH\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\"\n  }\n}"
  -
    "name": "04 경기 관전 종료 → 미구독: GAME_NOT_WATCHING"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_UNWATCH\",\n  \"payload\": {}\n}"
  -
    "name": "05 오류 관전 사용자 위조 → INVALID_PAYLOAD"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_WATCH\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\",\n    \"userId\": 101\n  }\n}"
  -
    "name": "06 오류 음수 경기 버전 → INVALID_PAYLOAD"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_ACTION_SEND\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\",\n    \"actionId\": \"example-action-2\",\n    \"expectedVersion\": -1,\n    \"input\": {}\n  }\n}"
  -
    "name": "07 본인 종료·정산 결과 조회 → dev: GAME_RESULT_AUTH_REQUIRED"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_RESULT_CHECK\",\n  \"payload\": {\n    \"gameSessionId\": \"{{gameId}}\"\n  }\n}"
  -
    "name": "08 오류 정산 금액 지정 → INVALID_PAYLOAD"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_RESULT_CHECK\",\n  \"payload\": {\n    \"gameSessionId\": \"{{gameId}}\",\n    \"myCoinDelta\": 100\n  }\n}"
  -
    "name": "09 오목 같은 수 재확인 — 02 성공 후 같은 계정·경기"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_ACTION_SEND\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\",\n    \"actionId\": \"omok-move-1\",\n    \"expectedVersion\": 0,\n    \"input\": {\n      \"x\": 7,\n      \"y\": 7\n    }\n  }\n}"
  -
    "name": "10 오목 같은 actionId 다른 좌표 — ACTION_ID_CONFLICT"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_ACTION_SEND\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\",\n    \"actionId\": \"omok-move-1\",\n    \"expectedVersion\": 0,\n    \"input\": {\n      \"x\": 8,\n      \"y\": 7\n    }\n  }\n}"
  -
    "name": "11 오목 복귀 조회 — 기존 판·버전·턴 마감 유지"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_RECONNECT_CHECK\",\n  \"payload\": {}\n}"
  -
    "name": "12 주사위 첫 굴림 — DICE 경기·현재 차례·version0"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_ACTION_SEND\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\",\n    \"actionId\": \"dice-roll-1\",\n    \"expectedVersion\": 0,\n    \"input\": {\n      \"kind\": \"roll\",\n      \"selectedIds\": []\n    }\n  }\n}"
  -
    "name": "13 주사위 재굴림 — 0번이 득점할 때·최신 버전으로 수정"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_ACTION_SEND\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\",\n    \"actionId\": \"dice-roll-2\",\n    \"expectedVersion\": 1,\n    \"input\": {\n      \"kind\": \"roll\",\n      \"selectedIds\": [\n        0\n      ]\n    }\n  }\n}"
  -
    "name": "14 주사위 Bank — 0번이 득점할 때·최신 버전으로 수정"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_ACTION_SEND\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\",\n    \"actionId\": \"dice-bank-1\",\n    \"expectedVersion\": 1,\n    \"input\": {\n      \"kind\": \"bank\",\n      \"selectedIds\": [\n        0\n      ]\n    }\n  }\n}"
  -
    "name": "15 주사위 동일 첫 굴림 재확인 — 12와 같은 계정·경기"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_ACTION_SEND\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\",\n    \"actionId\": \"dice-roll-1\",\n    \"expectedVersion\": 0,\n    \"input\": {\n      \"kind\": \"roll\",\n      \"selectedIds\": []\n    }\n  }\n}"
