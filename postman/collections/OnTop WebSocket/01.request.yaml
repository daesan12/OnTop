"name": "01 참가자 A — 먼저 착석하는 사람"
"$kind": "websocket-request"
"url": "{{wsUrl}}"
"description": "WORLD_MOVE는 {seq,dx,dz,run,jump?} 입력만 허용합니다. seq1~4294967295, dx/dz 각[-1,1] 대각선 정규화, run필수 boolean/jump선택. 서버30Hz·변화100ms동기화·입력 평균50ms당1개/일시4개·250ms만료. 걷기6.25/달리기9/점프6.2/중력-18/단차0.22. 채널 입장 시 서버 스폰(캡슐 중심), lastInputSeq는 수락순번, mapVersion 대조. 기존 sequence/x/y/z/yaw 주입은 INVALID_PAYLOAD. 재접속30초·채팅/관전20m 유지. Connect 한 번 후 CONNECTED를 확인하고 Saved Messages에서 보냅니다. 메시지마다 새 연결을 만들면 다른 임시 사용자가 됩니다. 기본 흐름: A/B 모두 광장 입장 → 서버 스폰 확인 후 WORLD_MOVE 방향 입력 → A 먼저 착석 → B 착석 → A 게임 선택 → A/B 준비. 채팅은 같은 채널의 보고 위치 기준 XZ 반경 20m(경계 포함) 안에서만 수신합니다. x/z는 1단위=1m이며 위치 미보고 송신은 WORLD_POSITION_REQUIRED입니다. 나머지 추가/오류 메시지는 각 선행조건을 맞춘 뒤 따로 보냅니다. local/dev 기본 감정표현은 WAVE/CLAP/APPLAUSE_REQUEST/TSK/FART 5종이며 직전 표현이 손 인사/박수면 5초, 나머지는 1.8초 뒤 다음 표현을 보냅니다. 활동별 제한은 별도 확인입니다.\n\n2026-11-03 로컬 QA 계약(배포 전): WORLD_STATE.gameWatches는 회원 ID→{gameId,tableId}의 승인 진행 경기 관전 명부입니다. 참가자/승인 대기/TABLE_WATCH 제외, 동일 회원1명, 종료/퇴장/단절/20m이탈 시 해제. avatars[].activity=WATCHING, 같은 gameId의 명부 수를 표시합니다. 알까기는 예약 확정 후 2.5초 COIN_TOSS/coinTossEndsAt(UTC ISO), 이후 전체12분/첫30초. 추첨 중 액션 NOT_ACTIVE. cardCounts=[홍,청]만 공개, 미사용 ID/종류는 개인 상태에만. itemEffects 최대16건은 사용 확정 {version,turnNumber,actor,type,targets,at(Unix ms)}, gameId+version 중복 방지·최초/재접속 과거 연출 제외. 같은 actionId는 소모/이력 증가 없음. docs/alkkagi-items.md 및 docs/world-spectator-presence-api.md."
"headers":
  -
    "key": "Origin"
    "value": "{{baseUrl}}"
    "description": "서버와 같은 출처. CORS/Origin 허용 범위를 넓히지 않습니다."
"settings":
  "handshakeTimeout": 10000
  "retryCount": 0
  "maxPayload": 1048576
"messages":
  -
    "name": "01 광장 A 입장 → CHANNEL_STATE + WORLD_STATE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"CHANNEL_JOIN\",\n  \"payload\": {\n    \"channelId\": \"{{channelIdA}}\"\n  }\n}"
  -
    "name": "02 걷기 입력 seq1 → WORLD_STATE (미착석)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_MOVE\",\n  \"payload\": {\n    \"seq\": 1,\n    \"dx\": 0,\n    \"dz\": -1,\n    \"run\": false,\n    \"jump\": false\n  }\n}"
  -
    "name": "추가 달리기 입력 seq2 → WORLD_STATE (50ms 후·미착석)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_MOVE\",\n  \"payload\": {\n    \"seq\": 2,\n    \"dx\": 0,\n    \"dz\": -1,\n    \"run\": true,\n    \"jump\": false\n  }\n}"
  -
    "name": "03 채팅 → WORLD_CHAT_MESSAGE (1초 간격)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_CHAT_SEND\",\n  \"payload\": {\n    \"text\": \"안녕! Postman으로 테스트 중이야 👋\"\n  }\n}"
  -
    "name": "04 손흔들기 → WORLD_EMOTE_EVENT (다음 사용 5초)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_EMOTE_SEND\",\n  \"payload\": {\n    \"emoteCode\": \"WAVE\"\n  }\n}"
  -
    "name": "05 A 테이블 착석 → TABLE_STATE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"TABLE_JOIN\",\n  \"payload\": {\n    \"tableId\": \"{{tableIdA}}\"\n  }\n}"
  -
    "name": "06 첫 착석자 오목 선택 → TABLE_STATE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_SELECT\",\n  \"payload\": {\n    \"gameCode\": \"OMOK\"\n  }\n}"
  -
    "name": "07 준비 → TABLE_STATE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"READY_SET\",\n  \"payload\": {\n    \"ready\": true\n  }\n}"
  -
    "name": "추가 준비 취소 → TABLE_STATE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"READY_SET\",\n  \"payload\": {\n    \"ready\": false\n  }\n}"
  -
    "name": "추가 테이블 퇴장 → TABLE_LEFT"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"TABLE_LEAVE\",\n  \"payload\": {}\n}"
  -
    "name": "추가 광장 퇴장 → CHANNEL_LEFT (착석 중이면 먼저 테이블 퇴장)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"CHANNEL_LEAVE\",\n  \"payload\": {}\n}"
  -
    "name": "추가 광장 B 입장 (A 퇴장 후)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"CHANNEL_JOIN\",\n  \"payload\": {\n    \"channelId\": \"{{channelIdB}}\"\n  }\n}"
  -
    "name": "추가 박수 → WORLD_EMOTE_EVENT (다음 사용 5초)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_EMOTE_SEND\",\n  \"payload\": {\n    \"emoteCode\": \"CLAP\"\n  }\n}"
  -
    "name": "추가 박수 부탁 → WORLD_EMOTE_EVENT (다음 사용 1.8초)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_EMOTE_SEND\",\n  \"payload\": {\n    \"emoteCode\": \"APPLAUSE_REQUEST\"\n  }\n}"
  -
    "name": "추가 에잉 쯧쯧 → WORLD_EMOTE_EVENT (다음 사용 1.8초)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_EMOTE_SEND\",\n  \"payload\": {\n    \"emoteCode\": \"TSK\"\n  }\n}"
  -
    "name": "추가 방귀 → WORLD_EMOTE_EVENT (다음 사용 1.8초)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_EMOTE_SEND\",\n  \"payload\": {\n    \"emoteCode\": \"FART\"\n  }\n}"
  -
    "name": "추가 첫 착석자 DICE 선택 (전원 준비 초기화)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_SELECT\",\n  \"payload\": {\n    \"gameCode\": \"DICE\",\n    \"targetScore\": 4000\n  }\n}"
  -
    "name": "추가 첫 착석자 ONE_CARD 선택 (전원 준비 초기화)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_SELECT\",\n  \"payload\": {\n    \"gameCode\": \"ONE_CARD\"\n  }\n}"
  -
    "name": "추가 첫 착석자 LIAR_BRIDGE 선택 (전원 준비 초기화)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_SELECT\",\n  \"payload\": {\n    \"gameCode\": \"LIAR_BRIDGE\"\n  }\n}"
  -
    "name": "오류 미등록 감정표현 → EMOTE_NOT_SUPPORTED"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_EMOTE_SEND\",\n  \"payload\": {\n    \"emoteCode\": \"NOT_REGISTERED\"\n  }\n}"
  -
    "name": "오류 없는 테이블 → TABLE_NOT_FOUND"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"TABLE_JOIN\",\n  \"payload\": {\n    \"tableId\": \"not-a-table\"\n  }\n}"
  -
    "name": "오류 사용자 위조 필드 → INVALID_PAYLOAD"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_CHAT_SEND\",\n  \"payload\": {\n    \"text\": \"위조 거절 확인\",\n    \"userId\": \"someone-else\"\n  }\n}"
  -
    "name": "오류 미구현 PING JSON → UNSUPPORTED_MESSAGE_TYPE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"PING\",\n  \"payload\": {}\n}"
  -
    "name": "연동 전 경기 복구 조회 → dev에서는 RECOVERY_NOT_AVAILABLE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_RECONNECT_CHECK\",\n  \"payload\": {}\n}"
  -
    "name": "연동 전 경기 상태 조회 → dev에서는 GAME_STATE_AUTH_REQUIRED"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_STATE_CHECK\",\n  \"payload\": {\n    \"gameId\": \"{{gameId}}\"\n  }\n}"
  -
    "name": "연동 전 시작 조회 → 기본 모드는 UNSUPPORTED_MESSAGE_TYPE"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"GAME_START_CHECK\",\n  \"payload\": {}\n}"
  -
    "name": "시설 01 목록 → WORLD_FACILITY_CATALOG (10개씩)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_FACILITY_CATALOG\",\n  \"payload\": {}\n}"
  -
    "name": "시설 02 점유 조회 → WORLD_FACILITY_STATE (입장·재접속 필수)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_FACILITY_CHECK\",\n  \"payload\": {}\n}"
  -
    "name": "시설 03 벤치 이용 → WORLD_FACILITY_STATE (서버 근접 필요)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_FACILITY_USE\",\n  \"payload\": {\n    \"facilityId\": \"bench-0\",\n    \"seatIndex\": 0\n  }\n}"
  -
    "name": "시설 04 망원경 이용 → WORLD_FACILITY_STATE (정상 접근 필요)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_FACILITY_USE\",\n  \"payload\": {\n    \"facilityId\": \"telescope-1\",\n    \"seatIndex\": 0\n  }\n}"
  -
    "name": "시설 05 망원경 방향 → WORLD_FACILITY_STATE (100ms 간격)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_FACILITY_AIM\",\n  \"payload\": {\n    \"leaseId\": \"{{facilityLeaseId}}\",\n    \"seq\": 1,\n    \"yaw\": 0.5,\n    \"pitch\": -0.2\n  }\n}"
  -
    "name": "시설 06 반납 → WORLD_FACILITY_STATE (본인 leaseId)"
    "$kind": "websocket-message"
    "contentType": "json"
    "content": "{\n  \"requestId\": \"{{$guid}}\",\n  \"type\": \"WORLD_FACILITY_RELEASE\",\n  \"payload\": {\n    \"leaseId\": \"{{facilityLeaseId}}\"\n  }\n}"
